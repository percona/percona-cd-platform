apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Root lives in the built-in `default` project so it can create the
  # `platform` AppProject (argocd-bootstrap/projects/platform.yaml) on
  # first sync without a chicken-and-egg. Every downstream Application
  # uses `project: platform`.
  project: default
  source:
    repoURL: https://github.com/nogueiraanderson/percona-ci-platform
    targetRevision: HEAD
    path: argocd-bootstrap
    directory:
      recurse: true
      include: '{projects,applicationsets}/**.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

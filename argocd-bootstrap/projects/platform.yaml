apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform addons + Jenkins masters for percona-ci-platform cluster.
  # Deny auto-sync to singleton Jenkins masters; manual sync stays allowed.
  # Named EXPLICITLY (never `jenkins-*`): the live jenkins-ingress and
  # jenkins-endpoint-reconciler addon Applications are in THIS project and a
  # glob would freeze them. Add each new master's Application name here.
  # See ADR 0025.
  syncWindows:
    - kind: deny
      schedule: '* * * * *'
      duration: 24h
      applications:
        - jenkins-ps3-k8s
      manualSync: true
      timeZone: Europe/Berlin
  sourceRepos:
    - https://github.com/Percona/percona-cd-platform
    - https://argoproj.github.io/argo-helm
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://prometheus-community.github.io/helm-charts
    - https://charts.external-secrets.io
    - https://grafana.github.io/helm-charts
    - oci://public.ecr.aws/karpenter
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

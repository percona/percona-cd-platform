apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jenkins-masters
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  enabled: 'true'
          - git:
              repoURL: https://github.com/Percona/percona-cd-platform
              revision: HEAD
              directories:
                - path: resources/jenkins/master/instances/*
  template:
    metadata:
      name: 'jenkins-{{ path.basename }}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/Percona/percona-cd-platform
        targetRevision: HEAD
        path: resources/jenkins/master
        helm:
          valueFiles:
            - values-base.yaml
            - 'instances/{{ path.basename }}/values.yaml'
      destination:
        server: '{{ server }}'
        namespace: 'jenkins-{{ path.basename }}'
      # Manual sync, no selfHeal/prune: a Jenkins master is a single-replica
      # stateful controller (a SPOF). Auto-sync would roll it on every digest
      # bump with no window. A digest/config change lands OutOfSync; an operator
      # runs `argocd app sync` in a maintenance window. See ADR 0025.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

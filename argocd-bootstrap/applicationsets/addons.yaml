apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  enabled: 'true'
          - git:
              repoURL: https://github.com/nogueiraanderson/percona-ci-platform
              revision: HEAD
              directories:
                - path: resources/addons/*
  template:
    metadata:
      name: '{{ path.basename }}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/nogueiraanderson/percona-ci-platform
        targetRevision: HEAD
        path: '{{ path }}'
        helm:
          valueFiles: [values.yaml]
          # valuesObject is merged on top of values.yaml. Source of truth for
          # every cloud-shaped value lives in terraform/variables.tf and lands
          # here via the cluster-secret annotations (see argocd.tf).
          # Unknown keys are ignored by addons that don't declare them — Helm
          # does not error on extra values, so the same valuesObject can be
          # broadcast to every addon Application.
          valuesObject:
            aws:
              region: '{{ metadata.annotations.aws_region }}'
              accountId: '{{ metadata.annotations.aws_account_id }}'
              clusterName: '{{ metadata.annotations.cluster_name }}'
              albCertificateArn: '{{ metadata.annotations.acm_wildcard_arn }}'
              albControllerRoleArn: '{{ metadata.annotations.alb_controller_role_arn }}'
              externalDnsRoleArn: '{{ metadata.annotations.external_dns_role_arn }}'
              ebsCsiRoleArn: '{{ metadata.annotations.ebs_csi_role_arn }}'
              externalSecretsRoleArn: '{{ metadata.annotations.external_secrets_role_arn }}'
              karpenterQueue: '{{ metadata.annotations.karpenter_sqs_name }}'

            # kube-prometheus-stack overrides — Grafana hostname comes from
            # terraform var.grafana_hostname. Other addons ignore this key.
            kube-prometheus-stack:
              grafana:
                ingress:
                  hosts:
                    - '{{ metadata.annotations.grafana_hostname }}'

            # LGTM bucket-name overrides. Each chart's umbrella values.yaml
            # uses placeholders that this block fills from the cluster-secret
            # annotations (terraform/argocd.tf, fed by terraform/lgtm-storage.tf).
            # Charts that don't declare a matching dep ignore these keys.
            mimir-distributed:
              mimir:
                structuredConfig:
                  common:
                    storage:
                      s3:
                        bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  blocks_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  alertmanager_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  ruler_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
            loki:
              loki:
                storage:
                  bucketNames:
                    chunks: '{{ metadata.annotations.loki_bucket_name }}'
                    ruler: '{{ metadata.annotations.loki_bucket_name }}'
                    admin: '{{ metadata.annotations.loki_bucket_name }}'
            tempo-distributed:
              storage:
                trace:
                  s3:
                    bucket: '{{ metadata.annotations.tempo_bucket_name }}'
      destination:
        server: '{{ server }}'
        namespace: '{{ path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

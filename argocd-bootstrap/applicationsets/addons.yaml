apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  enabled: 'true'
          - git:
              repoURL: https://github.com/nogueiraanderson/percona-ci-platform
              revision: HEAD
              directories:
                - path: resources/addons/*
  template:
    metadata:
      name: '{{ path.basename }}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/nogueiraanderson/percona-ci-platform
        targetRevision: HEAD
        path: '{{ path }}'
        helm:
          valueFiles: [values.yaml]
          # valuesObject is merged on top of values.yaml. Source of truth for
          # every cloud-shaped value lives in terraform/variables.tf and lands
          # here via the cluster-secret annotations (see argocd.tf).
          # Unknown keys are ignored by addons that don't declare them — Helm
          # does not error on extra values, so the same valuesObject can be
          # broadcast to every addon Application.
          valuesObject:
            aws:
              region: '{{ metadata.annotations.aws_region }}'
              accountId: '{{ metadata.annotations.aws_account_id }}'
              clusterName: '{{ metadata.annotations.cluster_name }}'
              albCertificateArn: '{{ metadata.annotations.acm_wildcard_arn }}'
              albControllerRoleArn: '{{ metadata.annotations.alb_controller_role_arn }}'
              externalDnsRoleArn: '{{ metadata.annotations.external_dns_role_arn }}'
              ebsCsiRoleArn: '{{ metadata.annotations.ebs_csi_role_arn }}'
              externalSecretsRoleArn: '{{ metadata.annotations.external_secrets_role_arn }}'
              karpenterQueue: '{{ metadata.annotations.karpenter_sqs_name }}'

            # kube-prometheus-stack overrides — Grafana hostname comes from
            # terraform var.grafana_hostname. Other addons ignore this key.
            kube-prometheus-stack:
              grafana:
                ingress:
                  hosts:
                    - '{{ metadata.annotations.grafana_hostname }}'

            # LGTM bucket-name overrides. Each chart's umbrella values.yaml
            # uses placeholders that this block fills from the cluster-secret
            # annotations (terraform/argocd.tf, fed by terraform/lgtm-storage.tf).
            # Charts that don't declare a matching dep ignore these keys.
            mimir-distributed:
              mimir:
                structuredConfig:
                  common:
                    storage:
                      s3:
                        bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  blocks_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  alertmanager_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
                  ruler_storage:
                    s3:
                      bucket_name: '{{ metadata.annotations.mimir_bucket_name }}'
            loki:
              loki:
                storage:
                  bucketNames:
                    chunks: '{{ metadata.annotations.loki_bucket_name }}'
                    ruler: '{{ metadata.annotations.loki_bucket_name }}'
                    admin: '{{ metadata.annotations.loki_bucket_name }}'
            tempo-distributed:
              storage:
                trace:
                  s3:
                    bucket: '{{ metadata.annotations.tempo_bucket_name }}'

            # Standalone Grafana — datasource URLs are constructed in-cluster
            # (Service DNS). Grafana SAML was removed: OSS doesn't ship the
            # SAML feature (Enterprise-only). The Authentik bridge takes over
            # — Grafana talks OIDC to Authentik, Authentik talks SAML to Duo.
            # PR-A3 (#28) drops the now-dead resources/addons/grafana/templates/
            # external-secret-saml.yaml + values SAML block entirely.
            grafana:
              ingress:
                hosts:
                  - '{{ metadata.annotations.grafana_hostname }}'

            # Alloy gateway — public ALB hostnames for external pushers.
            # Wrapper chart: `ingress.hosts` MUST be top-level. The wrapper's
            # templates/ingress.yaml reads `.Values.ingress.hosts` directly
            # (the only real subchart is `alloy`, see alloy-gateway/Chart.yaml).
            # Nesting under `alloy-gateway:` lands the values at
            # `.Values.alloy-gateway.ingress.hosts`, which the wrapper never
            # reads, so the Ingress conditional renders nothing and the ALB +
            # Route53 records are never created (NXDOMAIN). Same trap as the
            # authentik `host` / `saml` block below; PS-10997 Phase 2.5
            # follow-up.
            ingress:
              hosts:
                mimir: '{{ metadata.annotations.lgtm_push_mimir }}'
                loki: '{{ metadata.annotations.lgtm_push_loki }}'
                tempo: '{{ metadata.annotations.lgtm_push_tempo }}'

            # AWS LBC — pass vpcId so the controller skips IMDS at boot.
            # Without this, the controller's `failed to fetch VPC ID from
            # instance metadata` crash loops because the system NG enforces
            # IMDSv2 hop_limit=1 (terraform/eks.tf hardening #10).
            aws-load-balancer-controller:
              vpcId: '{{ metadata.annotations.cluster_vpc_id }}'

            # Authentik — SAML SP to Duo (HD-30780), OIDC IdP to Grafana
            # (and later Jenkins masters, ArgoCD UI). Top-level keys
            # match the wrapper chart's local-scope values (host, saml.*).
            # Per the wrapper-vs-subchart trap from the Grafana SAML PR,
            # `host` and `saml` MUST be top-level (not nested under
            # `authentik:`) — the chart-wrapper templates read
            # `.Values.saml.*` and `.Values.host`, not `.Values.authentik.*`.
            host: '{{ metadata.annotations.authentik_hostname }}'
            saml:
              enabled: '{{ metadata.annotations.authentik_saml_enabled }}'
              idpMetadataB64: '{{ metadata.annotations.authentik_saml_idp_metadata_b64 }}'

            # Authentik server's ingress.hosts — chart subchart key.
            # Single Ingress, joins the existing jenkins-cd ALB group.
            # Upstream chart wants hosts as a list of bare strings.
            authentik:
              server:
                ingress:
                  hosts:
                    - '{{ metadata.annotations.authentik_hostname }}'
      destination:
        server: '{{ server }}'
        namespace: '{{ path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

# cdpctl: the central operational CLI for this repo (ADR 0032). The justfile
# dispatches to it via `uv run --locked cdpctl <sub>`; uv.lock is the single
# source of dependency truth (update only via an explicit `uv lock`).
[project]
name = "cdpctl"
version = "0.1.0"
description = "Central operational CLI for percona-cd-platform, dispatched via just"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-hcl2>=4.3",
]

[project.scripts]
cdpctl = "cdpctl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "ruff>=0.15",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdpctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus import order, pyupgrade, and bugbear.
extend-select = ["I", "UP", "B"]

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: install zizmor
        run: pipx install zizmor==1.24.1

      - name: zizmor
        run: zizmor --quiet .github/workflows/

  terraform:
    name: tofu fmt + validate + trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6

      - name: tofu fmt -check
        run: tofu fmt -recursive -check -diff

      - name: tofu init -backend=false
        working-directory: terraform
        run: tofu init -backend=false

      - name: tofu validate
        working-directory: terraform
        run: tofu validate

      # tflint is intentionally not run — its terraform plugin (v0.14.x bundled
      # with tflint 0.62.0) doesn't understand OpenTofu 1.8+ early-eval syntax
      # (`module.source = local.modules.<name>.source`), which we use as the
      # single source of truth for module pins (versions.tf, decision D11).
      # Re-enable when the ruleset adds early-eval support.

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: '1'
          # `.terraform/` is the vendored module cache populated by `tofu init`
          # above; skip it so we only scan our own .tf, not the modules' internals.
          skip-dirs: terraform/.terraform
          # tfplan: a saved plan produced by `tofu plan -out=tfplan` for local dev.
          # Trivy descends into the snapshot and re-flags the modules' internals;
          # gitignored so CI never sees it, listed here as belt-and-suspenders.
          skip-files: terraform/tfplan
          # Per-rule allowlist with rationale; see .trivyignore for entries.
          trivyignores: .trivyignore

  yaml:
    name: yamllint + kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip install yamllint
        run: pip install yamllint==1.38.0

      - name: yamllint
        run: yamllint -s argocd-bootstrap/ resources/ .github/

      - name: install kubeconform
        run: |
          curl -sSL -o kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tgz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform
        run: |
          # Grafana dashboard JSONs under resources/addons/grafana/dashboards/
          # are not K8s manifests; ignore them.
          # resources/addons/*/files/ holds upstream-shipped artefacts
          # (e.g. mimir-mixin-rules.yaml) that are read via `.Files.Get`
          # in templates and only become valid manifests after Helm
          # rendering -- skip them at file-level validation.
          kubeconform -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern '(Chart|values.*)\.yaml' \
            -ignore-filename-pattern '.*/templates/.*' \
            -ignore-filename-pattern '.*/files/.*' \
            -ignore-filename-pattern '.*/dashboards/.*\.json' \
            -ignore-filename-pattern '.*/clouds-catalog/.*' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd-bootstrap/ resources/

  helm:
    name: jenkins chart render-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install helm (pinned + sha-verified)
        run: |
          curl -sSL -o helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/

      # Render the per-instance Jenkins controller chart and assert the values
      # reach the `jenkins` subchart (image / Retain PVC / ALB group / JNLP
      # listener / node-pool pin). Guards the jenkins:-scoping regression.
      - name: jenkins chart render-check
        run: scripts/jenkins-chart-render-check.sh

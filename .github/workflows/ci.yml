name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Always-on (no top-level path filter): a skipped workflow leaves the required
# `ci-gate` check pending and would block merges. Jobs are cheap and run on
# every change; gate on `ci-gate` in branch protection.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One check = one job. Jobs run in parallel; only the aggregate `ci-gate`
  # depends on them. Steps are grouped into a job only when they share
  # expensive setup (tofu init -> validate; yamllint + kubeconform share
  # Python); otherwise they are split so one failure never masks another.

  lint:
    name: actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/actions-lint

  tofu:
    name: opentofu fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.6
      - name: tofu fmt -check
        run: tofu fmt -recursive -check -diff
      # Conventions gate: Owner banners, no copyright/CLAUDE.md/ticket-ID
      # comments in .tf (terraform/CLAUDE.md) + the scripts/ allowlist freeze
      # (ADR 0032). Stdlib-only, so it runs on the bare system python with no
      # project env (cdpctl.cli dispatches lazily).
      - name: terraform conventions + scripts allowlist
        run: PYTHONPATH=src python3 -m cdpctl conventions
      # init + validate share the provider cache, so they stay in one job
      # (job filesystems do not persist between jobs).
      - name: tofu init -backend=false
        working-directory: terraform
        run: tofu init -backend=false
      # tflint is intentionally NOT run after validate: its terraform plugin
      # doesn't understand OpenTofu 1.8+ early-eval
      # (`module.source = local.modules.<x>.source`), which this repo uses as
      # the single source of truth for module pins.
      - name: tofu validate
        working-directory: terraform
        run: tofu validate

  trivy-config:
    name: trivy config scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Split from `tofu` so a Trivy finding never hides a fmt/validate failure.
    # The config scan is static (no tofu init needed); skip the vendored module
    # cache and the local plan snapshot.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: terraform/.terraform
          skip-files: terraform/tfplan
          trivyignores: .trivyignore

  yaml:
    name: yamllint + kubeconform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pip install yamllint + pyyaml
        run: pip install yamllint==1.38.0 pyyaml
      - name: yamllint
        run: yamllint -s argocd-bootstrap/ resources/ .github/
      - name: install kubeconform
        run: |
          curl -sSL -o kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tgz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform
        run: |
          # Grafana dashboard JSONs under resources/addons/grafana/dashboards/
          # are not K8s manifests; ignore them.
          # resources/addons/*/files/ holds upstream-shipped artefacts
          # (e.g. mimir-mixin-rules.yaml) that are read via `.Files.Get`
          # in templates and only become valid manifests after Helm
          # rendering -- skip them at file-level validation.
          kubeconform -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern '(Chart|values.*)\.yaml' \
            -ignore-filename-pattern '.*/templates/.*' \
            -ignore-filename-pattern '.*/files/.*' \
            -ignore-filename-pattern '.*/dashboards/.*\.json' \
            -ignore-filename-pattern '.*/clouds-catalog/.*' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd-bootstrap/ resources/

  clouds-catalog-drift:
    name: clouds catalog drift (ADR 0029)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Split from `yaml`: a different tool/concern. Assert each master's committed
    # JCasC clouds configScript stays in sync with the shared catalog AND carries
    # no YAML anchors/aliases (JCasC SnakeYAML caps aliases at 50 -- the reload
    # fails above that).
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: render-clouds drift + no-alias check
        run: uv run --locked cdpctl clouds check ps3

  helm-render:
    name: jenkins chart render-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: install helm (pinned + sha-verified)
        run: |
          curl -sSL -o helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/
      # Render the per-instance Jenkins controller chart and assert the values
      # reach the `jenkins` subchart (image / Retain PVC / ALB group / JNLP
      # listener / node-pool pin). Guards the jenkins:-scoping regression.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: jenkins chart render-check
        run: uv run --locked cdpctl helm-render-check

  lambda-pytest:
    name: cleanup-lambda tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pure-Python + moto, no AWS credentials. Stays on setup-python + pip: the
    # lambda test env is pinned to the Lambda runtime python and its own
    # requirements.txt, independent of the root cdpctl uv project.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'  # match the Lambda runtime
          cache: 'pip'
          cache-dependency-path: terraform/lambdas/tests/requirements.txt
      - name: install test deps
        run: pip install -r terraform/lambdas/tests/requirements.txt
      - name: pytest
        run: python -m pytest terraform/lambdas/tests

  cdpctl:
    name: cdpctl lint + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The central CLI package (ADR 0032): ruff format/check, ty, pytest, all
    # from the committed uv.lock (--locked never re-resolves).
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: ruff format --check
        run: uv run --locked ruff format --check src
      - name: ruff check
        run: uv run --locked ruff check src
      - name: ty check
        run: uv run --locked ty check src
      - name: pytest
        run: uv run --locked pytest -q --cov=cdpctl --cov-report=term-missing:skip-covered tests

  ci-gate:
    name: ci-gate
    # The single required status check for branch protection. Runs even when a
    # dependency fails/skips (if: always()) and asserts each result is success
    # or an intentional skip; fails on failure/cancelled.
    if: always()
    needs:
      - lint
      - tofu
      - trivy-config
      - yaml
      - clouds-catalog-drift
      - helm-render
      - lambda-pytest
      - cdpctl
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: assert all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "dependency results: $RESULTS"
          if [ -z "$RESULTS" ]; then echo "::error::no dependency results"; exit 1; fi
          IFS=',' read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a required job result was '$r'"; exit 1 ;;
            esac
          done
          echo "all required jobs passed"

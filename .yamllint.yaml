extends: default

# Helm chart templates/ dirs are Go-templated YAML, yamllint can't parse
# the `{{ }}` sigils. They get validated server-side by ArgoCD + kubeconform
# (which renders templates first via `helm template`).
#
# resources/addons/*/files/ holds upstream-shipped artefacts checked in
# verbatim (e.g. mimir-mixin-rules.yaml from grafana/mimir compiled
# bundle). Reformatting them would drift them from upstream; they are
# read via `.Files.Get` and yield a valid Kubernetes object after Helm
# rendering, which kubeconform then validates.
#
# resources/jenkins/clouds-catalog/ is generator data (ADR 0029): it carries
# byte-faithful shell init scripts (long apt-repo / docker lines). It is not a
# Kubernetes manifest; it is validated by `just clouds-render-check` (catalog vs
# the committed configScript) + the chart render-check, not by yamllint.
ignore: |
  resources/addons/*/templates/
  resources/addons/*/files/
  resources/jenkins/clouds-catalog/

rules:
  line-length:
    max: 200
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

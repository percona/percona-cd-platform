apiVersion: apps/v1
kind: Deployment
metadata:
  name: limits-burst
  namespace: karpenter-validation
  annotations:
    karpenter-test/notes: |
      Each replica requests 4 CPU. NodePool `default` has limits.cpu=200.
      At replicas=51 the cumulative request (~204 CPU) exceeds the pool
      cap; some pods MUST stay Pending and Karpenter should emit an event
      referencing the NodePool limit.
spec:
  replicas: 51
  selector:
    matchLabels: { app: limits-burst }
  template:
    metadata:
      labels: { app: limits-burst }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-small
  namespace: karpenter-validation
spec:
  replicas: 5
  selector:
    matchLabels: { app: burst-small }
  template:
    metadata:
      labels: { app: burst-small }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: do-not-disrupt
  namespace: karpenter-validation
spec:
  replicas: 1
  selector:
    matchLabels: { app: do-not-disrupt }
  template:
    metadata:
      labels: { app: do-not-disrupt }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi

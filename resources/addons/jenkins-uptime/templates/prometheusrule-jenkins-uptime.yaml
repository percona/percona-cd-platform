{{/*
Recording rules for the master uptime probes. The Alloy DS
`mimir.rules.kubernetes "ruler"` component discovers PrometheusRule
resources cluster-wide with empty selectors and syncs them to the Mimir
ruler, where they evaluate against the probe_* series (this addon's Probe
CRs) and the hetzner_* series the masters push through alloy-gateway.

Rules within a group evaluate sequentially per cycle, so the chained
references below are safe. The uptime alert group (MasterDown,
PushPipelineStale, ...) stays deferred until probe flap behaviour has been
observed (see Chart.yaml). The one alert below rides on a 15-minute window
plus a heartbeat and does not depend on probe flap.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jenkins-uptime
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: jenkins-uptime
    app.kubernetes.io/component: rules
spec:
  groups:
    - name: jenkins-uptime.rules
      rules:
        - record: jenkins:master_http_up
          expr: max by (master, path) (probe_success{job=~"jenkins-uptime-(internal|external)"})
        # The subquery (max_over_time over timestamp()) keeps the freshness
        # series emitting for 24h after a master's push stops (the raw series
        # go stale after 5m); staleness must not silently hide a dead push
        # pipeline. 5m resolution still recovers the exact last-sample
        # timestamp because each step's staleness lookback covers the gap.
        - record: jenkins:master_last_push_age_seconds
          expr: time() - max by (master) (max_over_time(timestamp(hetzner_api_rate_limit_remaining)[24h:5m]))
        - record: jenkins:master_push_fresh
          expr: jenkins:master_last_push_age_seconds < bool 300
        # Healthy = internal AND external probe up AND pushing metrics.
        # Each path is required explicitly (not min over whatever paths
        # happen to exist) so a Probe whose series disappears entirely
        # drops the master from this rule (absent, the fleet count turns
        # red) instead of letting the surviving path report a false
        # healthy. External-only masters (no peering Service) are
        # exempted from the internal requirement, derived from the
        # values inventory.
        {{- $externalOnly := list }}
        {{- range .Values.masters }}
        {{- if not .internal }}
        {{- $externalOnly = append $externalOnly .master }}
        {{- end }}
        {{- end }}
        - record: jenkins:master_healthy
          expr: |
            (
                (jenkins:master_http_up{path="external"} == bool 1)
              * on (master)
                (jenkins:master_http_up{path="internal"} == bool 1)
            {{- if $externalOnly }}
              or
                sum by (master) (jenkins:master_http_up{path="external",master=~"{{ join "|" $externalOnly }}"} == bool 1)
            {{- end }}
            )
            * on (master)
            jenkins:master_push_fresh
        # Log liveness. jenkins:master_log_lines:count15m is recorded by
        # the Loki ruler (prometheusrule-jenkins-logs-loki.yaml) and
        # remote-written here. A master with no line in the window has no
        # sample rather than 0, so the `or` fills a 0 for every master that
        # has a push-freshness series. logHeartbeat.groovy (init.groovy.d)
        # writes one INFO line per minute on every master, so 0 here means
        # the JUL root level dropped, the file handler detached, or the
        # Alloy tail or Loki push died, never an idle master.
        - record: jenkins:master_logs_fresh
          expr: |
            (jenkins:master_log_lines:count15m > bool 0)
              or
            (jenkins:master_push_fresh * 0)
    - name: jenkins-uptime.alerts
      rules:
        # Metrics still arrive but no jenkins.log line (heartbeat included)
        # reached Loki for 15 minutes. Gated on push freshness so a master
        # that is down entirely does not also page here. `for` absorbs a
        # Loki ruler restart, which leaves a short remote-write gap.
        # The Mimir Alertmanager routes to a receiver without integrations
        # (ADR 0031), so this shows in Alertmanager and the dashboards
        # until a Slack receiver lands.
        - alert: JenkinsMasterLogsSilent
          expr: jenkins:master_logs_fresh == 0 and on (master) jenkins:master_push_fresh == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No jenkins.log line reached Loki for 15 minutes while metrics still arrive
            description: >-
              Check the java.util.logging root level and handlers on the master
              (Manage Jenkins > System Log, or the Script Console), that
              /var/log/jenkins/jenkins.log grows, that the master-side Alloy
              tails it, and the loki-push path. Runbook: docs/observability.md,
              Log liveness.
        # Engineer SSH roster sync (ADR 0046). The per-master SSM association
        # runs engineer-keys-sync.sh every 30 minutes, which drops a textfile
        # metric that the master-side Alloy unix exporter scrapes. Three
        # failure modes, three alerts: the run fails (roster not applied,
        # last good keys kept), no run has succeeded for two hours (the
        # association stopped or keeps failing), or a master pushes host
        # metrics but has never reported a run (association missing).
        - alert: EngineerKeysSyncFailing
          expr: max by (master) (engineer_keys_sync_last_run_success) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The engineer SSH roster sync has been failing on {{ "{{" }} $labels.master {{ "}}" }} for an hour
            description: >-
              The last run did not apply the roster in full. Before the roster
              file is published nothing changes on the host, a degraded run
              publishes what it could and keeps the failing slugs' previous
              keys, and a failure after publication names its stage (sshd
              reload, prune). Nobody loses access from a failed run, but a
              revocation may be pending. Read the association output (just
              engineers-status, then the SSM association execution) and the
              engineer-keys-sync journal on the master. Runbook:
              docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysSyncStale
          expr: time() - max by (master) (engineer_keys_sync_last_success_timestamp_seconds) > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No successful engineer SSH roster sync on {{ "{{" }} $labels.master {{ "}}" }} for two hours
            description: >-
              Four scheduled runs have not applied the roster. Check that the
              engineer-keys SSM association exists and targets the current
              instance id, and that the master can reach SSM and percona.com.
              Runbook: docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysSyncMissing
          expr: count by (master) (node_uname_info{role="master"}) unless count by (master) (engineer_keys_sync_last_run_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.master {{ "}}" }} pushes host metrics but has never reported an engineer SSH roster sync"
            description: >-
              The master-side Alloy runs but no engineer-keys-sync metric has
              arrived. Either the association was never created for this
              master (check terraform/master-<inst>.tf opts in) or Alloy lacks
              the textfile collector: a master rebuilt while the user-data pin
              of install-master-observability.sh predates the collector needs
              the current scripts/install-master-observability.sh run once.
              Runbook: docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysSyncDegraded
          expr: max by (master) (engineer_keys_sync_degraded_slugs) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.master {{ "}}" }} kept previous keys for a slug the feed failed to serve for an hour"
            description: >-
              A transient feed failure (timeout, 5xx, malformed body) has
              lasted an hour for at least one roster slug. That slug keeps the
              keys it already had, everybody else converged. Check the slug
              named in the association output and percona.com. Runbook:
              docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysSlugMissing
          expr: max by (master) (engineer_keys_sync_slugs_missing) > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "The roster names a slug percona.com no longer publishes a key for"
            description: >-
              The feed answers 404 for a roster slug, so that engineer has no
              key installed (IT revoked it or the slug is misspelled). Remove
              the slug from the roster with just engineers-set. Runbook:
              docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysVersionSkew
          expr: max(engineer_keys_sync_roster_version) - on () group_right () engineer_keys_sync_roster_version > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.master {{ "}}" }} has not applied the roster version the rest of the fleet runs"
            description: >-
              Another master applied a newer roster version an hour ago and
              this one still reports an older one, so a revocation may not
              have landed here. Trigger the association (just engineers-set
              with the current roster) and read its output. Runbook:
              docs/observability.md, Engineer keys sync.
        - alert: EngineerKeysLegacyPrunePending
          expr: max by (master) (engineer_keys_sync_legacy_pruned) == 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.master {{ "}}" }} still carries legacy engineer keys in authorized_keys"
            description: >-
              The roster is applied but the one-time prune of the legacy
              authorized_keys is blocked (sshd has not confirmed the drop-in,
              instance metadata is unavailable, or no key pair line was
              found). Until it runs, keys from before this mechanism may still
              grant access. Runbook: docs/observability.md, Engineer keys sync.
        # Change visibility. Every legitimate roster change is a PutParameter in
        # CloudTrail and bumps the version below. A key set that changes with
        # no version change came from the feed, which is IT rotating or
        # removing a key, or something worse.
        - alert: EngineerKeysRosterChanged
          expr: changes(engineer_keys_sync_roster_version[1h]) > 0
          labels:
            severity: info
          annotations:
            summary: "Engineer SSH roster changed on {{ "{{" }} $labels.master {{ "}}" }}, expect a matching PutParameter in CloudTrail"
        - alert: EngineerKeysFeedChanged
          expr: count by (master) (last_over_time(engineer_keys_sync_keyset_info[6h])) > 1 unless on (master) changes(engineer_keys_sync_roster_version[6h]) > 0
          labels:
            severity: info
          annotations:
            summary: "The installed engineer key set on {{ "{{" }} $labels.master {{ "}}" }} changed without a roster change"
            description: >-
              percona.com served a different key set for the same roster, so a
              key was rotated or removed upstream. Confirm with the engineer or
              IT that the change is expected. Runbook: docs/observability.md,
              Engineer keys sync.

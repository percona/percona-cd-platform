apiVersion: v2
name: prometheus-node-exporter
version: 0.1.0
description: |
  Standalone prometheus-node-exporter — DaemonSet emitting per-node
  CPU / memory / disk / network / pressure metrics. Decoupled from
  kube-prometheus-stack (LGTM-only, ADR 0016). The ServiceMonitor it
  ships is picked up by the Alloy DS's prometheus.operator.servicemonitors
  component and pushed to Mimir.
type: application
dependencies:
  - name: prometheus-node-exporter
    version: 4.55.0
    repository: https://prometheus-community.github.io/helm-charts

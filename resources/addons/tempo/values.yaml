# Grafana Tempo — distributed-mode topology, S3-backed.
#
# storage.trace.s3.bucket is a placeholder — actual value comes from the
# addons ApplicationSet valuesObject (see argocd-bootstrap/applicationsets/
# addons.yaml), which reads cluster-secret annotations populated by
# terraform/lgtm-storage.tf. Pod Identity (terraform/pod-identity.tf) maps
# namespace=tempo + SA=tempo to the IAM role with S3 + KMS access scoped
# to the bucket below.
tempo-distributed:
  serviceAccount:
    create: true
    name: tempo

  storage:
    trace:
      backend: s3
      s3:
        bucket: REPLACE_VIA_APPSET
        region: us-east-1
        endpoint: s3.us-east-1.amazonaws.com

  # Isolate Tempo's memberlist from neighbouring Mimir/Loki rings. Without
  # this, gossip cross-pollinates: foreign stacks land in the `collectors`
  # ring, queries fan out to wrong-API ingesters, and the Unimplemented
  # gRPC errors on neighbouring stacks (e.g. cortex.Ingester on Loki) ripple
  # outward. Set a stack-unique label and enforce verification.
  memberlist:
    cluster_label: "tempo-percona-ci"
    cluster_label_verification_disabled: false

  # Distributed-mode replicas. Stateful tier (ingester, compactor) pinned to
  # the `lgtm-stateful` Karpenter pool; stateless edges (distributor,
  # querier, queryFrontend) stay on the `default` Karpenter pool with
  # hostname topologySpread.
  distributor:
    replicas: 3
    priorityClassName: platform-default
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: distributor
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_http:
              endpoint: 0.0.0.0:14268
        zipkin:
          endpoint: 0.0.0.0:9411

  ingester:
    replicas: 3
    priorityClassName: platform-stateful-high
    podDisruptionBudget:
      maxUnavailable: 1
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    # Chart default is zoneAwareReplication.enabled=false (labelled
    # EXPERIMENTAL upstream). Our Tempo bucket has effectively no
    # historical trace data (master-side trace push still gated), so the
    # chart's data-migration warning is moot -- enable now to match the
    # Mimir/Loki shape and force one-ingester-per-AZ placement.
    #
    # Per-zone nodeSelector override required because the chart drops the
    # top-level ingester.nodeSelector for zone-aware StatefulSets.
    zoneAwareReplication:
      enabled: true
      zones:
        - name: zone-a
          nodeSelector:
            workload.percona.com/tier: lgtm-stateful
        - name: zone-b
          nodeSelector:
            workload.percona.com/tier: lgtm-stateful
        - name: zone-c
          nodeSelector:
            workload.percona.com/tier: lgtm-stateful
    persistence:
      enabled: true
      size: 30Gi
      storageClass: gp3

  querier:
    replicas: 2
    priorityClassName: platform-default
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: querier

  queryFrontend:
    replicas: 2
    priorityClassName: platform-default
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: query-frontend

  compactor:
    replicas: 1
    priorityClassName: platform-stateful-high
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

  # metricsGenerator emits service-graph + span metrics; defer until we
  # have a real trace volume. Enabling later is a values-file edit.
  metricsGenerator:
    enabled: false

  minio:
    enabled: false

  # Self-monitoring via ServiceMonitors so Tempo's own components
  # (distributor, ingester, querier, query-frontend, compactor) get
  # scraped by the cluster Alloy and pushed back into Mimir. Required
  # for any future Tempo operational dashboard (the official Tempo
  # mixin queries `tempo_*` series; without this nothing populates).
  # Alloy DS already runs `prometheus.operator.servicemonitors "all"`
  # cluster-wide, so just asking the chart to publish ServiceMonitors
  # is sufficient.
  metaMonitoring:
    serviceMonitor:
      enabled: true

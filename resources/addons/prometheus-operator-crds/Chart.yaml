apiVersion: v2
name: prometheus-operator-crds
version: 0.1.0
description: |
  Standalone Prometheus-operator CRDs (ServiceMonitor, PodMonitor, Probe,
  PrometheusRule, ScrapeConfig, AlertmanagerConfig, ThanosRuler, ...).
  In the LGTM-only topology (ADR 0016) the Alloy DaemonSet's
  `prometheus.operator.*` and `mimir.rules.kubernetes` components consume
  these CRDs; nothing else creates them.
type: application
dependencies:
  - name: prometheus-operator-crds
    version: 28.0.1
    repository: https://prometheus-community.github.io/helm-charts

{{/*
kubernetes-mixin recording rules (k8s.rules.*, node.rules, kubelet.rules).

The compute-resources dashboards in resources/addons/grafana/dashboards/
kubernetes-mixin/ query pre-aggregated series such as
`node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate`
and `namespace_cpu:kube_pod_container_resource_requests:sum`, NOT the raw
cadvisor/KSM metrics. kube-prometheus-stack used to ship these rules; after
its removal (ADR 0016) they were gone, so the dashboards read "No Data" on
CPU/memory until this rule set is loaded.

The Alloy DS's `mimir.rules.kubernetes "ruler"` component
(resources/addons/alloy/values.yaml) discovers PrometheusRule resources
cluster-wide with empty selectors and syncs them to Mimir's ruler under
tenant `percona-ci`, alongside the mimir-mixin and hetzner rules. The
source series come from the cadvisor + kubelet scrapes added in the same
addon; the recording rules group by `cluster`, which the Alloy remote_write
external_labels set to `percona-ci-platform`.

Compiled from github.com/kubernetes-monitoring/kubernetes-mixin with
jsonnet, filtered to the k8s.rules groups plus node.rules and
kubelet.rules. The apiserver and scheduler groups are excluded (managed
control plane, not scraped on EKS).
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-mixin-rules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: rules
    mixin: kubernetes
spec:

{{/*
The Alertmanager fallback config with the SES SMTP login and the recipient from
Secrets Manager (terraform/ses-alertmanager.tf). The alertmanager StatefulSet
mounts the Secret at /configs/. Mimir reads the file only at start, so a change
needs a restart of mimir-alertmanager (docs/runbooks/alertmanager-email.md).
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
    app.kubernetes.io/part-of: mimir
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-mimir
  target:
    name: mimir-alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager_fallback_config.yaml: |
          {{- .Files.Get "files/alertmanager-fallback.yaml" | nindent 10 }}
  data:
    {{- range $key := list "smtp_username" "smtp_password" "email_to" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.alertmanagerEmail.secretsManagerKey }}
        property: {{ $key }}
    {{- end }}

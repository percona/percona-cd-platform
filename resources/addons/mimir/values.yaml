# Grafana Mimir — distributed-mode topology, S3-backed.
#
# bucket_name fields are placeholders — actual values come from the addons
# ApplicationSet valuesObject (see argocd-bootstrap/applicationsets/addons.yaml),
# which reads cluster-secret annotations populated by terraform/lgtm-storage.tf.
# Pod Identity (terraform/pod-identity.tf) maps namespace=mimir + SA=mimir to
# the IAM role with S3 + KMS access scoped to the bucket below.
#
# Alertmanager: Mimir's built-in 3-replica STS is the cluster's sole alert
# router (LGTM-only, ADR 0016). PrometheusRule resources should set their
# `spec.alerting` routes to
# `http://mimir-alertmanager.mimir.svc.cluster.local:8080`. Rules sync to
# Mimir's ruler via the Alloy DS `mimir.rules.kubernetes` component
# (resources/addons/alloy/values.yaml).
mimir-distributed:
  serviceAccount:
    create: true
    name: mimir

  mimir:
    structuredConfig:
      multitenancy_enabled: false
      # Disable the Kafka ingest-storage path. The chart hardcodes
      # `ingest_storage.enabled: true` in its mimir-config template and
      # only conditionally fills in the Kafka address; setting
      # `kafka.enabled: false` (above) drops the Kafka StatefulSet but
      # leaves ingest_storage enabled with no address, so distributors
      # crash with `invalid ingest storage config: the Kafka address has
      # not been configured`. Override here to fully turn the path off
      # and fall back to the classic distributor->ingester gRPC ring.
      ingest_storage:
        enabled: false
      # The chart also hardcodes ingester.push_grpc_method_enabled=false
      # (intended for kafka mode where distributors don't push to ingesters).
      # In classic ring mode we need Push back on, otherwise ingester boot
      # validates with: "cannot disable Push gRPC method in ingester, while
      # ingest storage (-ingest-storage.enabled) is not enabled".
      ingester:
        push_grpc_method_enabled: true
      common:
        storage:
          backend: s3
          s3:
            endpoint: s3.us-east-1.amazonaws.com
            region: us-east-1
            bucket_name: REPLACE_VIA_APPSET
      blocks_storage:
        backend: s3
        s3:
          bucket_name: REPLACE_VIA_APPSET
      # Mimir 2.11+ moved the per-storage object-key prefix from
      # `<storage>.s3.prefix` to top-level `<storage>.storage_prefix`.
      # The old key trips a YAML unmarshal error on startup
      # (`field prefix not found in type s3.Config`) and crashloops every
      # component. Same bucket, namespaced inside via storage_prefix.
      alertmanager_storage:
        backend: s3
        storage_prefix: alertmanager
        s3:
          bucket_name: REPLACE_VIA_APPSET
      ruler_storage:
        backend: s3
        storage_prefix: rules
        s3:
          bucket_name: REPLACE_VIA_APPSET
      # Isolate the Mimir memberlist from the Loki and Tempo memberlists.
      # Without this, all three rings cross-pollinate in the same namespace
      # neighbourhood: Mimir distributors end up dialing Loki ingesters
      # at :9095, get `code = Unimplemented desc = unknown service
      # cortex.Ingester` because Loki's gRPC server only registers
      # `logproto.Pusher`, and every PromQL query fails. Cluster-label
      # verification is opt-in upstream (`cluster_label_verification_disabled:
      # true` is the chart default) — we flip it off so mismatched gossip is
      # rejected at handshake.
      memberlist:
        cluster_label: "mimir-percona-ci"
        cluster_label_verification_disabled: false

      # Per-tenant ingestion rate limit. Defaults are 10000 samples/s
      # with 200000 burst -- below what the LGTM-only stack pushes
      # under steady load (kube-state-metrics + node-exporter +
      # in-cluster Mimir/Loki/Tempo self-metrics + master-side
      # hetzner_* push from the Jenkins fleet). Hit live as
      # err-mimir-tenant-max-ingestion-rate / HTTP 429 from
      # distributor logs after the cutover.
      #
      # Single-tenant cluster today (multitenancy_enabled=false above
      # routes everything to the `anonymous` tenant; the X-Scope-OrgID
      # header from external pushers is honored on read but ignored on
      # write under multitenancy=false). 50k/s with 1M burst gives
      # comfortable headroom for the current ~10k/s sustained.
      limits:
        ingestion_rate: 50000
        ingestion_burst_size: 1000000
        # Per-tenant in-memory series cap. Default 150000 was hit cleanly
        # at exactly 150000 on every ingester after the cluster-label
        # external_label landed (PR #58, alloy DS rolled), causing the
        # mimir-mixin recording rules (PR #59) to fail every push with
        # err-mimir-max-series-per-user. Mimir runs
        # multitenancy_enabled=false, so every write lands under the
        # `anonymous` tenant; the rule writes from the ruler share the
        # quota with live scrape ingest. 1.5M gives ~10x headroom and
        # accommodates the ~5K mimir-mixin recording series plus future
        # KSM / Karpenter / Loki cardinality growth.
        max_global_series_per_user: 1500000

  # Distributed-mode replicas. WAL PVCs use the cluster-default `gp3`
  # StorageClass (multi-AZ, Delete) — losing an ingester WAL costs ≤2h of
  # in-flight metrics, which is acceptable since durable data lives in S3.
  #
  # Robustness: stateful components (ingester, store-gateway, compactor,
  # alertmanager) get platform-stateful-high so Karpenter consolidation
  # never preempts them. Stateless edges get platform-default. PDBs sized
  # at minAvailable = replicas - 1 across the board.
  distributor:
    replicas: 3
    priorityClassName: platform-default
    podDisruptionBudget:
      minAvailable: 2
      maxUnavailable: null  # clear chart default; K8s rejects both being set
  ingester:
    replicas: 3
    priorityClassName: platform-stateful-high
    podDisruptionBudget:
      minAvailable: 2
      maxUnavailable: null  # clear chart default; K8s rejects both being set
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: gp3
  querier:
    replicas: 2
    priorityClassName: platform-default
    podDisruptionBudget:
      minAvailable: 1
      maxUnavailable: null  # clear chart default; K8s rejects both being set
  store_gateway:
    replicas: 2
    priorityClassName: platform-stateful-high
    podDisruptionBudget:
      minAvailable: 1
      maxUnavailable: null  # clear chart default; K8s rejects both being set
    persistentVolume:
      enabled: true
      size: 30Gi
      storageClass: gp3
  compactor:
    replicas: 1
    priorityClassName: platform-stateful-high
    persistentVolume:
      enabled: true
      size: 30Gi
      storageClass: gp3
  query_frontend:
    replicas: 2
    priorityClassName: platform-default
    podDisruptionBudget:
      minAvailable: 1
      maxUnavailable: null  # clear chart default; K8s rejects both being set
  query_scheduler:
    enabled: true
    replicas: 2
    priorityClassName: platform-default
    podDisruptionBudget:
      minAvailable: 1
      maxUnavailable: null  # clear chart default; K8s rejects both being set
  alertmanager:
    enabled: true
    replicas: 3
    priorityClassName: platform-stateful-high
    podDisruptionBudget:
      minAvailable: 2
      maxUnavailable: null  # clear chart default; K8s rejects both being set
    persistentVolume:
      enabled: true
      size: 5Gi
      storageClass: gp3
  ruler:
    enabled: true
    replicas: 1
    priorityClassName: platform-default

  # MinIO + memcached defaults — disable bundled MinIO (we use S3); keep
  # the chart's bundled memcached caches.
  minio:
    enabled: false

  # Self-monitoring via ServiceMonitors so Mimir's own components
  # (distributor, ingester, querier, store-gateway, compactor, ruler,
  # alertmanager, query-frontend) get scraped by the cluster Alloy and
  # pushed back into Mimir for the official Mimir / Overview dashboard
  # (gnetId 17607). Without this, no `cortex_*` series exist in Mimir
  # and the overview dashboard renders blank. Alloy DS already runs
  # `prometheus.operator.servicemonitors "all"` cluster-wide, so just
  # asking the chart to publish ServiceMonitors is sufficient.
  metaMonitoring:
    serviceMonitor:
      enabled: true

  # Kafka-based ingest-storage is the chart's 2024+ default, an
  # experimental path where the distributor writes samples to a Kafka
  # topic that ingesters consume. Our cluster doesn't have the resource
  # headroom for the kafka StatefulSet (mimir-kafka-0 stays Pending with
  # 'Insufficient cpu/memory'), and we don't need that ingest topology
  # for current scale. Disable it; Mimir falls back to the classic
  # distributor-to-ingester gRPC ring path.
  kafka:
    enabled: false

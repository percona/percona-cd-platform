# Dedicated-ALB SSL termination for Jenkins masters (PS-10945).
#
# Architecture: Internet -> ALB (jenkins-masters group, ACM wildcard) ->
# nginx Pod (this chart) -> AWS EC2 public DNS of the master's EIP.
# Pods are in the percona-ci-platform VPC, so they satisfy the ALB
# `target-type: ip` constraint; the upstream traverses the public internet
# back to the master via its stable EIP DNS name. Acceptable because
# masters are already public-facing.
#
# `upstream` must NOT be the same DNS name as the Ingress host -- cutting
# the public hostname over to the ALB would make nginx resolve its
# upstream to the ALB itself and loop. Use the `origin-<host>` convention
# (matches `terraform/origins.tf`): a separate Route53 A-record pointing
# at the master's EIP. `upstreamHostHeader` is the Host header + SNI sent
# to the upstream so the master's openresty matches its virtual host and
# cert.
#
# ps3 upstream discovery is handled by the jenkins-endpoint-reconciler
# CronJob (it writes the EndpointSlice for the Service below), so no
# `origin-ps3` Route53 record or `jenkins_origin_targets.ps3` is needed.
#
# Phase 1 (proxy via openresty): upstream still HTTPS:443. After PR 2 in
# Percona-Lab/jenkins-pipelines strips openresty and the master SG opens
# :8080 to the EKS NAT egress IPs, switch to scheme=http, port=8080.

image:
  repository: nginx
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# One entry per host on the shared ALB. `name` is the left label of the
# `cd.percona.com` host. `upstream` is the FQDN the proxy connects to
# (must differ from `<name>.cd.percona.com` to avoid resolution loops).
# `upstreamHostHeader` is sent as both the Host header and the TLS SNI.
hosts:
  - name: ps3
    # K8s Service backed by an EndpointSlice that the jenkins-endpoint-reconciler
    # CronJob keeps in sync with the live ps3 master private IP via the VPC
    # peering. SpotFleet replacements / AZ failovers re-target automatically
    # without any Route53 or `tofu apply`. nginx resolves this name via kube-
    # dns (still using the runtime resolver + $upstream pattern so a Service
    # ClusterIP change picks up within the 5s TTL).
    upstream: jenkins-ps3.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    # upstreamHostHeader unused for plain HTTP (no SNI); harmless to leave.
    upstreamHostHeader: ps3.cd.percona.com
  - name: ps80
    # EndpointSlice kept in sync with the live ps80 master private IP by the
    # jenkins-endpoint-reconciler over the us-west-2 <-> us-east-1 peering.
    upstream: jenkins-ps80.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps80.cd.percona.com
  - name: ps57
    # EndpointSlice kept in sync with the live ps57 master private IP by the
    # jenkins-endpoint-reconciler over the eu-central-1 <-> us-east-1 peering.
    upstream: jenkins-ps57.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps57.cd.percona.com
  - name: pxb
    # EndpointSlice kept in sync with the live pxb master private IP by the
    # jenkins-endpoint-reconciler over the us-west-2 <-> us-east-1 peering.
    upstream: jenkins-pxb.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pxb.cd.percona.com
  - name: pxc
    # EndpointSlice kept in sync with the live pxc master private IP by the
    # jenkins-endpoint-reconciler over the us-west-1 <-> us-east-1 peering.
    upstream: jenkins-pxc.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pxc.cd.percona.com

ingress:
  # Dedicated ALB group for Jenkins masters. Intentionally NOT `jenkins-cd`
  # (which serves grafana/argo/auth/alloy-gateway); Jenkins traffic gets its
  # own ALB so a master rule churn / proxy outage cannot affect the platform
  # control-plane ingress. ALBC creates and owns the second ALB
  # automatically the first time an Ingress on this group reconciles.
  # ACM wildcard *.cd.percona.com is discovered automatically via SNI.
  groupName: jenkins-masters
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

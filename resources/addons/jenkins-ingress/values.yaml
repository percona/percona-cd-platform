# Shared-ALB SSL termination for Jenkins masters (PS-10945).
#
# Architecture: Internet -> ALB (jenkins-cd group, ACM wildcard) ->
# nginx Pod (this chart) -> public DNS of the EC2 master's openresty/Jenkins.
# Pods are in the percona-ci-platform VPC, so they satisfy the ALB
# `target-type: ip` constraint; the upstream traverses the public internet
# back to the master. Acceptable because masters are already public-facing.
#
# Phase 1 (spike): one host -- `ps3-spike.cd.percona.com` -> existing
# openresty on `ps3.cd.percona.com:443`. Zero production impact.
# Phase 4 (cutover): add `ps3.cd.percona.com` to the hosts list and delete
# the master's CF-owned Route53 record so external-dns publishes the ALB
# DNS as the A-alias for `ps3.cd.percona.com`.

image:
  repository: nginx
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# One entry per host on the shared ALB. `name` is the left label of the
# `cd.percona.com` host. `upstream` is the FQDN the proxy connects to;
# defaults to <name>.cd.percona.com but can be overridden (spike uses a
# different upstream than the host).
hosts:
  - name: ps3-spike
    upstream: ps3.cd.percona.com
    upstreamScheme: https
    upstreamPort: 443

ingress:
  # Shared ALB group; ALBC merges all Ingresses on this group onto one ALB.
  # ACM wildcard *.cd.percona.com is discovered automatically via SNI.
  groupName: jenkins-cd
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

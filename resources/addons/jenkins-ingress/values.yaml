# Dedicated-ALB SSL termination for Jenkins masters (PS-10945).
#
# Internet -> ALB (jenkins-masters group, ACM wildcard via SNI) -> nginx
# Pod (this chart) -> per-host ClusterIP Service whose EndpointSlice the
# jenkins-endpoint-reconciler syncs to the master private IP over the
# cross-region VPC peering. Upstreams are http on :8080. TLS terminates at
# the ALB.
#
# `upstream` must differ from the Ingress host, else nginx resolves to the
# ALB and loops. ps3 is not proxied here (served by the in-cluster ps3-k8s
# controller, ADR 0027).

image:
  repository: nginx
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

# HA web plane de-pin: 3 replicas, hard-spread across >=2 AZs via the dedicated
# `ingress` Karpenter NodePool. A single-AZ event can no longer take every master UI dark.
replicaCount: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# One entry per host on the shared ALB. `name` is the left label of the
# `cd.percona.com` host. `upstream` is the FQDN the proxy connects to
# (must differ from `<name>.cd.percona.com` to avoid resolution loops).
# `upstreamHostHeader` is sent as both the Host header and the TLS SNI.
hosts:
  # ps3 retired from the proxy: ps3.cd is served directly by the in-cluster ps3-k8s
  # controller (host-only ALB ingress). See ADR 0027 / migrate-ps3-to-eks runbook.
  - name: ps80
    # EndpointSlice kept in sync with the live ps80 master private IP by the
    # jenkins-endpoint-reconciler over the us-west-2 <-> us-east-1 peering.
    upstream: jenkins-ps80.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps80.cd.percona.com
  - name: ps57
    # EndpointSlice kept in sync with the live ps57 master private IP by the
    # jenkins-endpoint-reconciler over the eu-central-1 <-> us-east-1 peering.
    upstream: jenkins-ps57.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps57.cd.percona.com
  - name: ps57-upgraded
    # TEMPORARY fenced clone of ps57 for the core 2.568.2 + Java 21 upgrade
    # validation (terraform/master-ps57-upgraded.tf). Remove with it.
    upstream: jenkins-ps57-upgraded.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps57-upgraded.cd.percona.com
  - name: ps80-upgraded
    # TEMPORARY fenced clone of ps80 for the core 2.568.2 + Java 21 upgrade
    # validation (terraform/master-ps80-upgraded.tf). Remove with it.
    upstream: jenkins-ps80-upgraded.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: ps80-upgraded.cd.percona.com
  - name: pxb
    # EndpointSlice kept in sync with the live pxb master private IP by the
    # jenkins-endpoint-reconciler over the us-west-2 <-> us-east-1 peering.
    upstream: jenkins-pxb.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pxb.cd.percona.com
  - name: pxc
    # EndpointSlice kept in sync with the live pxc master private IP by the
    # jenkins-endpoint-reconciler over the us-west-1 <-> us-east-1 peering.
    upstream: jenkins-pxc.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pxc.cd.percona.com
  - name: psmdb
    # EndpointSlice kept in sync with the live psmdb master private IP by the
    # jenkins-endpoint-reconciler over the us-west-2 <-> us-east-1 peering.
    upstream: jenkins-psmdb.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: psmdb.cd.percona.com
  - name: rel
    # EndpointSlice kept in sync with the live rel master private IP by the
    # jenkins-endpoint-reconciler over the eu-west-1 <-> us-east-1 peering.
    upstream: jenkins-rel.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: rel.cd.percona.com
  - name: cloud
    # EndpointSlice kept in sync with the live cloud master private IP by the
    # jenkins-endpoint-reconciler over the eu-west-1 <-> us-east-1 peering.
    upstream: jenkins-cloud.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: cloud.cd.percona.com
  - name: pmm
    # EndpointSlice kept in sync with the live pmm master private IP by the
    # jenkins-endpoint-reconciler over the us-east-2 <-> us-east-1 peering
    # (the EC2 tag is the legacy jenkins-pmm-amzn2).
    upstream: jenkins-pmm.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pmm.cd.percona.com
  - name: pg
    # EndpointSlice kept in sync with the live pg master private IP by the
    # jenkins-endpoint-reconciler over the eu-central-1 <-> us-east-1 peering.
    upstream: jenkins-pg.jenkins-ingress.svc.cluster.local
    upstreamScheme: http
    upstreamPort: 8080
    upstreamHostHeader: pg.cd.percona.com

ingress:
  # Dedicated ALB group for Jenkins masters. Intentionally NOT `jenkins-cd`
  # (which serves grafana/argo/auth/alloy-gateway); Jenkins traffic gets its
  # own ALB so a master rule churn / proxy outage cannot affect the platform
  # control-plane ingress. ALBC creates and owns the second ALB
  # automatically the first time an Ingress on this group reconciles.
  # ACM wildcard *.cd.percona.com is discovered automatically via SNI.
  groupName: jenkins-masters
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
  # ALB-wide access logs. Bucket and delivery policy:
  # terraform/alb-access-logs.tf. Rendered identically on every Ingress
  # in this chart (ALBC requires unique-or-identical across the group).
  accessLogs:
    enabled: true
    bucket: percona-ci-platform-alb-logs
    prefix: jenkins-masters

{{/*
One Ingress per host, all in the jenkins-masters IngressGroup -> one ALB.
ACM wildcard *.cd.percona.com is matched via SNI, no certificate-arn
annotation needed. The access-logs annotation renders identically on
every Ingress here: ALBC requires it to be unique or identical across
the group. ps3-k8s is a 9th group member without the annotation, which
is allowed.
*/}}
{{- range .Values.hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ $.Values.ingress.groupName }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: {{ $.Values.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /-/healthy
    alb.ingress.kubernetes.io/healthcheck-port: '8081'
    {{- if $.Values.ingress.accessLogs.enabled }}
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket={{ $.Values.ingress.accessLogs.bucket }},access_logs.s3.prefix={{ $.Values.ingress.accessLogs.prefix }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .name }}.cd.percona.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: 80
---
{{- end }}

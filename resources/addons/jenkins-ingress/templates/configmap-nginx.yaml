{{/*
NGINX reverse-proxy config. One server block per host in .Values.hosts.

Each server listens on :80 (ALB terminates TLS upstream; pod-internal traffic
is HTTP). Host header + SNI are rewritten to `upstreamHostHeader` (defaults
to upstream) so the master's openresty/Jenkins matches the right vhost +
cert. WebSocket upgrade headers + 3600s read timeout cover Jenkins build
console streaming.

Health probe at /-/healthy returns 200 without traversing the upstream so
ALB target-group health stays decoupled from the master's reachability.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
      access_log /dev/stdout;
      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      client_max_body_size 500m;

      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # Shared healthz for the ALB target-group health check.
      server {
        listen 8081;
        location = /-/healthy { return 200 "ok\n"; }
      }

      {{- range .Values.hosts }}
      {{- $hostHeader := default .upstream .upstreamHostHeader }}
      server {
        listen 80;
        server_name {{ .name }}.cd.percona.com;

        # Bypass upstream for ALB health probes.
        location = /-/healthy { return 200 "ok\n"; }

        location / {
          proxy_pass {{ .upstreamScheme }}://{{ .upstream }}:{{ .upstreamPort }};
          proxy_set_header Host {{ $hostHeader }};
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host {{ .name }}.cd.percona.com;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";

          {{- if eq .upstreamScheme "https" }}
          proxy_ssl_server_name on;
          proxy_ssl_name {{ $hostHeader }};
          proxy_ssl_verify off;
          {{- end }}
        }
      }
      {{- end }}
    }

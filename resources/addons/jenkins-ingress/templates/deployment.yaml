apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins-ingress
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Surge a new pod and wait for it Ready before removing an old one (maxUnavailable: 0),
  # so the sole master web proxy never drops below its current serving count during a roll.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-ingress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-ingress
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll pods when the proxy config changes so a values.yaml host
        # addition takes effect without a manual restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      priorityClassName: platform-default
      # HA web plane de-pin: run on the dedicated multi-AZ `ingress` Karpenter
      # NodePool (tainted) so the proxy spreads across AZs without scattering the single-AZ
      # default-pool tenants (e.g. the Tempo read path). See nodepool-ingress.yaml.
      nodeSelector:
        workload.percona.com/tier: ingress
        workload.percona.com/managed-by: karpenter
      tolerations:
        - key: workload.percona.com/tier
          operator: Equal
          value: ingress
          effect: NoSchedule
      topologySpreadConstraints:
        # Hard spread across >=2 AZs. minDomains: 2 forces a real second zone (an omitted
        # minDomains defaults to 1, which DoNotSchedule would satisfy inside a single AZ).
        # nodeAffinityPolicy/nodeTaintsPolicy Honor so the pool's zone requirement and the
        # ingress taint are counted correctly; matchLabelKeys scopes skew math to this
        # revision so a rollout's old+new pods do not fight the constraint.
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      affinity:
        podAntiAffinity:
          # Hard one-pod-per-node: no two replicas share a node, so a single node loss
          # (including the two same-AZ replicas) can never drop more than one pod. Karpenter
          # provisions a distinct ingress node per replica. A topology spread with maxSkew 1
          # is NOT enough here: with few nodes it still permits a 2+1 split. matchLabelKeys
          # scopes this to the current revision so the maxSurge 1 / maxUnavailable 0 roll
          # does not deadlock on old-revision pods holding the nodes.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: nginx
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: healthz
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  # 3 replicas, keep at least 2 up (allows one out at a time). minAvailable (not
  # maxUnavailable) is a clean in-place update of the existing PDB field, and AlwaysAllow
  # lets an already-unhealthy pod be evicted so a node drain cannot wedge on it.
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}

{{/*
Jenkins REST credentials for the ingest CronJob. The EKS cluster cannot read
ps80's Jenkins credential store, so the JNKPercona service-account token is
mirrored into the AWS Secrets Manager JSON bundle (JENKINS_USER / JENKINS_TOKEN)
and synced here by ESO. Provisioned at the deploy gate.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mtr-jenkins
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
    app.kubernetes.io/part-of: mtr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mtr-jenkins
    creationPolicy: Owner
  data:
    - secretKey: JENKINS_USER
      remoteRef:
        key: {{ .Values.secretsManagerKey }}
        property: JENKINS_USER
    - secretKey: JENKINS_TOKEN
      remoteRef:
        key: {{ .Values.secretsManagerKey }}
        property: JENKINS_TOKEN

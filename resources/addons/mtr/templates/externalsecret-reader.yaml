{{/*
Read-only role password for the Grafana MTR datasource. CNPG's managed role
`mtr_reader` (cluster.yaml) consumes this as a kubernetes.io/basic-auth secret;
the username must equal the role name. The matching grafana-namespace copy
(for the datasource connection) lives in the grafana addon.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mtr-pg-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
    app.kubernetes.io/part-of: mtr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mtr-pg-reader
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.readerRole | quote }}
        password: '{{ `{{ .password }}` }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secretsManagerKey }}
        property: PG_READER_PASSWORD

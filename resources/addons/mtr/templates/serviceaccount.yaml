apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtr-ingest
  namespace: {{ .Release.Namespace }}
# No AWS Pod Identity and no RBAC: the ingest job only reads its own env
# Secrets (kubelet-mounted), talks to in-cluster Postgres, and makes outbound
# HTTPS to ps80.cd. Nothing in the AWS or Kubernetes API surface is needed.

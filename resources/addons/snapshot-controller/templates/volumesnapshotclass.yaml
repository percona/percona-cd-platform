# VolumeSnapshotClass for EBS-CSI. deletionPolicy: Retain so deleting the
# VolumeSnapshot K8s object NEVER deletes the underlying EBS snapshot — the
# DR artifact survives operator/GitOps error (mirrors the gp3-*-1a-retain
# StorageClass reclaimPolicy: Retain stance). PerconaKeep=True keeps the
# percona-dev-admin cleanup Lambda from reaping the resulting EBS snapshot.
#
# Co-located in THIS addon (not storageclass-gp3) so the CRD
# (snapshot.storage.k8s.io) and this CR ship in one sync unit — no cross-addon
# ordering dependency / Argo retry churn (TIER-5 §4c decision 4).
#
# tagSpecification_<n>: confirmed valid on the EBS CSI StorageClass; snapshot-
# class tagging needs a recent EBS CSI driver. VERIFY the live driver honours
# these on a VolumeSnapshotClass before relying on the PerconaKeep tag landing
# on the EBS snapshot — if unsupported, the snapshot inherits no tags and the
# cleanup-Lambda exemption must come from elsewhere (TIER-5 §4c note / blocker).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ebs-csi-retain
  labels:
    velero.io/csi-volumesnapshot-class: "true"   # OPTIONAL — only if Velero is ever added; harmless otherwise
deletionPolicy: Retain
driver: ebs.csi.aws.com
parameters:
  tagSpecification_1: "iit-billing-tag=percona-ci-platform"
  tagSpecification_2: "PerconaKeep=True"
  tagSpecification_3: "managed-by=ebs-csi-driver"

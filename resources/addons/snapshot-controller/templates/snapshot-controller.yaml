# VENDORED upstream, DO NOT hand-edit. Re-sync from the pinned release tag.
# Source: kubernetes-csi/external-snapshotter v8.6.0
#   https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
# Pin: v8.6.0.
# LOCAL EDITS (only):
#   1. namespace kube-system -> snapshot-controller (this addon's own
#      ApplicationSet-managed namespace; destination.namespace = path.basename,
#      CreateNamespace=true).
#   2. nodeSelector pinned to workload.percona.com/tier=bootstrap, matching the
#      coredns / ebs-csi controller placement in terraform/eks-addons.tf:50,76
#      (the system NodeGroup). Without it the controller can schedule onto a
#      Karpenter/data node and churn on scale-down.
#   3. tolerations for CriticalAddonsOnly=true:NoSchedule, the taint the
#      bootstrap NodeGroup carries (same as coredns / ebs-csi). Without it the
#      nodeSelector lands on a tainted node the pod cannot tolerate -> Pending.
# replicas:2 + leader-election are upstream defaults (one active, one standby).

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  # The snapshot controller won't be marked as ready if the v1 CRDs are unavailable.
  # The flag --retry-crd-interval-max is used to determine how long the controller
  # will wait for the CRDs to become available before exiting. The default is 30 seconds
  # so minReadySeconds should be set slightly higher than the flag value.
  minReadySeconds: 35
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-controller
    spec:
      serviceAccountName: snapshot-controller
      nodeSelector:
        workload.percona.com/tier: bootstrap
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: snapshot-controller
          image: registry.k8s.io/sig-storage/snapshot-controller:v8.5.0
          args:
            - "--v=5"
            - "--leader-election=true"
            # Add a marker to the snapshot-controller manifests. This is needed to enable feature gates in CSI prow jobs.
            # For example, in https://github.com/kubernetes-csi/csi-release-tools/pull/209, the snapshot-controller YAML is updated to add --prevent-volume-mode-conversion=true so that the feature can be enabled for certain e2e tests.
            # end snapshot controller args
          imagePullPolicy: IfNotPresent

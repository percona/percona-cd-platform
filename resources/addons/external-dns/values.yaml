external-dns:
  provider: aws
  domainFilters:
    - cd.percona.com
  policy: sync
  txtOwnerId: percona-ci-platform
  serviceAccount:
    create: true
    name: external-dns
  sources:
    - service
    - ingress

  # Robustness: 2 replicas (chart uses leader-election so 2 is correct, not
  # active-active); PDB minAvailable=1; system-critical priority.
  replicas: 2
  priorityClassName: platform-system-critical
  podDisruptionBudget:
    minAvailable: 1

  # Bootstrap-tier pin + toleration. Pairs with the Stage 2b
  # CriticalAddonsOnly:NoSchedule taint.
  nodeSelector:
    node-role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

# Grafana Alloy — DaemonSet for in-cluster observability data plane.
#
# Role split:
#   - alloy (this chart): DaemonSet, scrapes node + pod logs (kubelet
#     discovery, /var/log/pods, /var/log/containers) and ships to Loki.
#     Also accepts OTLP traces from in-cluster apps and forwards to Tempo.
#   - alloy-gateway (sibling chart): Deployment with public ALB Ingress
#     for external pushers (Jenkins masters, Hetzner plugin metrics).
#
# LGTM-only migration (ADR 0016 incoming):
#   P3: added `mimir.rules.kubernetes` so PrometheusRule CRDs sync to
#     Mimir's ruler — Mimir starts evaluating the same rules kps
#     Prometheus already evaluates. Identical sample timestamps ->
#     Mimir ingester dedupes harmlessly.
#   P4 (this commit): adds `prometheus.operator.{servicemonitors,
#     podmonitors,probes}` + chart-side clustering. Alloy DS now
#     scrapes everything kps Prometheus does, in parallel. Both
#     writers' samples are deduped by Mimir.
#   P5/P6: kps Prometheus scaled to 0; chart deleted.
alloy:
  alloy:
    configMap:
      content: |-
        // Discover pods + nodes via the in-cluster Kubernetes API.
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Scrape pod logs from the node's filesystem (cri-containerd shape).
        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.relabel.jenkins_master.receiver]
        }

        // PS-10997 Phase 2.5b: align in-cluster Jenkins log labels with
        // the metric label schema. Pods in namespace=jenkins-<inst> are
        // the in-cluster Jenkins masters (today: jenkins-ps3-k8s; later
        // ps57-k8s / ps80-k8s as the EKS migration progresses). Inject
        // a master label so LogQL queries can use {master=~"$master"}
        // identically to PromQL across the dashboard variable.
        loki.relabel "jenkins_master" {
          forward_to = [loki.write.default.receiver]

          rule {
            source_labels = ["namespace"]
            regex         = "jenkins-(.+)"
            target_label  = "master"
            replacement   = "$1"
          }
        }

        // Forward to the in-cluster Loki distributor.
        loki.write "default" {
          endpoint {
            url = "http://loki-distributor.loki.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // OTLP receiver for in-cluster apps that emit traces. App pods
        // configure OTEL_EXPORTER_OTLP_ENDPOINT to the headless DaemonSet
        // service so spans land on the local node's Alloy.
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // Forward traces to the in-cluster Tempo distributor.
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo-distributor.tempo.svc.cluster.local:4317"
            tls {
              insecure = true
            }
          }
        }

        // === Metrics: PrometheusRule -> Mimir ruler (P3) ===
        //
        // Watch every PrometheusRule cluster-wide and POST it to Mimir's
        // ruler API (/api/v1/rules/<namespace>) under tenant `percona-ci`.
        // The mimir_namespace_prefix lets us trace any rule group back to
        // its source K8s namespace (e.g. kube-prometheus-stack ->
        // kps-kube-prometheus-stack inside Mimir).
        //
        // Empty selectors mirror today's kps configuration
        // (ruleSelectorNilUsesHelmValues=false), so the same rule
        // surface evaluates in BOTH places during the parallel window
        // (P3 -> P5). Mimir ingester dedupes identical timestamps.
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/mimir/mimir.rules.kubernetes/
        mimir.rules.kubernetes "ruler" {
          address                = "http://mimir-ruler.mimir.svc.cluster.local:8080"
          tenant_id              = "percona-ci"
          mimir_namespace_prefix = "kps-"
          sync_interval          = "1m"
          rule_selector {
            match_labels = {}
          }
          rule_namespace_selector {
            match_labels = {}
          }
        }

        // === Metrics: remote_write sink (declared in P3, used in P4) ===
        //
        // Sink for the `prometheus.operator.*` components arriving in P4.
        // Declared now so the rollout to P4 is just adding the operator
        // components without touching the writer config in the same PR.
        //
        // WAL truncate_frequency=2h matches Mimir distributor restart
        // tolerance: a longer outage requires reducing scrape interval
        // or sharding the WAL across more replicas.
        //
        // external_labels.cluster disambiguates from kps Prometheus
        // during the P4 parallel-scrape window so a `count by (cluster)
        // (up)` query can prove both writers are active before kps
        // Prom is scaled down in P5.
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.remote_write/
        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "percona-ci",
            }
          }
          external_labels = {
            cluster = "percona-ci-platform",
            fleet   = "platform-cluster",
          }
          wal {
            truncate_frequency = "2h"
          }
        }

        // === Metrics: ServiceMonitor / PodMonitor / Probe scrape (P4) ===
        //
        // Discovers every monitoring.coreos.com CRD instance cluster-wide
        // and scrapes the matching endpoints. Empty selectors mirror today's
        // kps `*SelectorNilUsesHelmValues=false` posture so the same scrape
        // surface (12 default kps SMs + Loki's SM + KSM + node-exporter +
        // future Alloy-shipped SMs) lands in Mimir via the remote_write
        // block above.
        //
        // Clustering peer-shards discovered targets across the DS pods —
        // without it, every DS pod scrapes every target (5x duplication on
        // a 5-node cluster). The clustering port is wired by the chart
        // (alloy.alloy.clustering.enabled below).
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.servicemonitors/
        prometheus.operator.servicemonitors "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.podmonitors/
        prometheus.operator.podmonitors "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.probes/
        prometheus.operator.probes "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

    # Cluster mode shards discovered targets across DaemonSet pods.
    # Required for `prometheus.operator.*` to avoid each DS pod scraping
    # every target. Cluster name keeps gossip isolated from any future
    # Alloy clusters in the same VPC.
    clustering:
      enabled: true
      name: "alloy-platform"

    # Scrape + WAL workload needs more headroom than the logs/traces-only
    # baseline (~50Mi steady). Sized for ~13 SM targets cluster-wide
    # today, with room for the Alloy operator components arriving in
    # later phases.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

  controller:
    type: daemonset
    # Tolerate every taint — the DaemonSet must run on every node, including
    # workload=prometheus / workload=jenkins (we want logs from those too).
    tolerations:
      - operator: Exists
    # DaemonSet pods get system-critical priority so log/trace shipping
    # survives node pressure that would evict default-priority pods.
    priorityClassName: platform-system-critical

# Grafana Alloy — DaemonSet for the in-cluster observability data plane.
#
# Role split:
#   - alloy (this chart): DaemonSet on every node. Scrapes pod logs
#     (kubelet discovery, /var/log/pods); accepts OTLP traces from
#     in-cluster apps and ships them to Tempo; discovers and scrapes
#     ServiceMonitor / PodMonitor / Probe CRDs and ships samples to
#     Mimir; syncs PrometheusRule CRDs into Mimir's ruler.
#   - alloy-gateway (sibling chart): Deployment with public ALB Ingress
#     for external pushers (Jenkins masters, Hetzner plugin metrics).
#
# This is the LGTM-only state — kube-prometheus-stack was removed in
# the same PR (ADR 0016). Mimir is the sole metrics store; the Alloy
# DS is the sole in-cluster scraper; Mimir's ruler is the sole rule
# evaluator.
alloy:
  alloy:
    configMap:
      content: |-
        // Discover pods + nodes via the in-cluster Kubernetes API.
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Scrape pod logs from the node's filesystem (cri-containerd shape).
        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.relabel.jenkins_master.receiver]
        }

        // PS-10997 Phase 2.5b: align in-cluster Jenkins log labels with
        // the metric label schema. Pods in namespace=jenkins-<inst> are
        // the in-cluster Jenkins masters (today: jenkins-ps3-k8s; later
        // ps57-k8s / ps80-k8s as the EKS migration progresses). Inject
        // a master label so LogQL queries can use {master=~"$master"}
        // identically to PromQL across the dashboard variable.
        loki.relabel "jenkins_master" {
          forward_to = [loki.write.default.receiver]

          rule {
            source_labels = ["namespace"]
            regex         = "jenkins-(.+)"
            target_label  = "master"
            replacement   = "$1"
          }
        }

        // Forward to the in-cluster Loki distributor.
        loki.write "default" {
          endpoint {
            url = "http://loki-distributor.loki.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // OTLP receiver for in-cluster apps that emit traces. App pods
        // configure OTEL_EXPORTER_OTLP_ENDPOINT to the headless DaemonSet
        // service so spans land on the local node's Alloy.
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // Forward traces to the in-cluster Tempo distributor.
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo-distributor.tempo.svc.cluster.local:4317"
            tls {
              insecure = true
            }
          }
        }

        // === Metrics: ServiceMonitor / PodMonitor / Probe scrape ===
        //
        // Discovers every monitoring.coreos.com CRD instance cluster-wide
        // and scrapes the matching endpoints. Samples flow into the
        // remote_write sink below and out to Mimir.
        //
        // Clustering peer-shards discovered targets across the DS pods --
        // without it, every DS pod scrapes every target (5x duplication on
        // a 5-node cluster). The clustering port is wired by the chart
        // (alloy.alloy.clustering.enabled below).
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.servicemonitors/
        prometheus.operator.servicemonitors "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }
        prometheus.operator.podmonitors "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }
        prometheus.operator.probes "all" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        // === Metrics: kubelet + cadvisor (kubernetes-mixin source data) ===
        //
        // kube-prometheus-stack used to create the kubelet Service +
        // ServiceMonitor that fed cadvisor `container_*` and `kubelet_*`.
        // After its removal (ADR 0016) nothing scraped them, so the
        // kubernetes-mixin compute-resources dashboards + their recording
        // rules (resources/addons/mimir/files/kubernetes-mixin-rules.yaml)
        // had no usage data. These two scrapes restore that source via the
        // apiserver node proxy (no per-node kubelet endpoint needed). RBAC
        // for nodes/proxy is in templates/clusterrole-kubelet-scrape.yaml.
        //
        // cadvisor is the highest-cardinality source in the cluster, so a
        // keep-list trims it to the series the mixin actually queries, and
        // a drop removes the empty-image pod-level cgroup duplicates. The
        // kubelet keep-list mirrors the kube-prometheus-stack default.
        discovery.kubernetes "nodes" {
          role = "node"
        }

        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc.cluster.local:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
          // job must match the mixin cadvisorSelector (job="cadvisor").
          rule {
            target_label = "job"
            replacement  = "cadvisor"
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.cadvisor.output
          forward_to        = [prometheus.relabel.cadvisor_filter.receiver]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          honor_labels      = true
          tls_config {
            ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            server_name = "kubernetes"
          }
          clustering {
            enabled = true
          }
        }

        prometheus.relabel "cadvisor_filter" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          // Keep only the container_*/machine_* series the mixin uses.
          rule {
            source_labels = ["__name__"]
            regex         = "container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_memory_working_set_bytes|container_memory_rss|container_memory_cache|container_memory_swap|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_network_receive_packets_total|container_network_transmit_packets_total|container_network_receive_packets_dropped_total|container_network_transmit_packets_dropped_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_fs_reads_total|container_fs_writes_total|machine_memory_bytes|machine_cpu_cores"
            action        = "keep"
          }
          // Drop pod-level cgroup duplicates (cadvisor emits container_* with
          // empty image for the pod sandbox); the mixin filters image!="".
          rule {
            source_labels = ["__name__", "image"]
            separator     = ";"
            regex         = "container_.*;"
            action        = "drop"
          }
        }

        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc.cluster.local:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/${1}/proxy/metrics"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
          // job must match the mixin kubeletSelector (job="kubelet").
          rule {
            target_label = "job"
            replacement  = "kubelet"
          }
        }

        prometheus.scrape "kubelet" {
          targets           = discovery.relabel.kubelet.output
          forward_to        = [prometheus.relabel.kubelet_filter.receiver]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          honor_labels      = true
          tls_config {
            ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            server_name = "kubernetes"
          }
          clustering {
            enabled = true
          }
        }

        prometheus.relabel "kubelet_filter" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          // Keep the kubelet series the mixin's kubelet + PV dashboards use.
          rule {
            source_labels = ["__name__"]
            regex         = "kubelet_node_name|kubelet_running_pods|kubelet_running_containers|kubelet_volume_stats_.*|kubelet_pod_worker_duration_seconds_.*|kubelet_pod_start_duration_seconds_.*|kubelet_pleg_relist_duration_seconds_.*|kubelet_runtime_operations_total|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_duration_seconds_.*|storage_operation_duration_seconds_.*|kubelet_cgroup_manager_duration_seconds_.*|volume_manager_total_volumes|rest_client_requests_total|rest_client_request_duration_seconds_.*"
            action        = "keep"
          }
        }

        // === Metrics: PrometheusRule -> Mimir ruler ===
        //
        // Watch every PrometheusRule cluster-wide and POST it to Mimir's
        // ruler API (/api/v1/rules/<namespace>) under tenant `percona-ci`.
        // Empty selectors match everything (no committed PrometheusRule
        // instances live in main today; consumers add them as needed).
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/mimir/mimir.rules.kubernetes/
        mimir.rules.kubernetes "ruler" {
          address       = "http://mimir-ruler.mimir.svc.cluster.local:8080"
          tenant_id     = "percona-ci"
          sync_interval = "1m"
          rule_selector {
            match_labels = {}
          }
          rule_namespace_selector {
            match_labels = {}
          }
        }

        // === Metrics: remote_write to Mimir ===
        //
        // Sink for the operator components above. WAL truncate_frequency=2h
        // matches Mimir distributor restart tolerance.
        //
        // external_labels.cluster: every gnetId-imported dashboard
        // (kube-prometheus-stack lineage, Karpenter mixin, Mimir mixin)
        // assumes a `cluster=<name>` label on every scraped series and
        // its template variables resolve via
        // `label_values(kube_pod_info, cluster)`. Without it, `$cluster`
        // is empty and every panel filters `cluster=""` (Karpenter
        // Overview was 0/25 panels with data on first audit). Setting
        // this here adds the label to series that don't already carry
        // one; the Mimir/Loki memberlist self-metrics keep their
        // existing `cluster=mimir|loki` value because remote_write
        // external_labels only fill in missing labels, never overwrite.
        //
        // Doc: grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.remote_write/
        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "percona-ci",
            }
          }
          external_labels = {
            cluster = "percona-ci-platform",
          }
          wal {
            truncate_frequency = "2h"
          }
        }

    # Cluster mode shards discovered targets across DaemonSet pods.
    # Required for `prometheus.operator.*` to avoid each DS pod scraping
    # every target.
    clustering:
      enabled: true
      name: "alloy-platform"

    # Scrape + WAL workload needs more headroom than the logs/traces-only
    # baseline (~50Mi steady). 512Mi requests / 2Gi limit handles the
    # current ~13 SM targets cluster-wide (Loki SM, KSM SM, NE SM,
    # future Alloy-shipped SMs) plus rule sync. The DS runs on every
    # node including the 4Gi system NG ones — 1Gi requests x 5 pods
    # left no headroom for Mimir distributors during the LGTM-only
    # cutover, hence 512Mi.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

  controller:
    type: daemonset
    # Tolerate every taint — the DaemonSet must run on every node, including
    # workload=prometheus / workload=jenkins (we want logs from those too).
    tolerations:
      - operator: Exists
    # DaemonSet pods get system-critical priority so log/trace shipping
    # survives node pressure that would evict default-priority pods.
    priorityClassName: platform-system-critical

{{/*
SAML SP wiring (HD-30780). Three resources, gated on saml.enabled:

  1. ExternalSecret syncing the SP cert + private_key from
     AWS Secrets Manager paths
       percona-ci-platform/authentik/saml/{certificate,private_key}
     into a k8s Secret `authentik-saml`. Operators can mount this in
     the Authentik server pod under /etc/authentik/saml/ via
     extraVolumes/extraVolumeMounts at runtime, OR — the standard
     Authentik path — paste the cert + key directly into the SAML
     Source's `signing_kp` field via the admin UI on first setup
     (one-shot; rotates by re-syncing this secret + re-uploading).

  2. ConfigMap `authentik-saml-idp` holding the Duo IdP metadata XML,
     decoded from the cluster-Secret annotation. Authentik's SAML
     Source supports either inline metadata XML or a metadata URL;
     for an air-gapped, no-public-URL setup the inline path is
     simplest. Operator pastes the contents of
     /etc/authentik/saml-idp/idp-metadata.xml into the SAML Source's
     `metadata` field on first setup.

After the chart lands healthy, the one-time UI configuration is
captured in docs/runbooks/authentik-bootstrap.md.

ClusterSecretStore lives in resources/addons/external-secrets/
templates/cluster-secret-store.yaml and uses Pod Identity for AWS auth.
*/}}
{{- if eq (.Values.saml.enabled | toString) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-saml
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: authentik-saml
    creationPolicy: Owner
  data:
    - secretKey: certificate
      remoteRef:
        key: percona-ci-platform/authentik/saml/certificate
    - secretKey: private_key
      remoteRef:
        key: percona-ci-platform/authentik/saml/private_key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-saml-idp
  namespace: {{ .Release.Namespace }}
data:
  idp-metadata.xml: |
{{ .Values.saml.idpMetadataB64 | b64dec | indent 4 }}
{{- end }}

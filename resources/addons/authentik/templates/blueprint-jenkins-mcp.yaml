{{/*
Authentik blueprint — jenkins-mcp OIDC client (PUBLIC / PKCE).

Companion to blueprint-grafana.yaml. Defines the OAuth2 provider the Jenkins
MCP server validates bearer tokens against, plus the Application that surfaces
it. The SAML source, group property mapping, and identification stage live in
blueprint-grafana.yaml.

Differs from the confidential web clients (grafana/argocd/headlamp): this is a
PUBLIC client (client_type: public) that cannot hold a secret. Every MCP client
(Claude Code, Cursor, hosted Claude) sends an S256 PKCE code_challenge and
Authentik accepts it, but Authentik does not require PKCE per-provider, so code
confidentiality rests on the strict redirect-URI allowlist below, not on a
server-enforced PKCE check. No client secret means no Authentik env var /
Secrets Manager key.

The redirect is a loopback regex covering the CLI's ephemeral callback port
(RFC 8252), modelled on the argocd provider. The MCP server is the OAuth2
resource server: it validates the access-token aud against its configured
audience, which is the client_id `jenkins-mcp` (Authentik stamps aud with the
provider client_id, the same contract the headlamp client relies on).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-jenkins-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Required label for the chart's blueprint mount path. */}}
    app.kubernetes.io/component: blueprint
data:
  jenkins-mcp-bridge.yaml: |
    version: 1
    metadata:
      name: jenkins-mcp-bridge
      labels:
        blueprints.goauthentik.io/system: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: jenkins-mcp-provider
        attrs:
          client_id: jenkins-mcp
          client_type: public
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          include_claims_in_id_token: true
          access_token_validity:  minutes=30
          refresh_token_validity: days=30
          # Loopback regex covers Claude Code's ephemeral callback port (RFC 8252).
          # The two strict cursor entries cover the Cursor MCP OAuth callback (web
          # and the desktop deep link); Cursor pre-registers this same client_id.
          # The claude.ai entry covers the hosted Claude surfaces (web, Desktop,
          # mobile): the connector is added with this client_id supplied manually
          # and a blank client secret (public client; Claude sends S256 PKCE),
          # which avoids dynamic client registration entirely.
          redirect_uris:
            - matching_mode: regex
              url: ^http://(127\.0\.0\.1|localhost):[0-9]+/callback$
            - matching_mode: strict
              url: https://www.cursor.com/agents/mcp/oauth/callback
            - matching_mode: strict
              url: cursor://anysphere.cursor-mcp/oauth/callback
            - matching_mode: strict
              url: https://claude.ai/api/mcp/auth_callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # openid + profile match the working grafana/argocd providers (profile
          # carries `groups`); offline_access is bound so a refresh_token is
          # issued for the CLI's cached session.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      - model: authentik_core.application
        identifiers:
          slug: jenkins-mcp
        attrs:
          name: Jenkins MCP
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, jenkins-mcp-provider]]
          meta_launch_url: https://jenkins-mcp.cd.percona.com/
          open_in_new_tab: false
          policy_engine_mode: any
          group: ""

      # Access model: reads are open to any authenticated Percona user. There is no application
      # policy binding, so the app does not restrict who may authorize. Users are JIT-provisioned
      # via the JumpCloud SSO SAML source on first login. The operate (build-lifecycle) tier is gated
      # per-call by the server to the jenkins-mcp-writers group below.
      - model: authentik_core.group
        id: jenkins-mcp-writers
        identifiers:
          name: jenkins-mcp-writers

      # ---- Service accounts (automation readers) ----
      # A team automation (a scheduled Claude routine on a group-owned account) has no
      # JumpCloud identity, and the default login page offers only the JumpCloud redirect
      # (blueprint-grafana.yaml empties user_fields on purpose, closing the akadmin MFA
      # bypass). This separate flow gives a service account a username + app-password
      # login without touching the default flow. It is reachable only by URL
      # (/if/flow/jenkins-mcp-service-login/), the password stage accepts app-password
      # tokens only (TokenBackend, never the account password), and an expression policy
      # on the password and login bindings lets only service_account users in the group
      # below through, so akadmin and JumpCloud users are denied here. Members never join
      # jenkins-mcp-writers, so they stay on the read tier, and every call keeps the
      # account's own identity in the gateway audit log.
      #
      # Session first, then connector: the OAuth authorize endpoint sends an unauthenticated
      # browser to the brand default flow, which is JumpCloud-only. The operator logs in at
      # the flow URL first, then connects the MCP client in the same browser session.
      - model: authentik_core.group
        id: jenkins-mcp-service-accounts
        identifiers:
          name: jenkins-mcp-service-accounts

      # Master scope. The gateway lets a member of a jenkins-mcp-master-<name> group reach only
      # the masters those groups name, and a service account with no such group reaches none
      # (fail closed). Add one group per master an account needs.
      - model: authentik_core.group
        id: jenkins-mcp-master-pmm
        identifiers:
          name: jenkins-mcp-master-pmm

      - model: authentik_policies_expression.expressionpolicy
        id: jenkins-mcp-service-account-only
        identifiers:
          name: jenkins-mcp-service-account-only
        attrs:
          execution_logging: true
          expression: |
            user = request.context.get("pending_user")
            if not user:
                return False
            return user.type == "service_account" and ak_is_group_member(user, name="jenkins-mcp-service-accounts")

      - model: authentik_flows.flow
        id: jenkins-mcp-service-flow
        identifiers:
          slug: jenkins-mcp-service-login
        attrs:
          name: Jenkins MCP service account login
          title: Jenkins MCP service account login
          designation: authentication
          authentication: require_unauthenticated
          denied_action: message_continue
          policy_engine_mode: any

      - model: authentik_stages_identification.identificationstage
        id: jenkins-mcp-service-identification
        identifiers:
          name: jenkins-mcp-service-identification
        attrs:
          user_fields:
            - username
          sources: []
          show_matched_user: false
          pretend_user_exists: true
          case_insensitive_matching: true
          show_source_labels: false

      - model: authentik_stages_password.passwordstage
        id: jenkins-mcp-service-password
        identifiers:
          name: jenkins-mcp-service-password
        attrs:
          backends:
            - authentik.core.auth.TokenBackend
          failed_attempts_before_cancel: 3

      - model: authentik_stages_user_login.userloginstage
        id: jenkins-mcp-service-user-login
        identifiers:
          name: jenkins-mcp-service-user-login
        attrs:
          session_duration: seconds=0

      # Fail closed. A policy that fails on a stage binding makes Authentik skip that stage,
      # so without this stage an ineligible username silently falls through the flow (no
      # session, but also no message, and the prompt-or-redirect difference reveals which
      # usernames are eligible). The deny stage runs when the account policy fails (bound
      # negated) or when the reputation policy passes (it passes when the score is AT OR
      # BELOW the threshold, so it is bound as-is, not negated), so every ineligible or
      # throttled attempt ends in an explicit denial before the password prompt. Scores
      # expire 24h after the first failure. An operator clears one early with
      # DELETE /api/v3/policies/reputation/scores/<pk>/.
      - model: authentik_policies_reputation.reputationpolicy
        id: jenkins-mcp-service-reputation
        identifiers:
          name: jenkins-mcp-service-reputation
        attrs:
          check_ip: true
          check_username: true
          threshold: -5

      - model: authentik_stages_deny.denystage
        id: jenkins-mcp-service-deny
        identifiers:
          name: jenkins-mcp-service-deny
        attrs:
          deny_message: Access denied.

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf jenkins-mcp-service-flow
          stage: !KeyOf jenkins-mcp-service-identification
          order: 10

      - model: authentik_flows.flowstagebinding
        id: jenkins-mcp-service-deny-binding
        identifiers:
          target: !KeyOf jenkins-mcp-service-flow
          stage: !KeyOf jenkins-mcp-service-deny
          order: 15
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf jenkins-mcp-service-account-only
          target: !KeyOf jenkins-mcp-service-deny-binding
          order: 0
        attrs:
          enabled: true
          negate: true

      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf jenkins-mcp-service-reputation
          target: !KeyOf jenkins-mcp-service-deny-binding
          order: 1
        attrs:
          enabled: true
          negate: false

      - model: authentik_flows.flowstagebinding
        id: jenkins-mcp-service-password-binding
        identifiers:
          target: !KeyOf jenkins-mcp-service-flow
          stage: !KeyOf jenkins-mcp-service-password
          order: 20
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          policy_engine_mode: all

      - model: authentik_flows.flowstagebinding
        id: jenkins-mcp-service-login-binding
        identifiers:
          target: !KeyOf jenkins-mcp-service-flow
          stage: !KeyOf jenkins-mcp-service-user-login
          order: 30
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf jenkins-mcp-service-account-only
          target: !KeyOf jenkins-mcp-service-password-binding
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf jenkins-mcp-service-account-only
          target: !KeyOf jenkins-mcp-service-login-binding
          order: 0
        attrs:
          enabled: true

      # The account itself. The app password is not blueprint state: an operator mints it
      # once through the API (docs/runbooks/jenkins-mcp-operate.md, "Onboard a service
      # account") and hands it to the owning team out of band. A logged-in account can mint
      # its own tokens, so the token-* attributes cap anything it creates for itself at 30
      # minutes. The operator-minted app password is not affected by them. `owner` names the
      # person accountable for the key, since the username names a team.
      - model: authentik_core.user
        identifiers:
          username: pmm-automation
        attrs:
          name: PMM QA automation
          type: service_account
          path: goauthentik.io/service-accounts
          is_active: true
          groups:
            - !KeyOf jenkins-mcp-service-accounts
            - !KeyOf jenkins-mcp-master-pmm
          attributes:
            owner: davi.travaglia
            owner_team: pmm-qa
            goauthentik.io/user/token-expires: true
            goauthentik.io/user/token-maximum-lifetime: minutes=30

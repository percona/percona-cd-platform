{{/*
Authentik blueprint — declarative bootstrap of:
  1. Duo SAML Source (`duo-saml`)        — Authentik as SP to Duo IdP
  2. SAML groups Property Mapping        — propagate Duo `groups` attr inward
  3. OAuth2 Provider `grafana`           — Authentik as IdP to Grafana
  4. Application `grafana`               — binds the provider; gives the launcher tile

Why a blueprint (not a one-shot UI walkthrough):
  - GitOps-native: blueprint state is reconciled on every worker restart, so a
    UI drift gets repaired automatically.
  - Idempotent: blueprints declare desired state; Authentik computes diffs.
  - Reusable: adding Jenkins / ArgoCD as additional OIDC clients = appending
    two entries (provider + application) here.

What the blueprint can NOT do:
  - Read kubernetes Secrets directly. The SP signing keypair (cert + private
    key, sourced from AWS Secrets Manager via ESO into the `authentik-saml`
    Secret) is uploaded by templates/bootstrap-keypair-job.yaml — a one-shot
    Job that hits Authentik's API. Once the keypair exists by name, the
    blueprint references it via `!Find`.
  - Read the OIDC client_secret from the k8s Secret directly. We work around
    that with `!Env AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET` — the Authentik
    worker's `envFrom` (from values.yaml) injects the Secret as env vars, and
    `!Env` resolves at blueprint apply time.

Discovery:
  Mounted as a blueprint ConfigMap via `authentik.blueprints.configMaps`
  in values.yaml. The worker pod scans /blueprints/configmaps/<cm-name>/*.yaml
  on startup and runs the BlueprintInstance reconciler.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Required label for the chart's blueprint mount path. */}}
    app.kubernetes.io/component: blueprint
data:
  grafana-bridge.yaml: |
    version: 1
    metadata:
      name: grafana-bridge
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # ---- 1. Group Property Mapping: strip LDAP DN -> bare CN ----
      # Authentik's SAML source pipeline (introduced in 2024.8) splits user
      # mappings from group mappings. The user mapping cannot rename groups;
      # group renaming happens via a SEPARATE mapping bound to the source's
      # `group_property_mappings` field. This one runs ONCE PER raw SAML
      # group attribute value, with that raw value at request.context["group_id"].
      #
      # Duo (FreeIPA-backed) sends groups as full LDAP DNs:
      #   cn=grafana_cd_admins,cn=groups,cn=accounts,dc=int,dc=percona,dc=com
      # Grafana's ALLOWED_GROUPS / role-mapping JMESPath expects the bare CN
      # (`grafana_cd_admins`, `percona`). Strip the DN to its first CN value
      # and return it as the Authentik Group's `name`.
      #
      # References:
      #   - authentik/core/sources/flow_manager.py (per-group iteration over
      #     user_properties["groups"], builds groups_properties dict)
      #   - authentik/core/sources/mapper.py (SourceMapper.build_object_properties)
      #   - GroupUpdateStage.handle_groups creates the Group with this name
      #     and adds the user to it via GroupSAMLSourceConnection
      - model: authentik_sources_saml.samlsourcepropertymapping
        identifiers:
          name: duo-group-strip-dn
        id: duo-group-strip-dn
        attrs:
          name: duo-group-strip-dn
          expression: |
            import re
            raw = request.context.get("group_id", "")
            m = re.match(r"^cn=([^,]+)", raw, re.IGNORECASE)
            return {"name": m.group(1) if m else raw}

      # ---- 2. Duo SAML Source ----
      # signing_kp is referenced by name; templates/bootstrap-keypair-job.yaml
      # uploads the SP cert+key into a CertificateKeyPair named `duo-saml-sp`
      # before this blueprint applies.
      - model: authentik_sources_saml.samlsource
        id: duo-saml-source
        identifiers:
          slug: duo-saml
        attrs:
          name: Duo SSO
          slug: duo-saml
          enabled: true
          user_matching_mode: email_link
          user_path_template: "goauthentik.io/sources/%(slug)s"
          pre_authentication_flow: !Find [authentik_flows.flow, [slug, default-source-pre-authentication]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          sso_url: https://sso-b0cbd65b.sso.duosecurity.com/saml2/sp/DIS1DM3HXJYUVONGBVDH/sso
          issuer: https://sso-b0cbd65b.sso.duosecurity.com/saml2/sp/DIS1DM3HXJYUVONGBVDH/metadata
          binding_type: POST
          allow_idp_initiated: false
          name_id_policy: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
          signing_kp: !Find [authentik_crypto.certificatekeypair, [name, duo-saml-sp]]
          digest_algorithm: "http://www.w3.org/2001/04/xmlenc#sha256"
          signature_algorithm: "http://www.w3.org/2001/04/xmldsig-more#rsa-sha256"
          temporary_user_delete_after: "days=1"
          # No user_property_mappings: Authentik's get_base_user_properties
          # already extracts username/email/name/groups from the assertion;
          # we only need to rewrite group names, which goes through the
          # group_property_mappings field below (NOT user_property_mappings;
          # that field can't rename groups in the post-2024.8 source pipeline).
          group_property_mappings:
            - !KeyOf duo-group-strip-dn

      # ---- 3. Grafana OAuth2 / OpenID Provider ----
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: grafana
        id: grafana-provider
        attrs:
          name: grafana
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          # Authentik 2026.2+ requires invalidation_flow on OAuth2/OIDC providers
          # (governs RP-initiated logout). Use the built-in default.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
          access_code_validity: minutes=1
          access_token_validity: minutes=10
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.cd.percona.com/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      # ---- 4. Grafana Application (binds provider, shows on user portal) ----
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.cd.percona.com/
          open_in_new_tab: false
          policy_engine_mode: any
          group: ""

      # ---- 5. Wire the Duo source into the default identification stage ----
      # Authentik's default-authentication-identification stage ships with
      # `sources: []` and `user_fields: ["username", "email"]` — meaning the
      # login page renders a username/email form and never offers the SAML
      # source button. Patch the stage to:
      #
      #   1. Add duo-saml to `sources` so the SAML round-trip is reachable.
      #   2. Set `user_fields: []` to hide the local username/email form
      #      entirely. With one source + empty user_fields, the frontend
      #      renderer at web/src/flow/stages/identification/IdentificationStage.ts
      #      L136-151 auto-redirects the browser straight to the SAML IdP —
      #      users never see an Authentik form, just go to Duo.
      #   3. show_source_labels=true so when the auto-redirect doesn't fire
      #      (e.g. browser back-button to Authentik with multiple sources
      #      registered later), the source button shows its label, not just
      #      its icon.
      #
      # Why drop user_fields: the username form was a Duo-MFA bypass for the
      # local akadmin user (akadmin is a local Authentik user, not
      # Duo-federated, so passing it through the username form skipped Duo).
      # Closing the form closes the bypass. Recovery for akadmin is now via
      # Authentik's official troubleshooting path: `ak create_recovery_key
      # <minutes> akadmin` in the worker pod generates a one-shot URL that
      # bypasses the identification stage entirely. See
      # docs/runbooks/authentik-bootstrap.md "Lockout recovery — akadmin".
      #
      # Validation guard: IdentificationStageSerializer.validate() rejects
      # user_fields=[] AND sources=[] together. We have one source, so the
      # blueprint applies cleanly.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: []
          sources:
            - !KeyOf duo-saml-source
          show_source_labels: true

{{/*
Authentik blueprint — declarative bootstrap of:
  1. SAML Source (`duo-saml`)            — Authentik as SP to the JumpCloud IdP
     (slug kept from the Duo era so the ACS and metadata URLs never moved)
  2. SAML groups Property Mapping        — propagate the `groups` attr inward
  2b. JumpCloud IdP signing certificate  — pinned for signature verification
  3. OAuth2 Provider `grafana`           — Authentik as IdP to Grafana
  4. Application `grafana`               — binds the provider; gives the launcher tile

Why a blueprint (not a one-shot UI walkthrough):
  - GitOps-native: blueprint state is reconciled on every worker restart, so a
    UI drift gets repaired automatically.
  - Idempotent: blueprints declare desired state; Authentik computes diffs.
  - Reusable: adding Jenkins / ArgoCD as additional OIDC clients = appending
    two entries (provider + application) here.

What the blueprint can NOT do:
  - Read kubernetes Secrets directly. The SP signing keypair (cert + private
    key, sourced from AWS Secrets Manager via ESO into the `authentik-saml`
    Secret) is uploaded by templates/bootstrap-keypair-job.yaml — a one-shot
    Job that hits Authentik's API. Once the keypair exists by name, the
    blueprint references it via `!Find`.
  - Read the OIDC client_secret from the k8s Secret directly. We work around
    that with `!Env AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET` — the Authentik
    worker's `envFrom` (from values.yaml) injects the Secret as env vars, and
    `!Env` resolves at blueprint apply time.

Discovery:
  Mounted as a blueprint ConfigMap via `authentik.blueprints.configMaps`
  in values.yaml. The worker pod scans /blueprints/configmaps/<cm-name>/*.yaml
  on startup and runs the BlueprintInstance reconciler.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Required label for the chart's blueprint mount path. */}}
    app.kubernetes.io/component: blueprint
data:
  grafana-bridge.yaml: |
    version: 1
    metadata:
      name: grafana-bridge
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # ---- 1. Group Property Mapping: strip LDAP DN -> bare CN ----
      # Authentik's SAML source pipeline (introduced in 2024.8) splits user
      # mappings from group mappings. The user mapping cannot rename groups;
      # group renaming happens via a SEPARATE mapping bound to the source's
      # `group_property_mappings` field. This one runs ONCE PER raw SAML
      # group attribute value, with that raw value at request.context["group_id"].
      #
      # Duo (FreeIPA-backed) sent groups as full LDAP DNs:
      #   cn=grafana_cd_admins,cn=groups,cn=accounts,dc=int,dc=percona,dc=com
      # Grafana's ALLOWED_GROUPS / role-mapping JMESPath expects the bare CN
      # (`grafana_cd_admins`, `percona`). Strip the DN to its first CN value
      # and return it as the Authentik Group's `name`. JumpCloud sends plain
      # group names, which miss the `^cn=` match and pass through unchanged.
      # The two JumpCloud groups the consumers care about carry different
      # names there (one role-derived group every employee lands in, one
      # hand-picked admin group), so they are renamed here to the Duo-era
      # names and Grafana, ArgoCD and Headlamp keep their rules.
      #
      # Runtime state this depends on, which blueprints cannot declare
      # (the group link's `group` field is read-only in the API and the
      # blueprint schema): one GroupSAMLSourceConnection per renamed
      # identifier on this source, "Security Training Completed" bound to
      # the existing `percona` group and "grafana_cd_admins - SSO" bound to
      # the existing `grafana_cd_admins` group. Without a link the next
      # login enrols a second group under the renamed name. With a link the
      # login also rewrites the linked group's name to this mapping's
      # output, so the rename must be live before the link exists. On every
      # login the source removes the user from all groups linked to it and
      # re-adds the ones in the assertion, so membership of both groups is
      # directory-driven from JumpCloud.
      #
      # References:
      #   - authentik/core/sources/flow_manager.py (per-group iteration over
      #     user_properties["groups"], builds groups_properties dict)
      #   - authentik/core/sources/mapper.py (SourceMapper.build_object_properties)
      #   - GroupUpdateStage.handle_groups creates the Group with this name
      #     and adds the user to it via GroupSAMLSourceConnection
      - model: authentik_sources_saml.samlsourcepropertymapping
        identifiers:
          name: duo-group-strip-dn
        id: duo-group-strip-dn
        attrs:
          name: duo-group-strip-dn
          expression: |
            import re
            raw = request.context.get("group_id", "")
            # JumpCloud names differ from the Duo-era names the consumers
            # key on, so translate rather than touch four consumers.
            renames = {
                "Security Training Completed": "percona",
                "grafana_cd_admins - SSO": "grafana_cd_admins",
            }
            if raw in renames:
                return {"name": renames[raw]}
            m = re.match(r"^cn=([^,]+)", raw, re.IGNORECASE)
            return {"name": m.group(1) if m else raw}

      # ---- 1b. JumpCloud IdP signing certificate ----
      # Public half of JumpCloud's SAML signing key, so it is config and not
      # a secret: it belongs in git, not Secrets Manager. key_data is omitted
      # because a verification-only keypair holds no private key (the API
      # accepts an empty key_data; CertificateKeyPair.key_data is blank=True).
      #
      # Referenced by the source below through verification_kp. Rotation:
      # replace certificate_data here when JumpCloud rotates its key (the
      # current one expires 2031-09-17), nothing else moves.
      - model: authentik_crypto.certificatekeypair
        id: jumpcloud-idp-cert
        identifiers:
          name: jumpcloud-idp
        attrs:
          name: jumpcloud-idp
          certificate_data: |
            -----BEGIN CERTIFICATE-----
            MIIFdzCCA1+gAwIBAgIVAJTvwXTpzLKkoa5zemHJ6z7e4QoXMA0GCSqGSIb3DQEB
            CwUAMHUxCzAJBgNVBAYTAlVTMQswCQYDVQQIEwJDTzEQMA4GA1UEBxMHQm91bGRl
            cjEQMA4GA1UEChMHUGVyY29uYTEZMBcGA1UECxMQSnVtcENsb3VkU0FNTElkUDEa
            MBgGA1UEAxMRSnVtcENsb3VkU0FNTFVzZXIwHhcNMjYwOTE3MjAyMzM5WhcNMzEw
            OTE3MjAyMzM5WjB1MQswCQYDVQQGEwJVUzELMAkGA1UECBMCQ08xEDAOBgNVBAcT
            B0JvdWxkZXIxEDAOBgNVBAoTB1BlcmNvbmExGTAXBgNVBAsTEEp1bXBDbG91ZFNB
            TUxJZFAxGjAYBgNVBAMTEUp1bXBDbG91ZFNBTUxVc2VyMIICIjANBgkqhkiG9w0B
            AQEFAAOCAg8AMIICCgKCAgEA2RLOqKc/RkKOFAHbbR/ObHY3IHdW7bgLHH0zTgEC

{{/*
Authentik blueprint — ArgoCD OIDC client.

Companion to blueprint-grafana.yaml. Defines the OAuth2 provider that
ArgoCD speaks to and the Application binding that surfaces ArgoCD on
Authentik's launchpad. The SAML source, group property mapping, and
identification stage patches all live in blueprint-grafana.yaml — a
single ConfigMap mount serves the worker, but the per-consumer split
keeps blast-radius for any consumer-specific change small.

Notes on the picks:
  - matching_mode: regex on the localhost callback covers all CLI
    loopback ports without enumerating; argocd CLI defaults to 8085 but
    can be overridden with --sso-port.
  - groups scope mapping is matched by `managed:` (canonical name), not
    `scope_name:`, to avoid collision with custom mappings users may add
    via the UI later.
  - include_claims_in_id_token: true is set explicitly so future
    Authentik default flips don't silently break ArgoCD's group RBAC
    (ArgoCD reads `groups` from the id_token, not userinfo, by default).
  - access_token_validity bumped to 10 min from the Authentik default of
    5 to reduce silent-refresh churn in the web UI.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-argocd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* Required label for the chart's blueprint mount path. */}}
    app.kubernetes.io/component: blueprint
data:
  argocd-bridge.yaml: |
    version: 1
    metadata:
      name: argocd-bridge
      labels:
        blueprints.goauthentik.io/system: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd-provider
        attrs:
          client_id: argocd
          client_secret: !Env AUTHENTIK_OIDC_ARGOCD_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          include_claims_in_id_token: true
          access_token_validity:  minutes=10
          refresh_token_validity: days=30
          redirect_uris:
            - matching_mode: strict
              url: https://argo.cd.percona.com/auth/callback
            - matching_mode: regex
              url: ^http://localhost:[0-9]+/auth/callback$
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # No separate `groups` scope mapping is needed (or available):
          # Authentik 2026.2.2 does NOT ship one. The default `profile`
          # scope mapping already emits `groups` per its expression at
          # blueprints/system/providers-oauth2.yaml:45 —
          #   "groups": [group.name for group in request.user.groups.all()]
          # ArgoCD reads `groups` from the id_token claims map regardless
          # of which scope it came in (util/oidc/oidc.go:575-580 +
          # util/jwt/jwt.go:50-75 in argo-cd v3.4.1), so binding profile
          # is sufficient. Same set as the working grafana provider.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, argocd-provider]]
          meta_launch_url: https://argo.cd.percona.com
          open_in_new_tab: false
          policy_engine_mode: any
          group: ""

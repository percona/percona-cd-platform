{{/*
Runtime config — django SECRET_KEY, bootstrap admin password, bundled
Postgres password, and the OIDC client_secret for Grafana — all sourced
from a single AWS Secrets Manager entry (terraform/authentik.tf provisions
it as a JSON map). ESO splits the JSON into discrete env-var-shaped keys.

Why the JSON-bundle pattern rather than four ExternalSecrets:
  - Single rotation path (taint a random_password in TF + apply, ESO
    refreshes the Secret on its 1h interval, all dependent pods reload).
  - One $0.40/mo Secrets Manager line item instead of four.
  - The split happens here, in k8s, where it's cheap.

Keys produced in the resulting `authentik-config` Secret:
  AUTHENTIK_SECRET_KEY                  → consumed by all Authentik pods
  AUTHENTIK_BOOTSTRAP_PASSWORD          → seeds the akadmin user on first start
  AUTHENTIK_BOOTSTRAP_TOKEN             → API token created for akadmin at first
                                           boot; used by templates/bootstrap-
                                           keypair-job.yaml to authenticate
                                           against /api/v3/ via HTTP basic
                                           (Authentik rejects username:password
                                           on the API; only username:token works)
  AUTHENTIK_POSTGRESQL__PASSWORD        → bundled Bitnami Postgres + Authentik
  AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET  → resolved at blueprint apply time via
                                           !Env (templates/blueprint-grafana.yaml)
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: authentik-config
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_SECRET_KEY
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_BOOTSTRAP_PASSWORD
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_BOOTSTRAP_TOKEN
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_POSTGRESQL__PASSWORD
    - secretKey: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET

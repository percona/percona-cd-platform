{{/*
The reconciler runs in {{ .Release.Namespace }} but writes EndpointSlices
into {{ .Values.targetNamespace }} (where the jenkins-ingress proxy lives).
That cross-namespace write needs a Role in the target namespace bound to
the reconciler's ServiceAccount.

Scope: discovery.k8s.io/endpointslices RW only. Services in the target
namespace are managed by this same Helm release via templates/services.yaml,
so the reconciler does not need to read or write them at runtime.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.targetNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.targetNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}
  apiGroup: rbac.authorization.k8s.io

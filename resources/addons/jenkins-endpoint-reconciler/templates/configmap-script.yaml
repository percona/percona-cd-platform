{{/*
The reconciler script lives at files/reconcile.py in the chart so editors
treat it as real Python (not embedded YAML). Helm interpolates it here at
template time; ConfigMap rolls are detected by the CronJob's
checksum/config annotation on the pod template so a script edit triggers
a fresh Job pod on the next schedule tick.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
data:
  reconcile.py: |
{{ .Files.Get "files/reconcile.py" | indent 4 }}

{{/*
ClusterIP Services for the jenkins-ingress proxy to upstream to. One per
host. selector is omitted on purpose: there are no Pods to select — the
reconciler writes EndpointSlices directly. K8s service DNS resolves
`jenkins-<host>.<targetNamespace>.svc.cluster.local` to the ClusterIP,
kube-proxy iptables DNATs to whatever IP the reconciler last wrote.

These live in {{ .Values.targetNamespace }} (the jenkins-ingress proxy's
namespace), not the reconciler's own namespace, so nginx can resolve them
without cross-namespace DNS.
*/}}
{{- range .Values.hosts }}
apiVersion: v1
kind: Service
metadata:
  name: jenkins-{{ .name }}
  namespace: {{ $.Values.targetNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Name }}
    jenkins-host: {{ .name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ .port }}
      targetPort: {{ .port }}
---
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
# Trusted by an IAM role with ec2:DescribeInstances via a Pod Identity
# association declared in terraform/pod-identity.tf. No annotations needed
# (Pod Identity binds via the association, not via SA annotations as IRSA
# does). The eks-pod-identity-agent managed addon must be running.

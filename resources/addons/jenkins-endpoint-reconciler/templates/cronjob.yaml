apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
spec:
  schedule: {{ .Values.schedule | quote }}
  # Forbid: a long-running reconcile (e.g. AWS API throttling) should not
  # be racing a fresh one. Each tick is idempotent anyway.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # If a tick is missed because the controller is offline, don't spam
  # catch-up runs once it comes back.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      # Hard upper bound on the run, kept under the 1-minute schedule so a
      # killed run never collides with the next tick. Healthy probes answer
      # in ~120ms; the bound covers the worst case of several blackholed
      # candidates timing out at 2s each across the 8 hosts.
      activeDeadlineSeconds: 55
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          annotations:
            # Roll the Job's Pod template whenever the host list changes so the
            # next tick picks it up; an image rebuild (tag bump) rolls it too.
            checksum/hosts: {{ .Values.hosts | toYaml | sha256sum }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          # Reconciler does not need a privileged tier; the default (general)
          # Karpenter NodePool is the landing zone via no tolerations. Assign
          # the preemptible tier explicitly for parity with the other addons.
          priorityClassName: platform-default
          containers:
            - name: reconciler
              # Built from images/jenkins-endpoint-reconciler (deps baked in),
              # pushed to ECR under percona-cd/. Account + region come from the
              # addons ApplicationSet valuesObject (terraform/argocd.tf).
              image: "{{ (.Values.aws | default dict).accountId }}.dkr.ecr.{{ (.Values.aws | default dict).region | default "us-east-1" }}.amazonaws.com/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: HOSTS_JSON
                  value: {{ .Values.hosts | toJson | quote }}
                - name: TARGET_NAMESPACE
                  value: {{ .Values.targetNamespace | quote }}
                # boto3 needs a default region for client initialization even
                # though every ec2.Client() call passes region_name explicitly.
                - name: AWS_REGION
                  value: {{ (.Values.aws | default dict).region | default "us-east-1" | quote }}
              resources: {{ toYaml .Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: ["ALL"]

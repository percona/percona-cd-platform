aws-load-balancer-controller:
  clusterName: percona-ci-platform   # ApplicationSet rewrites via cluster-secret annotation
  serviceAccount:
    create: true
    name: aws-load-balancer-controller
  region: us-east-1
  enableServiceMutatorWebhook: false
  defaultTags:
    managed-by: argocd
    repo: github.com/nogueiraanderson/percona-ci-platform

  # Robustness: 2 replicas, PDB minAvailable=1 so node drain can't fully
  # evict; system-critical priority so Karpenter consolidation never preempts.
  replicaCount: 2
  priorityClassName: platform-system-critical
  podDisruptionBudget:
    minAvailable: 1

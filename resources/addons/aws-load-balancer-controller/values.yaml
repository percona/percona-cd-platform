aws-load-balancer-controller:
  clusterName: percona-ci-platform   # ApplicationSet rewrites via cluster-secret annotation
  serviceAccount:
    create: true
    name: aws-load-balancer-controller
  region: us-east-1
  enableServiceMutatorWebhook: false
  defaultTags:
    managed-by: argocd
    repo: github.com/nogueiraanderson/percona-ci-platform

  # Robustness: 2 replicas, PDB minAvailable=1 so node drain can't fully
  # evict; system-critical priority so Karpenter consolidation never preempts.
  replicaCount: 2
  priorityClassName: platform-system-critical
  podDisruptionBudget:
    minAvailable: 1

  # Bootstrap-tier pin + toleration. The CriticalAddonsOnly taint Stage 2b
  # will add to the system MNG is AWS-canonical; the controller's own chart
  # does not ship a default toleration for it. nodeSelector pins us to the
  # bootstrap MNG so a Karpenter consolidation can never strand the
  # controller on a spot node that's about to be reclaimed.
  nodeSelector:
    node-role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

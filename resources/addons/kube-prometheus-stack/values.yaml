# kube-prometheus-stack — staged for removal (LGTM-only, ADR 0016).
#
# State at this commit (P5b):
#   - Prometheus server: SCALED TO 0. Alloy DS owns scrape (P4). The
#     PVC is retained for fast rollback (un-scale -> read WAL).
#   - Alertmanager: STAYS at 3 replicas — Mimir's built-in AM is enabled
#     but no PrometheusRule routes to it yet. P6 will document the
#     `mimir-alertmanager.mimir:8080` target and remove kps's AM.
#   - kube-state-metrics: DISABLED. Standalone chart at
#     resources/addons/kube-state-metrics/ replaces it.
#   - node-exporter: DISABLED. Standalone chart at
#     resources/addons/prometheus-node-exporter/ replaces it.
#   - prometheus-operator: STAYS — controls AM until P6.
#   - CRDs: STAYS owned here too (resources/addons/prometheus-operator-crds/
#     also reconciles them via server-side apply, with `helm.sh/resource-
#     policy: keep` so kps's prune in P6 doesn't take them down).
#   - Grafana: DISABLED (long-standing, standalone Grafana addon owns it).
kube-prometheus-stack:
  crds:
    enabled: true

  # KSM: DISABLED. resources/addons/kube-state-metrics/ replaces it.
  # The standalone chart's ServiceMonitor is picked up by Alloy DS via
  # `prometheus.operator.servicemonitors` (P4).
  kubeStateMetrics:
    enabled: false

  # node-exporter: DISABLED. resources/addons/prometheus-node-exporter/
  # replaces it.
  nodeExporter:
    enabled: false

  prometheus:
    prometheusSpec:
      # Scaled to 0 — Alloy DS is the scraper now (P4). Keep the
      # Prometheus CR + PVC around so a rollback is `replicas: 1` and
      # a few minutes wait, no chart dance.
      replicas: 0

      # Agent-shaped storage. Retained at scale=0 so the WAL is
      # available if we need to read recent samples that hadn't yet
      # flushed to Mimir at the moment we scaled down.
      retention: 24h
      retentionSize: 8GiB
      nodeSelector:
        workload: prometheus
      tolerations:
        - key: workload
          operator: Equal
          value: prometheus
          effect: NoSchedule
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-monitoring-1a-retain
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
      # Pick up ServiceMonitor / PodMonitor / PrometheusRule from any
      # namespace, not just the one Helm puts the CRD instances into.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Ship every sample to Mimir distributors. Single-tenant cluster,
      # so X-Scope-OrgID is a constant. Mimir's distributor Service runs
      # on port 8080 (chart default).
      # Backoff defaults are sane (5s..5min). Bump max_shards if remote
      # falls behind under sustained load — start with the chart default.
      remoteWrite:
        - url: http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push
          headers:
            X-Scope-OrgID: percona-ci

      # Robustness: WAL workload that we cannot afford to lose mid-flight.
      priorityClassName: platform-stateful-high

  alertmanager:
    alertmanagerSpec:
      # HA: 3 replicas, anti-affinity by hostname so a single node loss
      # never takes more than one peer down. Operator handles peer mesh
      # config automatically.
      replicas: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        workload: prometheus
      tolerations:
        - key: workload
          operator: Equal
          value: prometheus
          effect: NoSchedule
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-monitoring-1a-retain
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

      # Robustness: AM holds silences + dedup state; treat it like a stateful workload.
      priorityClassName: platform-stateful-high
      podDisruptionBudget:
        minAvailable: 2

  # Bundled Grafana is OFF — replaced by the standalone grafana chart in
  # L-4 (SAML/Duo configuration is too granular for the bundled chart's
  # values surface). But we still want this chart's ~15 K8s dashboards
  # (nodes, pods, deployments, etcd, kubelet, scheduler, etc.) shipped as
  # ConfigMaps so the standalone Grafana's sidecar (label
  # `grafana_dashboard=1`, searchNamespace=ALL) auto-imports them.
  grafana:
    enabled: false
    forceDeployDashboards: true
    forceDeployDatasources: false  # standalone chart owns its datasources

  prometheusOperator:
    nodeSelector:
      node-role: system
    priorityClassName: platform-system-critical
    admissionWebhooks:
      patch:
        nodeSelector:
          node-role: system

# kube-prometheus-stack — reconfigured for the LGTM topology.
#
# Role split after L-3:
#   - Prometheus operator + CRDs: STAYS HERE. Every ServiceMonitor /
#     PodMonitor / PrometheusRule cluster-wide flows through it.
#   - Prometheus server: STAYS, but agent-shaped. 24h retention, 10Gi PVC.
#     remoteWrite ships everything to Mimir; the local PVC is the WAL only.
#   - Alertmanager: STAYS, scaled to 3 replicas with podAntiAffinity.
#   - node-exporter, kube-state-metrics: STAY, unchanged.
#   - Grafana: DISABLED — moved to standalone chart in L-4 with SAML/Duo wiring.
kube-prometheus-stack:
  crds:
    enabled: true

  prometheus:
    prometheusSpec:
      # Agent-shaped storage. The bulk of metrics live in Mimir; this PVC
      # is the WAL Prometheus writes while remoteWrite is in-flight or
      # catching up after a Mimir blip.
      retention: 24h
      retentionSize: 8GiB
      nodeSelector:
        workload: prometheus
      tolerations:
        - key: workload
          operator: Equal
          value: prometheus
          effect: NoSchedule
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-monitoring-1a-retain
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
      # Pick up ServiceMonitor / PodMonitor / PrometheusRule from any
      # namespace, not just the one Helm puts the CRD instances into.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Ship every sample to Mimir distributors. Single-tenant cluster,
      # so X-Scope-OrgID is a constant. Mimir's distributor Service runs
      # on port 8080 (chart default).
      # Backoff defaults are sane (5s..5min). Bump max_shards if remote
      # falls behind under sustained load — start with the chart default.
      remoteWrite:
        - url: http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push
          headers:
            X-Scope-OrgID: percona-ci

      # Robustness: WAL workload that we cannot afford to lose mid-flight.
      priorityClassName: platform-stateful-high

      # PS-10997 Phase 2: scrape /hetzner-prometheus on each of the 10
      # Percona Jenkins masters. Endpoint is gated by Jenkins.SYSTEM_READ;
      # auth is HTTP basic with the shared `prom-scraper` user, token
      # mounted from Secret `jenkins-scraper-auth` (provisioned by the
      # ExternalSecret in templates/external-secret-jenkins-scraper.yaml).
      #
      # Connectivity is hybrid: 7 masters reachable via VPC peering with
      # the cluster VPC (resolved to private IPs via the Route53 private
      # hosted zone for cd.percona.com); 3 masters share CIDR 10.177/22
      # with another peered master and fall back to public+NAT-GW. The
      # `master` relabel makes the path transparent to dashboards.
      #
      # The 5 PENDING masters (HPI pinned, awaiting next JVM restart)
      # will return up=0 until they activate; expected and benign.
      additionalScrapeConfigs:
        - job_name: jenkins-hetzner
          metrics_path: /hetzner-prometheus
          scheme: https
          scrape_interval: 60s
          scrape_timeout: 30s
          basic_auth:
            username: prom-scraper
            password:
              name: jenkins-scraper-auth
              key: password
          static_configs:
            - targets:
                - ps3.cd.percona.com:443
                - rel.cd.percona.com:443
                - pg.cd.percona.com:443
                - ps57.cd.percona.com:443
                - psmdb.cd.percona.com:443
                - pxb.cd.percona.com:443
                - ps80.cd.percona.com:443
                - pmm.cd.percona.com:443
                - cloud.cd.percona.com:443
                - pxc.cd.percona.com:443
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^.]+)\.cd\.percona\.com:.*'
              target_label: master
              replacement: '$1'
            - target_label: fleet
              replacement: percona-jenkins

  alertmanager:
    alertmanagerSpec:
      # HA: 3 replicas, anti-affinity by hostname so a single node loss
      # never takes more than one peer down. Operator handles peer mesh
      # config automatically.
      replicas: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        workload: prometheus
      tolerations:
        - key: workload
          operator: Equal
          value: prometheus
          effect: NoSchedule
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-monitoring-1a-retain
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

      # Robustness: AM holds silences + dedup state; treat it like a stateful workload.
      priorityClassName: platform-stateful-high
      podDisruptionBudget:
        minAvailable: 2

  # Bundled Grafana is OFF — replaced by the standalone grafana chart in
  # L-4 (SAML/Duo configuration is too granular for the bundled chart's
  # values surface). But we still want this chart's ~15 K8s dashboards
  # (nodes, pods, deployments, etcd, kubelet, scheduler, etc.) shipped as
  # ConfigMaps so the standalone Grafana's sidecar (label
  # `grafana_dashboard=1`, searchNamespace=ALL) auto-imports them.
  grafana:
    enabled: false
    forceDeployDashboards: true
    forceDeployDatasources: false  # standalone chart owns its datasources

  prometheusOperator:
    nodeSelector:
      node-role: system
    priorityClassName: platform-system-critical
    admissionWebhooks:
      patch:
        nodeSelector:
          node-role: system

  prometheus-node-exporter:
    tolerations:
      - operator: Exists
    priorityClassName: platform-system-critical

  kube-state-metrics:
    nodeSelector:
      node-role: system
    priorityClassName: platform-system-critical

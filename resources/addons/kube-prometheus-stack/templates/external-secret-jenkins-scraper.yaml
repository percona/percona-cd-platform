{{/*
ExternalSecret syncing the `prom-scraper` Jenkins API token used by
Prometheus to scrape /hetzner-prometheus on each of the 10 Jenkins
masters (PS-10997 Phase 2).

Source: AWS Secrets Manager entry `percona-ci-platform/jenkins/scraper`
provisioned out-of-band, JSON shape `{"prom_scraper_token": "<token>"}`.
ESO splits the property `prom_scraper_token` into a single-key Secret
named `jenkins-scraper-auth` (key: `password`) that
prometheus.prometheusSpec.additionalScrapeConfigs references via
basic_auth.password.{name,key}.

The shared `prom-scraper` Jenkins user has `Overall/SystemRead`
permission on every master, sufficient for the
`/hetzner-prometheus` endpoint's Jenkins.SYSTEM_READ gate.

Always rendered (no gate). The ClusterSecretStore at
resources/addons/external-secrets/templates/cluster-secret-store.yaml
authenticates via Pod Identity; existing
aws_iam_policy.eso_secrets_manager_read grants
secretsmanager:GetSecretValue on percona-ci-platform/*, covering this
read with no IAM edit.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-scraper-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: jenkins-scraper-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: percona-ci-platform/jenkins/scraper
        property: prom_scraper_token

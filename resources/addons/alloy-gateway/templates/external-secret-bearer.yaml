{{/*
ExternalSecret pulling the alloy-gateway bearer token from AWS Secrets
Manager into a Kubernetes Secret consumed by the NGINX bearer-auth sidecar
defined in templates/configmap-nginx-auth.yaml + values.yaml.

Source: AWS Secrets Manager `percona-ci-platform/alloy-gateway/bearer`
(JSON: `{"bearer_token": "<openssl rand -hex 32>"}`). One-time bootstrap
runbook documented in ADR 0013 / plan file `Push-model implementation`.

Target: Secret `alloy-gateway-bearer` (key: bearer_token) in this
Application's namespace. The nginx sidecar reads it via env var
BEARER_TOKEN (valueFrom.secretKeyRef in values.yaml).

Pattern mirrors resources/addons/grafana/templates/external-secret-oidc.yaml.
ESO ClusterSecretStore: aws-secrets-manager (Pod Identity, see
resources/addons/external-secrets/templates/cluster-secret-store.yaml).
The existing aws_iam_policy.eso_secrets_manager_read grants
secretsmanager:GetSecretValue on percona-ci-platform/* — covers this read
with no IAM edit.

Refresh interval 1h: rotation latency for the bearer token. After
rotating the Secrets Manager value, restart the alloy-gateway Pods to
pick up the new env var (`kubectl -n alloy-gateway rollout restart deploy
alloy-gateway`).
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-gateway-bearer
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alloy-gateway-bearer
    creationPolicy: Owner
  data:
    - secretKey: bearer_token
      remoteRef:
        key: percona-ci-platform/alloy-gateway/bearer
        property: bearer_token

# AWS facts broadcast by the addons ApplicationSet (keeps the account id out of git).
aws:
  accountId: ""
  region: us-east-1

# S3 export bucket (terraform jenkins-mcp-exports.tf). export_build_log / export_build_artifact
# stream a log/artifact here and return a short-lived presigned GET URL (default 6h, capped at 6h).
s3:
  exportsBucket: percona-ci-platform-jenkins-mcp-exports
  presignTtl: 21600

# First-party image (images/jenkins-mcp), pushed to ECR under percona-cd/.
image:
  repository: percona-cd/jenkins-mcp
  tag: "0.9.0-4a645f9e134f"
  pullPolicy: IfNotPresent

replicaCount: 1
# Operate mode: serve the build-lifecycle tools (build/replay/stop/cancel) after the fail-closed
# permission preflight, gated per-call to the jenkins-mcp-writers group. Reads stay open to any
# authenticated user, except get_item_config (config.xml) which is writers-gated; node-config and
# script-console mutation are never served. Set readOnly: true to revert.
readOnly: false
enableOperate: true

# OAuth2 resource-server auth against Authentik (Duo-backed). The server validates
# bearer JWTs and serves RFC 9728 protected-resource-metadata. audience is the
# Authentik client_id (Authentik stamps aud = client_id, as the headlamp client does).
oidc:
  issuer: https://auth.cd.percona.com/application/o/jenkins-mcp/
  jwksUri: https://auth.cd.percona.com/application/o/jenkins-mcp/jwks/
  audience: jenkins-mcp
  publicBaseUrl: https://jenkins-mcp.cd.percona.com

# NOT named `host`: the addons ApplicationSet broadcasts a global top-level `host`
# (the Authentik hostname) to every addon, which would clobber this and put the
# gateway ingress on auth.cd.percona.com. Use a key the broadcast does not touch.
ingressHost: jenkins-mcp.cd.percona.com
ingressEnabled: true   # set false for a ClusterIP-only deploy (e.g. a port-forward smoke)

# ESO: the fleet config (masters + read-only JNKPercona tokens) is one JSON blob in
# AWS Secrets Manager, synced to a file the pod mounts. Provisioned out-of-band.
externalSecret:
  remoteKey: percona-ci-platform/jenkins-mcp/fleet

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Prometheus scrape of /metrics. The cluster Alloy DaemonSet discovers every ServiceMonitor
# cluster-wide and remote-writes to Mimir; no selector label is needed. Set enabled: false to stop.
serviceMonitor:
  enabled: true
  interval: 30s

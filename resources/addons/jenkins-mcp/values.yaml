# AWS facts broadcast by the addons ApplicationSet (keeps the account id out of git).
aws:
  accountId: ""
  region: us-east-1

# S3 export bucket (terraform jenkins-mcp-exports.tf). export_build_log / export_build_artifact
# stream a log/artifact here and return a short-lived presigned GET URL (default 6h, capped at 6h).
s3:
  exportsBucket: percona-ci-platform-jenkins-mcp-exports
  presignTtl: 21600

# First-party image (images/jenkins-mcp), pushed to ECR under percona-cd/.
image:
  repository: percona-cd/jenkins-mcp
  tag: "0.10.8-71f9f1e3d3fa"
  pullPolicy: IfNotPresent

replicaCount: 2

# Stateless streamable-http: FastMCP builds a fresh transport per request, so no replica holds a
# client's session and the ALB needs no stickiness. Required for replicaCount above 1. In this mode
# GET /mcp returns 405, which the MCP spec allows for a server that offers no SSE stream, and no
# tool here pushes server-initiated messages. Read by FastMCP from the env, not from a CLI flag.
statelessHttp: true
# Operate mode: serve the build-lifecycle tools (build/replay/stop/cancel) after the fail-closed
# permission preflight, gated per-call to the jenkins-mcp-writers group. Reads stay open to any
# authenticated user, except get_item_config and search_item_configs (config.xml), which are
# writers-gated; node-config and script-console mutation are never served. Set readOnly: true to revert.
readOnly: false
enableOperate: true

# Per-job build grants for service accounts (jenkins-mcp-service-accounts members), keyed by
# username, then master, then job fullname. A grant lets build_item run on that job without the
# writers group, nothing else in the operate tier. Rules: `require` (present and non-blank),
# `allow` (value list, when present), `pattern` (full-match regex, when present). A job with rules
# must be started with buildWithParameters. Runbook: docs/runbooks/jenkins-mcp-operate.md.
serviceGrants:
  pmm-automation:
    pmm:
      pmm3-nightly-orchestrator: {}
      pmm3-ui-tests-nightly-gha: {}
      pmm3-ui-tests-matrix: {}
      pmm3-ui-tests: {}
      pmm3-upgrade-ami-test-runner: {}
      pmm3-ui-tests-nightly-gssapi: {}
      openshift-helm-tests: {}
      pmm3-ha-tests: {}
      pmm3-ha-backup-restore-tests: {}
      pmm3-ha-upgrade-tests: {}
      pmm3-post-release-testing: {}
      pmm3-image-scanning: {}
      # Cleanup: one named resource per run, the name in the form its create job generates.
      pmm3-ha-eks-cleanup:
        require: [ACTION, CLUSTER_NAME]
        allow: {ACTION: [DELETE_CLUSTER]}
        pattern: {CLUSTER_NAME: 'pmm-ha-test-[0-9]{1,6}'}
      pmm3-ha-rosa-cleanup:
        require: [ACTION, CLUSTER_NAME]
        allow: {ACTION: [DELETE_CLUSTER]}
        pattern: {CLUSTER_NAME: 'pmm-ha-rosa-[0-9]{1,6}'}
      openshift-cluster-destroy:
        require: [CLUSTER_NAME, FORCE_MODE]
        allow: {FORCE_MODE: ['false']}
        pattern: {CLUSTER_NAME: '(nightly|helm)-test-[0-9]{1,6}'}
      aws-staging-stop:
        require: [VM]
        pattern: {VM: 'pmm-[A-Za-z0-9._-]{1,40}-[0-9]{8}\.[0-9]{6}-[0-9]{1,8}'}
      pmm3-ami-staging-stop:
        require: [AMI_ID]
        pattern: {AMI_ID: 'i-[0-9a-f]{8,17}'}

# OAuth2 resource-server auth against Authentik (JumpCloud-backed). The server validates
# bearer JWTs and serves RFC 9728 protected-resource-metadata. audience is the
# Authentik client_id (Authentik stamps aud = client_id, as the headlamp client does).
oidc:
  issuer: https://auth.cd.percona.com/application/o/jenkins-mcp/
  jwksUri: https://auth.cd.percona.com/application/o/jenkins-mcp/jwks/
  audience: jenkins-mcp
  publicBaseUrl: https://jenkins-mcp.cd.percona.com

# NOT named `host`: the addons ApplicationSet broadcasts a global top-level `host`
# (the Authentik hostname) to every addon, which would clobber this and put the
# gateway ingress on auth.cd.percona.com. Use a key the broadcast does not touch.
ingressHost: jenkins-mcp.cd.percona.com
ingressEnabled: true   # set false for a ClusterIP-only deploy (e.g. a port-forward smoke)

# ESO: the fleet config (masters + read-only JNKPercona tokens) is one JSON blob in
# AWS Secrets Manager, synced to a file the pod mounts. Provisioned out-of-band.
externalSecret:
  remoteKey: percona-ci-platform/jenkins-mcp/fleet

resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi

# One pod per node. matchLabelKeys scopes the constraint to the current ReplicaSet, so a
# rolling update is not blocked by the outgoing revision still holding a node.
topologySpread:
  enabled: true

# maxUnavailable (not minAvailable): at a single replica a minAvailable budget would block
# every node drain, which is the PodEvictionFailure trap that stalls managed node group updates.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Prometheus scrape of /metrics. The cluster Alloy DaemonSet discovers every ServiceMonitor
# cluster-wide and remote-writes to Mimir; no selector label is needed. Set enabled: false to stop.
serviceMonitor:
  enabled: true
  interval: 30s

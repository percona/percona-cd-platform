{{- if and (not .Values.readOnly) (not .Values.enableOperate) }}
{{- fail "jenkins-mcp: set readOnly=true OR enableOperate=true. The server itself fails closed to read-only without a mode flag, but the deployment must still declare its access mode explicitly." }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.statelessHttp) }}
{{- fail "jenkins-mcp: replicaCount above 1 requires statelessHttp=true. A stateful transport keeps each client's session in one pod's memory and the ALB has no stickiness, so extra replicas reject session-bound requests." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      priorityClassName: platform-default
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jenkins-mcp
              app.kubernetes.io/instance: {{ .Release.Name }}
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
      containers:
        - name: jenkins-mcp
          image: "{{ (.Values.aws | default dict).accountId }}.dkr.ecr.{{ (.Values.aws | default dict).region | default "us-east-1" }}.amazonaws.com/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "9887"
            {{- if .Values.readOnly }}
            - --read-only
            {{- else if .Values.enableOperate }}
            - --enable-operate
            {{- end }}
          env:
            - name: HOME
              value: /home/app
            {{- if .Values.statelessHttp }}
            - name: FASTMCP_STATELESS_HTTP
              value: "true"
            {{- end }}
            - name: MCP_JENKINS_FLEET_FILE
              value: /etc/jenkins-mcp/fleet.json
            - name: MCP_OIDC_ISSUER
              value: {{ required "jenkins-mcp: oidc.issuer is required (refusing to render without OIDC auth)" .Values.oidc.issuer | quote }}
            - name: MCP_OIDC_JWKS_URI
              value: {{ required "jenkins-mcp: oidc.jwksUri is required" .Values.oidc.jwksUri | quote }}
            - name: MCP_OIDC_AUDIENCE
              value: {{ required "jenkins-mcp: oidc.audience is required" .Values.oidc.audience | quote }}
            - name: MCP_PUBLIC_BASE_URL
              value: {{ required "jenkins-mcp: oidc.publicBaseUrl is required" .Values.oidc.publicBaseUrl | quote }}
            - name: MCP_S3_BUCKET
              value: {{ required "jenkins-mcp: s3.exportsBucket is required" .Values.s3.exportsBucket | quote }}
            - name: MCP_AWS_REGION
              value: {{ (.Values.aws | default dict).region | default "us-east-1" | quote }}
            - name: MCP_S3_PRESIGN_TTL
              value: {{ .Values.s3.presignTtl | default 21600 | quote }}
          ports:
            - name: http
              containerPort: 9887
          # timeoutSeconds defaults to 1, which a Python server under a heavy read can miss even
          # with the request work off the event loop: Python's regex engine never releases the GIL,
          # so filtering a large console measurably stalls the loop for whole seconds (worst
          # observed 2.7s while scanning a real master). Give the probes headroom so a slow reply
          # costs a retry, not a SIGKILL that drops every in-flight MCP session on the pod. A truly
          # hung process still fails three consecutive probes and restarts.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: fleet
              mountPath: /etc/jenkins-mcp
              readOnly: true
            - name: home
              mountPath: /home/app
      volumes:
        - name: fleet
          secret:
            secretName: jenkins-mcp-fleet
        - name: home
          emptyDir: {}

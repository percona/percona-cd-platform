{{/*
The fleet config (masters + read-only JNKPercona Jenkins API tokens) is one JSON
blob in AWS Secrets Manager, synced here as fleet.json and mounted by the pod
(MCP_JENKINS_FLEET_FILE). The EKS cluster cannot read a master's Jenkins
credential store, so the tokens are mirrored into Secrets Manager out-of-band
(a Jenkins-minted token does not originate in terraform); provisioned at the
deploy gate.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-mcp-fleet
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: jenkins-mcp-fleet
    creationPolicy: Owner
  data:
    - secretKey: fleet.json
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AL2023 EKS-optimized AMI, pinned to a specific dated build. Resolved via:
  #   aws ssm get-parameter --name \
  #     /aws/service/eks/optimized-ami/1.35/amazon-linux-2023/arm64/standard/recommended/release_version
  # Bump as part of the cluster-version sweep (see docs/runbooks/eks-upgrade.md
  # — bumping AMIs without bumping the cluster version is also valid for
  # security patches). docs/eks-hardening.md item #5.
  amiSelectorTerms:
    - alias: al2023@v20260423

  # Worker IAM role — Pod Identity-bound by terraform/karpenter-prereqs.tf
  # (stable name, no name-prefix). ApplicationSet helm valuesObject does NOT
  # rewrite this field; the cluster-name prefix matches the TF default.
  role: percona-ci-platform-karpenter-node

  # Subnets + SGs auto-discovered by tag. Wave 1's vpc.tf tags every private
  # subnet and the worker SG with `karpenter.sh/discovery = <cluster_name>`,
  # so adding a subnet/SG to discovery is a one-tag change.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: percona-ci-platform
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: percona-ci-platform

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  # IMDSv2 only, hop-limit 1. Matches the managed NGs (eks.tf). Hop=1 blocks
  # non-host-network pods from reaching IMDS — desired, because pods should
  # use Pod Identity (eks-pod-identity-agent runs host-network and is
  # unaffected). docs/eks-hardening.md item #3.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Kubelet reservations + eviction thresholds. Critical for memory-bound
  # Mimir/Loki ingester nodes -- the chart default (memory.available 100Mi,
  # no system reserves) leaves no headroom for the kubelet and DaemonSets
  # when an ingester sits at its memory limit. Used absolute byte values
  # on memory.available (not %) because % drifts with instance size.
  kubelet:
    systemReserved:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 2Gi
    kubeReserved:
      cpu: 250m
      memory: 768Mi
      ephemeral-storage: 2Gi
    evictionHard:
      memory.available: "500Mi"
      nodefs.available: "10%"
    evictionSoft:
      memory.available: "1Gi"
    evictionSoftGracePeriod:
      memory.available: "30s"
    imageGCHighThresholdPercent: 85
    imageGCLowThresholdPercent: 80
    maxPods: 35

  # Tags propagated onto every Karpenter-launched EC2 instance AND its EBS
  # volumes. iit-billing-tag + PerconaKeep are MANDATORY — without them, the
  # percona-dev-admin cleanup Lambdas reap nodes after 10 min and volumes
  # daily. See CLAUDE.md item #7 and docs/eks-hardening.md.
  tags:
    iit-billing-tag: percona-ci-platform
    PerconaKeep: "True"
    managed-by: karpenter
    repo: github.com/Percona/percona-cd-platform

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: lgtm-stateful
spec:
  template:
    metadata:
      labels:
        # Tier taxonomy: tolerating pods opt in via the matching
        # `workload.percona.com/tier=lgtm-stateful` toleration and
        # nodeSelector. The taint below makes the pool exclusive.
        workload.percona.com/tier: lgtm-stateful
        workload.percona.com/managed-by: karpenter
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        # On-demand only -- stateful LGTM pods (Mimir/Loki/Tempo ingester
        # WAL, store-gateway block cache, compactor scratch, alertmanager
        # NFLog) cannot afford spot reclamation. The 2026-05-11 outage was
        # the t3.medium system MNG burst-credit-starving with ingesters on
        # board; this pool ensures every replacement is on-demand.
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        # Memory-leaning Graviton families. r-class is ~2x mem/$ vs m-class
        # for Mimir/Loki ingester resident heap workloads. Graviton3 (r7g/m7g)
        # primary, Graviton4 (r8g/m8g) as a capacity backstop. Karpenter picks
        # the cheapest satisfiable, m7g.large at the current ingester footprint.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [r7g, m7g, r8g, m8g]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge]
        # Multi-AZ (us-east-1a/b/c). ADR 0020 intended single-AZ 1a, but the
        # stateful EBS volumes drifted to 1b/1c (ADR 0023, open) and the pods
        # follow their per-AZ volume. Pinning 1a would strand them on any roll;
        # S3 is the durable block store, the EBS WAL re-attaches in its own AZ.
        # Re-narrow to 1a once ADR 0023 migrates the volumes back.
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a, us-east-1b, us-east-1c]
      taints:
        - key: workload.percona.com/tier
          value: lgtm-stateful
          effect: NoSchedule
      # Stateful nodes do not get recycled on a clock. Karpenter still
      # consolidates when empty and replaces on unhealthy; voluntary
      # disruption is bounded by disruption.budgets below.
      expireAfter: Never
      # Mimir ingester WAL flush + chunks flush + cleanup takes ~60s; allow
      # 10m headroom before SIGKILL.
      terminationGracePeriod: 10m

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

  limits:
    cpu: "64"
    memory: 256Gi

  disruption:
    # WhenEmpty (not WhenEmptyOrUnderutilized) -- never bin-pack a running
    # ingester onto a smaller node to save dollars. The pool already runs
    # on-demand at near-minimal size for resilience.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
        reasons: [Empty]
      # Block Karpenter's voluntary disruption for Drift/Underutilized;
      # those reasons can pile on top of a rollout-operator coordinated
      # zone restart and double-evict ingesters.
      - nodes: "0"
        reasons: [Drifted, Underutilized]

  # Higher than default(10) -- tolerating pods land here when capacity is
  # available; fall through to the default pool (which they could only
  # reach by also dropping the lgtm-stateful toleration, which they won't)
  # is therefore impossible. Belt-and-suspenders for hard pin.
  weight: 50

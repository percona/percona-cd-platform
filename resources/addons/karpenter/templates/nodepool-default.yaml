apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        # Tier taxonomy: every node carries the canonical
        # `workload.percona.com/tier` label.
        workload.percona.com/tier: general
        workload.percona.com/managed-by: karpenter
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        # Spot-first; Karpenter naturally picks the cheapest capacity type
        # that satisfies pending pods, so `[spot, on-demand]` means "prefer
        # spot, fall back to on-demand on no-capacity / interruption".
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        # Gen-7 Intel + AMD, general-purpose + compute + memory. Excludes
        # storage/GPU/burstable on purpose — workloads that need those open
        # a dedicated NodePool with stricter requirements.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [c7i, c7a, m7i, m7a, r7i, r7a]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge, 4xlarge]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Stateful workloads (Prometheus, Jenkins masters) carry a
      # `workload=<name>:NoSchedule` taint and live on dedicated managed
      # NGs (eks.tf). This NodePool intentionally does NOT tolerate that
      # taint — Karpenter never schedules a stateful pod, never bin-packs
      # it onto spot, never drains it for consolidation. Consolidation
      # remains safe for everything else.
      taints: []
      startupTaints: []

      # Roll every Karpenter node every 30 days for AMI freshness without
      # forcing a manual cycle. Disruption budgets (default chart values)
      # cap concurrent disruptions, so this won't drain the whole pool.
      expireAfter: 720h

  limits:
    cpu: "200"
    memory: 800Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    # If a workload needs to opt out of consolidation entirely (e.g. a
    # batch job mid-run, a Helm-upgrade probe), set the pod annotation
    #   karpenter.sh/do-not-disrupt: "true"
    # and Karpenter will skip the node hosting it for any voluntary
    # disruption. Spot interruption from AWS still preempts.

  # Single NodePool today, so weight is moot — kept for forward-compat
  # when an arm64 / GPU NodePool gets added.
  weight: 10

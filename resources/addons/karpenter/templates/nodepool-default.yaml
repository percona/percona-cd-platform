apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        # Tier taxonomy: every node carries the canonical
        # `workload.percona.com/tier` label.
        workload.percona.com/tier: general
        workload.percona.com/managed-by: karpenter
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        # Spot-first; Karpenter naturally picks the cheapest capacity type
        # that satisfies pending pods, so `[spot, on-demand]` means "prefer
        # spot, fall back to on-demand on no-capacity / interruption".
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        # Gen-7 Intel + AMD, general-purpose + compute + memory. Excludes
        # storage/GPU/burstable on purpose — workloads that need those open
        # a dedicated NodePool with stricter requirements.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [c7g, m7g, r7g, c8g, m8g, r8g]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge, 4xlarge]
        # Single-AZ topology. EBS is per-AZ; cross-AZ NAT egress costs add
        # up if pods scatter. Stateful tier sits on lgtm-stateful in 1a
        # already; pin stateless tier here too so consolidation can fully
        # reclaim 1b/1c.
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Stateful workloads (Prometheus, Jenkins masters) carry a
      # `workload=<name>:NoSchedule` taint and live on dedicated managed
      # NGs (eks.tf). This NodePool intentionally does NOT tolerate that
      # taint — Karpenter never schedules a stateful pod, never bin-packs
      # it onto spot, never drains it for consolidation. Consolidation
      # remains safe for everything else.
      taints: []
      startupTaints: []

      # Roll every Karpenter node every 30 days for AMI freshness without
      # forcing a manual cycle. The explicit `disruption.budgets` below
      # cap concurrent disruptions so the 720h expire wave can never
      # drain the whole pool.
      expireAfter: 720h

  limits:
    cpu: "200"
    memory: 800Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    # If a workload needs to opt out of consolidation entirely (e.g. a
    # batch job mid-run, a Helm-upgrade probe), set the pod annotation
    #   karpenter.sh/do-not-disrupt: "true"
    # and Karpenter will skip the node hosting it for any voluntary
    # disruption. Spot interruption from AWS still preempts.
    #
    # Cap concurrent voluntary disruptions at one node absolute. Karpenter
    # default is `nodes: 10%` which on a small fleet rounds to a single
    # node anyway; the explicit `1` documents intent and decouples the
    # behaviour from cluster size. Stateless LGTM tier sits on this pool
    # at replicas:1, so co-eviction during the 720h expire wave or a
    # consolidation burst would briefly take the read/write path dark.
    budgets:
      - nodes: "1"

  # Single NodePool today, so weight is moot — kept for forward-compat
  # when an arm64 / GPU NodePool gets added.
  weight: 10

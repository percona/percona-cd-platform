# Grafana Loki — distributed deployment mode, S3-backed.
#
# bucketNames fields are placeholders — actual values come from the addons
# ApplicationSet valuesObject (see argocd-bootstrap/applicationsets/addons.yaml),
# which reads cluster-secret annotations populated by terraform/lgtm-storage.tf.
# Pod Identity (terraform/pod-identity.tf) maps namespace=loki + SA=loki to
# the IAM role with S3 + KMS access scoped to the bucket below.
loki:
  deploymentMode: Distributed

  serviceAccount:
    create: true
    name: loki

  loki:
    auth_enabled: false # single-tenant cluster
    storage:
      type: s3
      bucketNames:
        chunks: REPLACE_VIA_APPSET
        ruler: REPLACE_VIA_APPSET
        admin: REPLACE_VIA_APPSET
      s3:
        region: us-east-1
        endpoint: s3.us-east-1.amazonaws.com
        s3ForcePathStyle: false
        insecure: false
    schemaConfig:
      configs:
        - from: "2026-01-01"
          object_store: s3
          store: tsdb
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Isolate Loki's memberlist from neighbouring Mimir/Tempo rings. Without
    # this, gossip cross-pollinates: Loki ingesters end up in the Mimir
    # `collectors/ring`, Mimir querier dials them at :9095 expecting the
    # `cortex.Ingester` service, gets Unimplemented (Loki only registers
    # `logproto.Pusher`), and every PromQL fails. Set a stack-unique label
    # and flip cluster_label_verification on so handshake-time gossip from
    # foreign stacks is rejected.
    #
    # The chart's memberlist key is `loki.extraMemberlistConfig` (see
    # charts/loki/templates/config.yaml line 179-194). The plain
    # `loki.memberlist` block we used previously was a no-op: Helm rendered
    # the chart's auto-generated `memberlist: { join_members: [...] }` and
    # ignored the override entirely. Result: cluster_label was never
    # emitted, gossip cross-pollinated, distributors timed out on
    # ingester stream-rate RPCs (DeadlineExceeded against zone-b/zone-c
    # ingesters, ~22 hits/10m), and a querier IP appeared in the ingester
    # ring on port 7946.
    extraMemberlistConfig:
      cluster_label: "loki-percona-ci"
      cluster_label_verification_disabled: false
    # Auto-evict ring entries whose heartbeat is past the timeout. Without
    # this, ungraceful pod terminations leave UNHEALTHY entries pinned in
    # the ring forever, the lifecycler's readiness gate refuses to declare
    # the new ingester ready ("found an existing instance(s) with a problem
    # in the ring"), and the ring never quorates. Was hit during the
    # 2026-05-08 Object-Lock recovery on ps3 canary; the only manual remedy
    # is forget POSTs to the ring endpoint, but distroless containers make
    # that fragile. Auto-forget is the upstream-recommended posture for
    # distributed Loki running on a churning K8s scheduler.
    ingester:
      autoforget_unhealthy: true

  # Distributed-mode replicas. Stateful tier (ingester/compactor/indexGateway/
  # ruler) pinned to the `lgtm-stateful` Karpenter pool via nodeSelector +
  # toleration; stateless edges (distributor/querier/QF/QS) stay on the
  # `default` Karpenter pool with hostname topologySpread.
  #
  # The `maxUnavailable: N` key on each tier becomes a chart-rendered PDB
  # (chart key, not the standard `podDisruptionBudget:` block) -- equivalent
  # semantics. WAL PVCs use cluster-default `gp3` (multi-AZ, Delete);
  # ingester chunk flush is ~5min so WAL is short-lived. Chart default
  # ships `zoneAwareReplication.enabled=true` on ingester; combined with
  # the new pool's per-AZ presence (NodePool requires all 3 zones) and
  # the chart's own hard hostname podAntiAffinity (rendered when zone-
  # aware is on), three ingester replicas land one-per-host across the
  # cluster.
  distributor:
    replicas: 3
    priorityClassName: platform-default
    maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: distributor
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }

  ingester:
    replicas: 3
    priorityClassName: platform-stateful-high
    maxUnavailable: 1
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits:   { memory: 4Gi }
    persistence:
      enabled: true
      size: 50Gi
      storageClass: gp3

  querier:
    replicas: 2
    priorityClassName: platform-default
    maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: querier

  queryFrontend:
    replicas: 2
    priorityClassName: platform-default
    maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: query-frontend

  queryScheduler:
    replicas: 2
    priorityClassName: platform-default
    maxUnavailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: query-scheduler

  compactor:
    replicas: 1
    priorityClassName: platform-stateful-high
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    persistence:
      enabled: true
      size: 30Gi
      storageClass: gp3

  indexGateway:
    replicas: 2
    priorityClassName: platform-stateful-high
    maxUnavailable: 1
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }

  ruler:
    enabled: true
    # Bump from 1 to 2 so a node drain doesn't drop alert evaluation.
    replicas: 2
    priorityClassName: platform-default
    maxUnavailable: 1
    nodeSelector:
      workload.percona.com/tier: lgtm-stateful
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: lgtm-stateful
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }

  # rollout_operator coordinates zone-by-zone restarts of zone-aware
  # ingester StatefulSets so the ring keeps quorum during rolling updates.
  # Chart default is `false`; enabled here because zoneAwareReplication
  # is also on (chart default) and without the operator a rolling update
  # restarts all zone STS pods simultaneously, breaking the RF=3 invariant.
  rollout_operator:
    enabled: true

  # Disable monolithic / simple-scalable / single-binary modes — distributed
  # is mutually exclusive with these.
  singleBinary:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # Caches stay enabled (chart-bundled memcached). Chart defaults size
  # the chunks cache at 8192 MB and the results cache at 1024 MB
  # (allocatedMemory), then renders a memory request/limit at 1.2x
  # — that's ~10 GB and ~1.2 GB respectively. With no Karpenter
  # NodePool and the system NG nodes at 84-99% memory, both pods stay
  # Pending forever.
  #
  # Right-size for current scale (no logs flowing yet, low query volume).
  # Easy to bump these later as traffic grows. Scaling expectation:
  # double allocatedMemory for every ~10x increase in stored chunks.
  chunksCache:
    enabled: true
    replicas: 2
    allocatedMemory: 256
    allocatedCPU: 100m
  resultsCache:
    enabled: true
    replicas: 2
    allocatedMemory: 128
    allocatedCPU: 100m

  # No bundled MinIO — S3 only.
  minio:
    enabled: false

  # Loki gateway is a chart-bundled NGINX in front of distributors/queriers.
  # Grafana queries the query-frontend Service directly; no need for the
  # gateway in single-tenant mode.
  gateway:
    enabled: false

  # Operator-managed ServiceMonitor for Prometheus scrape (kept on by L-3).
  monitoring:
    selfMonitoring:
      enabled: false
    serviceMonitor:
      enabled: true

  # Disable the bundled loki-canary DaemonSet. The chart's canary tries to
  # POST to `loki-gateway.loki.svc.cluster.local:3100/loki/api/v1/push`, but
  # we run gateway-less (Alloy DS is the in-cluster gateway, the alloy-gateway
  # ALB is the external gateway). Without the Service, every canary entry
  # gets `dial tcp: lookup loki-gateway.loki.svc.cluster.local: no such host`
  # and the canary spams ~120 NXDOMAIN/min/pod. The chart's canary toggle is
  # `lokiCanary.enabled` at top level, not under `monitoring.lokiCanary`
  # (where it had no effect).
  lokiCanary:
    enabled: false

  # Chart `templates/validate.yaml` line 5-7 fail-fasts when `lokiCanary.enabled`
  # is false but `test.enabled` is still true (chart default). Without this
  # the Loki Application stops rendering manifests entirely with
  # `Helm test requires the Loki Canary to be enabled` and ArgoCD shows
  # ComparisonError on every reconcile. We don't run `helm test` in this
  # cluster — disable the optional test-pod hook altogether.
  test:
    enabled: false

{{/*
One ClusterSecretStore per scopedStores entry. It assumes the consumer's IAM
role (terraform/iam-external-secrets-stores.tf) and tags the session with the
ExternalSecret's namespace (sessionTagsPolicy Simple). docs/adr/0050.
*/}}
{{- range $name, $store := .Values.scopedStores }}
{{- if not $store.namespaces }}
{{- fail (printf "scopedStores.%s.namespaces must list at least one namespace" $name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-{{ $name }}
spec:
  conditions:
    - namespaces:
        {{- toYaml $store.namespaces | nindent 8 }}
  provider:
    aws:
      service: SecretsManager
      region: {{ ($.Values.aws | default dict).region | default "us-east-1" }}
      role: arn:aws:iam::{{ required "aws.accountId is required for a scoped store" ($.Values.aws | default dict).accountId }}:role/{{ required (printf "scopedStores.%s.roleName is required" $name) $store.roleName }}
      sessionTagsPolicy: Simple
{{- end }}

{{/*
A namespaced SecretStore or AWS generator without its own credential runs on
the operator's Pod Identity role. It would reach every key that role may read,
past the namespace conditions of the ClusterSecretStores. This policy refuses
them, so only ClusterSecretStores (cluster-admin only) talk to AWS.
*/}}
{{- if .Values.denyNamespacedAwsStores }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: external-secrets-deny-namespaced-aws
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretstores"]
      - apiGroups: ["generators.external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ecrauthorizationtokens", "stssessiontokens"]
  validations:
    - expression: >-
        request.resource.group == 'external-secrets.io' &&
        (!has(object.spec.provider) || !has(object.spec.provider.aws))
      message: >-
        AWS access goes through a ClusterSecretStore with namespace conditions.
        Namespaced AWS SecretStores and AWS generators are refused (docs/adr/0050).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: external-secrets-deny-namespaced-aws
spec:
  policyName: external-secrets-deny-namespaced-aws
  validationActions: ["Deny"]
{{- end }}

{{/*
ClusterSecretStore for AWS Secrets Manager. Cluster-wide so any namespace
can reference it from an ExternalSecret without re-declaring credentials.
Auth is auto-detected from the SDK chain — Pod Identity (terraform/
pod-identity.tf, attach_external_secrets_policy = true) covers the IAM.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

{{/*
ClusterSecretStore for AWS Secrets Manager. Cluster-wide so any namespace
can reference it from an ExternalSecret without re-declaring credentials.
Auth is auto-detected from the SDK chain — Pod Identity (terraform/
pod-identity.tf, attach_external_secrets_policy = true) covers the IAM.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Pulled from the addons ApplicationSet valuesObject which
      # populates `aws.region` from the cluster-Secret annotation
      # `aws_region`. Falls back to us-east-1 for chart-validate /
      # helm-template runs that don't pass a value.
      region: {{ .Values.aws.region | default "us-east-1" }}

{{/*
ClusterSecretStore for AWS Secrets Manager. Only the namespaces in
clusterSecretStore.allowedNamespaces may reference it from an ExternalSecret.
Auth is auto-detected from the SDK chain: Pod Identity (terraform/
pod-identity.tf, attach_external_secrets_policy = true) covers the IAM.
*/}}
{{- $allowed := .Values.clusterSecretStore.allowedNamespaces }}
{{- if not $allowed }}
{{- fail "clusterSecretStore.allowedNamespaces must list at least one namespace" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces:
        {{- toYaml $allowed | nindent 8 }}
  provider:
    aws:
      service: SecretsManager
      # Pulled from the addons ApplicationSet valuesObject which
      # populates `aws.region` from the cluster-Secret annotation
      # `aws_region`. Falls back to us-east-1 for chart-validate /
      # helm-template runs that don't pass a value.
      region: {{ .Values.aws.region | default "us-east-1" }}

external-secrets:
  serviceAccount:
    create: true
    name: external-secrets
  installCRDs: true

  # Robustness: HA all three components with PDBs and system-critical priority.
  replicaCount: 2
  priorityClassName: platform-system-critical
  nodeSelector:
    workload.percona.com/tier: bootstrap
  # Bootstrap-tier toleration paired with the Stage 2b
  # `CriticalAddonsOnly:NoSchedule` taint. Inert until the taint lands.
  tolerations: &bootstrap_tolerations
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  webhook:
    replicaCount: 2
    priorityClassName: platform-system-critical
    nodeSelector:
      workload.percona.com/tier: bootstrap
    tolerations: *bootstrap_tolerations
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  certController:
    replicaCount: 2
    priorityClassName: platform-system-critical
    nodeSelector:
      workload.percona.com/tier: bootstrap
    tolerations: *bootstrap_tolerations
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

# Namespaces whose ExternalSecrets may use the ClusterSecretStore
# aws-secrets-manager. A new consumer namespace must be added here in the same
# change as its first ExternalSecret, or that ExternalSecret fails with a store
# error. An empty list fails the render, so the store is never open to all.
clusterSecretStore:
  allowedNamespaces:
    - alloy-gateway
    - argocd
    - authentik
    - grafana
    - headlamp
    - jenkins-mcp
    - jenkins-ps3-k8s
    - mtr

# Deny namespaced AWS SecretStores and the namespaced AWS generators. Without a
# credential of their own they run on the operator's Pod Identity role, which
# would bypass the namespace list above. docs/adr/0050.
denyNamespacedAwsStores: true

# Per-consumer ClusterSecretStores (docs/adr/0050). Each one assumes the IAM
# role that terraform/iam-external-secrets-stores.tf creates for the consumer
# and serves only the listed namespaces. Empty: no scoped store is rendered.
# Entry shape (roleName is the eso_store_role_names output of terraform):
#   jenkins-mcp:
#     roleName: percona-ci-platform-eso-jenkins-mcp
#     namespaces: [jenkins-mcp]
scopedStores: {}

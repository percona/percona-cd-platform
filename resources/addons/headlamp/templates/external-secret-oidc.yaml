{{/*
ExternalSecret building the OIDC env Secret that the Headlamp subchart
`envFrom`s (config.oidc.externalSecret.name: headlamp-oidc).

Only OIDC_CLIENT_SECRET is sensitive; it is pulled from the shared
Authentik runtime-config bundle in Secrets Manager
(percona-ci-platform/authentik/config, property
AUTHENTIK_OIDC_HEADLAMP_CLIENT_SECRET — provisioned alongside the
Grafana/ArgoCD client secrets in terraform/authentik.tf). The non-secret
values (client id, issuer, scopes, callback) are templated in as literals.

Mirrors resources/addons/grafana/templates/external-secret-oidc.yaml. The
ClusterSecretStore (aws-secrets-manager) and the eso_secrets_manager_read
policy on percona-ci-platform/* already cover this read; no IAM edit.

issuerURL is Authentik's per-provider issuer (issuer_mode: per_provider),
so it ends in the application slug `headlamp`. The kube-apiserver must
trust this same issuer via the EKS external OIDC association for the
forwarded id_token to authenticate.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      data:
        OIDC_CLIENT_ID: "headlamp"
        OIDC_ISSUER_URL: "https://auth.cd.percona.com/application/o/headlamp/"
        OIDC_SCOPES: "openid profile email groups offline_access"
        OIDC_CALLBACK_URL: "https://headlamp.cd.percona.com/oidc-callback"
        OIDC_CLIENT_SECRET: "{{ `{{ .client_secret }}` }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_OIDC_HEADLAMP_CLIENT_SECRET

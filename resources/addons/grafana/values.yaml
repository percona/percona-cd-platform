# Standalone Grafana — replaces the bundled chart that L-3 disabled.
#
# Three things this chart does that the bundled one couldn't:
#   1. SAML/Duo (HD-30780) with full grafana.ini control + group → role
#      mapping (grafana_cd_admins → Admin, grafana_cd_users → Viewer).
#   2. Datasources for the full LGTM stack: Mimir (metrics), Loki (logs),
#      Tempo (traces), and the in-cluster Prometheus agent for transitional
#      scrape visibility.
#   3. HA topology (replicas=2) with sticky-session ALB target groups so
#      session affinity holds during the SAML round-trip.
#
# Top-level keys consumed by the addons ApplicationSet valuesObject:
#   ingress.hosts          — set from cluster-secret annotation grafana_hostname
#   saml.enabled           — set from var.grafana_saml_enabled
#   saml.idpMetadataB64    — set from var.grafana_saml_idp_metadata (b64)

# Local-scope keys (consumed by templates/external-secret-saml.yaml).
saml:
  enabled: "false"
  idpMetadataB64: ""

ingress:
  hosts: []

grafana:
  replicas: 2

  # Pin both chart + image to the same Grafana version. Chart 10.5.15
  # ships appVersion=12.3.1; without an explicit pin Helm renders
  # `image.tag = appVersion` which is fine — but ArgoCD's diffing keeps
  # re-rendering when the chart's appVersion floats on a re-pull. Pinning
  # makes the deployed image deterministic and gives one place to bump.
  # The "no such column: uid" CrashLoop on first bring-up was a chart-vs-
  # image schema collision triggered by emptyDir-backed sqlite churn; this
  # pin + the persistent PVC below stop the regression.
  image:
    repository: grafana/grafana
    tag: "12.3.1"

  # Robustness: not cluster-critical (data lives in datasources, not Grafana
  # itself), but PDB so node drain doesn't kill both replicas at once.
  priorityClassName: platform-default
  podDisruptionBudget:
    minAvailable: 1

  # Pin to the prometheus-system NG so addon churn doesn't evict Grafana.
  nodeSelector:
    workload: prometheus
  tolerations:
    - key: workload
      operator: Equal
      value: prometheus
      effect: NoSchedule

  # Persistent dashboards / annotations / users.
  persistence:
    enabled: true
    storageClassName: gp3-monitoring-1a-retain
    size: 10Gi

  # Admin password for the local-admin path. Real production deployments
  # rotate this via a Secret reference; for now the chart auto-generates.
  admin:
    existingSecret: ""

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/group.name: jenkins-cd
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      # Target pods directly via VPC CNI pod IPs (skips kube-proxy NAT
      # hop). Required because the Grafana Service is ClusterIP — the LBC
      # default of `instance` target-type only works with NodePort services.
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      # Sticky sessions for SAML round-trip (otherwise the SP-initiated
      # flow can land on a different replica than the one that issued
      # the AuthnRequest).
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
      # Health check on Grafana's /api/health endpoint (returns 200).
      # Without this, ALB hits / and gets 302 → /login → marks targets
      # ResponseCodeMismatch unhealthy.
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-port: "3000"
      alb.ingress.kubernetes.io/success-codes: "200"
      # hosts come from the addons ApplicationSet valuesObject.

  # SAML-conditional grafana.ini. Renders the [auth.saml] block only when
  # samlEnabled is "true" (string compare — annotations are strings).
  # Cert/key paths are mount points filled by templates/external-secret-saml.yaml.
  grafana.ini:
    server:
      domain: grafana.cd.percona.com
      root_url: https://grafana.cd.percona.com
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: lax
    auth:
      disable_login_form: false
      oauth_auto_login: false
    users:
      auto_assign_org: true
      auto_assign_org_role: Viewer

  # SAML wiring — uses Grafana env vars (GF_AUTH_SAML_*) which override
  # grafana.ini. Always rendered; the gate is GF_AUTH_SAML_ENABLED, which
  # echoes the saml.enabled value (string-typed because cluster-secret
  # annotations are strings). When disabled, GF_AUTH_SAML_ENABLED=false and
  # Grafana ignores the rest. The cert/key Secret + IdP ConfigMap are only
  # rendered when saml.enabled=true (see templates/external-secret-saml.yaml),
  # so the mount paths exist iff the gate is on.
  extraSecretMounts:
    - name: saml-keypair
      secretName: grafana-saml
      mountPath: /etc/grafana/saml
      readOnly: true
      defaultMode: 0440
  extraConfigmapMounts:
    - name: saml-idp
      configMap: grafana-saml-idp
      mountPath: /etc/grafana/saml-idp
      readOnly: true
      defaultMode: 0444
  env:
    GF_AUTH_SAML_ENABLED: "true"
    GF_AUTH_SAML_SINGLE_LOGOUT: "false"
    GF_AUTH_SAML_ALLOW_IDP_INITIATED: "false"
    GF_AUTH_SAML_ALLOW_SIGN_UP: "true"
    GF_AUTH_SAML_PRIVATE_KEY_PATH: /etc/grafana/saml/private_key
    GF_AUTH_SAML_CERTIFICATE_PATH: /etc/grafana/saml/certificate
    GF_AUTH_SAML_IDP_METADATA_PATH: /etc/grafana/saml-idp/idp-metadata.xml
    GF_AUTH_SAML_ASSERTION_ATTRIBUTE_GROUPS: groups
    GF_AUTH_SAML_ASSERTION_ATTRIBUTE_LOGIN: mail
    GF_AUTH_SAML_ASSERTION_ATTRIBUTE_EMAIL: mail
    GF_AUTH_SAML_ASSERTION_ATTRIBUTE_NAME: displayName
    GF_AUTH_SAML_ROLE_VALUES_ADMIN: grafana_cd_admins
    GF_AUTH_SAML_ROLE_VALUES_VIEWER: grafana_cd_users

  # LGTM datasources auto-provisioned. URLs are in-cluster Service DNS.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://mimir-query-frontend.mimir.svc.cluster.local:8080/prometheus
          isDefault: true
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            timeInterval: 60s
          secureJsonData:
            httpHeaderValue1: percona-ci
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-query-frontend.loki.svc.cluster.local:3100
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo-query-frontend.tempo.svc.cluster.local:3100
          jsonData:
            tracesToLogs:
              datasourceUid: loki
            tracesToMetrics:
              datasourceUid: mimir
        # Transitional — drop after Prometheus agent's local store is no
        # longer queried directly.
        - name: Prometheus (in-cluster scrape)
          type: prometheus
          access: proxy
          url: http://prometheus-operated.monitoring.svc.cluster.local:9090

  # Default dashboard providers (sidecar discovers ConfigMaps with the
  # grafana_dashboard label and auto-imports).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: false # we provision via datasources.yaml above

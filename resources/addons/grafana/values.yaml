# Standalone Grafana — replaces the bundled chart that L-3 disabled.
#
# Three things this chart does that the bundled one couldn't:
#   1. OIDC SSO via Authentik (which talks SAML to Duo on our behalf).
#      Group → role mapping: grafana_cd_admins → GrafanaAdmin (server-
#      admin + org-Admin), percona (all Perconians) → Viewer.
#   2. Datasources for the full LGTM stack: Mimir (metrics), Loki (logs),
#      Tempo (traces), and the in-cluster Prometheus agent for transitional
#      scrape visibility.
#   3. Single replica with a Recreate rollout. Grafana persists to one
#      ReadWriteOnce EBS PVC, so two replicas can only ever co-locate on one
#      node and a node roll deadlocks on Multi-Attach (the surge pod on the new
#      node cannot attach the volume still held by the draining pod). replicas=1
#      + Recreate makes the old pod release the volume before the new one binds.
#      Sticky-session ALB target groups still hold session affinity for the
#      OIDC round-trip. HA needs a shared RWX (EFS) volume or a stateless
#      (DB-backed) Grafana first; tracked separately.
#
# History: original wiring was direct SAML to Duo (HD-30780). Grafana OSS
# does not ship SAML — it's an Enterprise-only feature. The OSS image
# returned 404 for /saml/metadata and showed only the local login form.
# The SAML SP role moved to Authentik (resources/addons/authentik/);
# Grafana now consumes plain OIDC.
#
# Top-level keys consumed by the addons ApplicationSet valuesObject:
#   ingress.hosts — set from cluster-secret annotation grafana_hostname
#
# OIDC config is fully expressed in the env block below (issuer URL,
# client_id, scopes, role mapping). client_secret is mounted via
# envValueFrom from the ESO-synced grafana-oidc Secret.

ingress:
  hosts: []

grafana:
  # Single replica: the persistence PVC below is ReadWriteOnce, so HA replicas
  # deadlock on Multi-Attach during a node roll. See header note 3.
  replicas: 1

  # Recreate (not the chart-default RollingUpdate): with one RWO PVC the
  # rolling surge pod would try to attach a volume the old pod still holds and
  # hang on Multi-Attach. Recreate terminates the old pod (releasing the
  # volume) before starting the new one. Brief Grafana gap on each rollout,
  # which is acceptable (data lives in datasources, not Grafana).
  deploymentStrategy:
    type: Recreate

  # Image pinned to 12.3.6, the Grafana security release for CVE-2026-27876
  # (RCE) and CVE-2026-27880 (unauth DoS). Chart 10.5.15 (latest) still
  # ships appVersion=12.3.1, so the image tag is pinned ahead of the chart
  # appVersion; this also gives one deterministic place to bump Grafana.
  # The "no such column: uid" CrashLoop on first bring-up was a chart-vs-
  # image schema collision triggered by emptyDir-backed sqlite churn; this
  # pin + the persistent PVC below stop the regression.
  image:
    repository: grafana/grafana
    tag: "12.3.6"

  # Not cluster-critical (data lives in datasources, not Grafana itself).
  # With a single replica, maxUnavailable=1 lets a node drain evict the one
  # pod gracefully; minAvailable=1 would block every voluntary eviction and
  # force every node roll to fall back to force_update_version.
  priorityClassName: platform-default
  podDisruptionBudget:
    maxUnavailable: 1

  # Pin to the prometheus_system MNG via the canonical tier key.
  nodeSelector:
    workload.percona.com/tier: obs-state
  tolerations:
    - key: workload.percona.com/tier
      operator: Equal
      value: obs-state
      effect: NoSchedule

  # Persistent dashboards / annotations / users.
  persistence:
    enabled: true
    storageClassName: gp3-monitoring-1a-retain
    size: 10Gi

  # Local-admin credential pinned via ESO from Secrets Manager
  # (percona-ci-platform/grafana/admin -> Secret grafana-admin, see
  # templates/external-secret-admin.yaml). Before this pin the chart
  # auto-generated a fresh password on every render, so the Secret
  # drifted from the password persisted in grafana.db at first boot:
  # the sidecar's provisioning-reload POST 401ed for weeks and the admin
  # API was unreachable. The live DB password was reset to the pinned
  # value via the documented grafana-cli break-glass on 2026-06-12.
  admin:
    existingSecret: "grafana-admin"
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/group.name: jenkins-cd
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      # Target pods directly via VPC CNI pod IPs (skips kube-proxy NAT
      # hop). Required because the Grafana Service is ClusterIP — the LBC
      # default of `instance` target-type only works with NodePort services.
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      # Sticky sessions for the OIDC round-trip (otherwise the SP-initiated
      # flow can land on a different replica than the one that issued
      # the AuthnRequest and the state-cookie check fails).
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
      # Health check on Grafana's /api/health endpoint (returns 200).
      # Without this, ALB hits / and gets 302 → /login → marks targets
      # ResponseCodeMismatch unhealthy.
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-port: "3000"
      alb.ingress.kubernetes.io/success-codes: "200"
      # hosts come from the addons ApplicationSet valuesObject.

  # Server domain settings — only effective when ApplicationSet sets the
  # actual hostname via `grafana.ini` override. Local default kept for
  # helm-template sanity; real value flows from cluster-Secret annotation.
  grafana.ini:
    server:
      domain: grafana.cd.percona.com
      root_url: https://grafana.cd.percona.com
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: lax
    auth:
      # Local username/password form removed from /login. Every browser
      # sign-in goes through Duo MFA + Authentik. The local `admin` user
      # still exists in Grafana's DB; emergency recovery is `kubectl exec
      # deploy/grafana -n grafana -c grafana -- grafana-cli admin
      # reset-admin-password <new>`, then `kubectl port-forward` to
      # localhost and log in there.
      disable_login_form: true
      # Don't auto-redirect to OIDC: leaves the SSO button visible so
      # the operator can see they're signing in via SSO (vs an opaque
      # immediate redirect that's hard to diagnose if Authentik 5xxs).
      oauth_auto_login: false
    # Basic auth re-enabled deliberately (was disabled while the admin
    # password was chart-random and drifted): the credential is now
    # ESO-pinned and strong, and Grafana 12 with disable_login_form also
    # disables password session login, so basic auth is the ONLY
    # API path for the local admin. It serves the sidecar's
    # provisioning-reload hook, the folders API, and the future
    # folder-permissions automation (ADR 0035). Brute force on the
    # internet-facing ALB is mitigated by Grafana's login lockout and
    # the 32-char random credential; browser sign-in remains
    # Duo + Authentik only.
    auth.basic:
      enabled: true
    users:
      auto_assign_org: true
      auto_assign_org_role: Viewer

  # OIDC env vars (GF_AUTH_GENERIC_OAUTH_*) override grafana.ini at runtime.
  # Authentik issuer URL + client_id come from cluster-Secret annotations
  # via .Values.oidc; client_secret is mounted via envValueFrom from the
  # ESO-synced `grafana-oidc` Secret (see templates/external-secret-oidc.yaml).
  env:
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_NAME: "Percona SSO"
    GF_AUTH_GENERIC_OAUTH_ICON: "signin"
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
    GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups offline_access"
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.cd.percona.com/application/o/authorize/"
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.cd.percona.com/application/o/token/"
    GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.cd.percona.com/application/o/userinfo/"
    GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://auth.cd.percona.com/application/o/grafana/end-session/"
    # Group → role mapping. JMESPath: ordered fall-through.
    #   - grafana_cd_admins  → GrafanaAdmin (full curate rights)
    #   - percona            → Viewer (every Perconian, read-only)
    #
    # Bootstrap-phase trade-off: re-opening `percona` (re-introduced
    # 2026-05-07 after a brief tightening to admins-only) gives every
    # Duo-authenticated Percona employee read access without waiting on
    # IT-Ops to provision a dedicated `grafana_cd_users` Duo group. This
    # accepts security-review chain C (Viewer → Loki query → all-namespace
    # auth/build telemetry) as known exposure during bootstrap. To close
    # later: ask Santiago for `grafana_cd_users`, swap `percona` for it,
    # and tighten the Loki datasource to Editor+ via Grafana 11 RBAC.
    #
    # To add Editor capability: define `grafana_cd_editors`, add a
    # `contains(groups[*], 'grafana_cd_editors') && 'Editor'` leg above
    # the Viewer leg.
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana_cd_admins') && 'GrafanaAdmin' || contains(groups[*], 'percona') && 'Viewer' || 'Viewer'"
    GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: "grafana_cd_admins percona"
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "groups"
    GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"

  # client_secret comes from the ESO-synced `grafana-oidc` Secret
  # (templates/external-secret-oidc.yaml).
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client_secret
    # Read-only password for the MTR Postgres datasource (PS-10541). Synced by
    # templates/external-secret-mtr-reader.yaml; interpolated as
    # `$MTR_PG_READER_PASSWORD` in the datasource secureJsonData below.
    MTR_PG_READER_PASSWORD:
      secretKeyRef:
        name: mtr-pg-reader
        key: password

  # Datasources auto-provisioned. URLs are in-cluster Service DNS.
  #
  # UIDs are pinned explicitly so dashboard JSON references resolve
  # deterministically across Grafana reinstalls (a fresh PVC otherwise
  # generates new auto-derived UIDs and every hardcoded `"uid":"..."` in
  # committed dashboards breaks).
  #
  # Mimir is the sole metrics store (LGTM-only, ADR 0016). There's no
  # `Prometheus` datasource entry — kube-prometheus-stack is gone and
  # nothing in the repo references `uid: prometheus` (the dashboard
  # JSONs were migrated in the same PR).
  # Provision the three LGTM datasources (Mimir / Loki / Tempo). Grafana
  # 12.3.x's datasource provisioner has a regression: any cross-datasource
  # reference (e.g. `tempo.jsonData.tracesToLogsV2.datasourceUid: loki`)
  # that resolves to a sibling-provisioned UID is validated synchronously
  # before commit, but the SQLite DB is empty during that pass, so the
  # provisioner fails the whole pod with
  #   level=error msg="Failed to provision data sources"
  #     error="Datasource provisioning error: data source not found"
  # and the chained module-startup blocks DashboardUpdater + HTTPServer too.
  # PR-#48 tried splitting into numbered files; Grafana 12.3 still validates
  # all files in one pass before commit, so the split was a no-op.
  #
  # Workaround: ship the datasources WITHOUT inter-datasource correlation
  # hints (`tracesToLogsV2`, `tracesToMetrics`, `serviceMap`). Trace-to-log
  # and trace-to-metric jumps still work via the per-panel "Linked" UI in
  # Explore once a user picks the target datasource by hand. Re-enable the
  # provisioning hints when Grafana fixes the regression upstream.
  datasources:
    datasources.yaml:
      apiVersion: 1
      # Persistent PVC inherited from the kps era carries 4 datasource rows
      # (`Mimir`, `Loki`, `Tempo`, `Prometheus (in-cluster scrape)`) with
      # auto-generated `P*` UIDs. The YAML below provisions Mimir/Loki/Tempo
      # with static UIDs `mimir`/`loki`/`tempo`. Grafana 12.3.x's reconciler
      # sees a name match but a UID mismatch on the existing rows, fails to
      # upsert, and crashloops every fresh pod with the generic
      # `data source not found` provisioning error.
      #
      # Wipe the orphaned rows up-front so the YAML provisions cleanly.
      # `deleteDatasources` runs before `datasources`; matching is by name
      # + orgId, so listing the same names below has the effect of "delete
      # the legacy row, then create the new one with the static UID".
      # Safe to leave in place — once the rows are gone the deletes are
      # no-ops on every subsequent restart.
      deleteDatasources:
        - { name: Mimir, orgId: 1 }
        - { name: Loki, orgId: 1 }
        - { name: Tempo, orgId: 1 }
        - { name: "Prometheus (in-cluster scrape)", orgId: 1 }
        - { name: Prometheus, orgId: 1 }
        - { name: "MTR Postgres", orgId: 1 }
      datasources:
        - name: Mimir
          uid: mimir
          type: prometheus
          access: proxy
          url: http://mimir-query-frontend.mimir.svc.cluster.local:8080/prometheus
          isDefault: true
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            timeInterval: 60s
            prometheusType: Mimir
            manageAlerts: false
          secureJsonData:
            httpHeaderValue1: percona-ci
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-query-frontend.loki.svc.cluster.local:3100
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo-query-frontend.tempo.svc.cluster.local:3100
        # MTR test-history relational store (PS-10541). Core OSS postgres
        # datasource (no plugin/license). Reads via the CNPG `-r` service as
        # the managed read-only role; password interpolated from the env var
        # synced by templates/external-secret-mtr-reader.yaml.
        - name: "MTR Postgres"
          uid: mtr-postgres
          type: postgres
          access: proxy
          url: mtr-pg-r.mtr.svc.cluster.local:5432
          user: mtr_reader
          jsonData:
            database: mtr
            sslmode: require
            postgresVersion: 1700
          secureJsonData:
            password: $MTR_PG_READER_PASSWORD

  # Default dashboard providers (sidecar discovers ConfigMaps with the
  # grafana_dashboard label and auto-imports). The kubernetes-mixin
  # dashboards under `dashboards/kubernetes-mixin/` ship via this path,
  # provisioned by templates/configmap-kubernetes-mixin-dashboards.yaml
  # (kube-prometheus-stack used to bundle a similar set; replaced per
  # ADR 0016).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # Honour the per-ConfigMap `grafana_folder` annotation so each
      # sidecar-provisioned dashboard lands in the right folder. Without
      # this, the chart's kiwigrid sidecar drops everything into the
      # default sidecarProvider directory and Grafana renders them all
      # under (General) regardless of annotation, which surfaced when
      # the Hetzner Cloud Plugin dashboard refused to move from
      # (General) to "Jenkins" after the folder reorg.
      folderAnnotation: grafana_folder
      provider:
        # Auto-create folders that match the directory structure under
        # /tmp/dashboards. Combined with folderAnnotation, this gives
        # ConfigMaps a stable path: annotation "Jenkins" -> sidecar
        # writes /tmp/dashboards/Jenkins/<file>.json -> Grafana imports
        # into the Jenkins folder.
        #
        # Was briefly disabled (PR #64, 2026-05-09) after a folder
        # explosion incident that produced 12k+ empty "Mimir" folders.
        # The amplifier turned out to be a UID collision: an
        # init-container-downloaded gnetId 17607 dashboard
        # (`/var/lib/grafana/dashboards/platform-lgtm/mimir-overview.json`)
        # had the same UID as the upstream-ConfigMap-provisioned
        # mimir-overview from the mimir-mixin install (#59). The
        # collision blocked dashboard writes ("dashboards provisioning
        # provider has no database write permissions because of
        # duplicates") which caused Grafana's file provisioner to
        # synthesise a fresh folder UID on every reconcile rather than
        # reusing the existing folder. Once the stale file was deleted
        # from the PVC the underlying race is gone, so we can keep the
        # nicer file-structure folder layout. Lesson: when adding a
        # ConfigMap-provisioned dashboard whose UID matches a previously
        # init-container-fetched gnetId entry, also remove the gnetId
        # entry from `dashboards.<provider>` AND prune the stale JSON
        # from the persistent PVC.
        foldersFromFilesStructure: true
    # Datasources sidecar OFF: we provision via the datasources.yaml block
    # above. Leaving the datasources sidecar enabled would race with our
    # static config and could overwrite Mimir/Loki/Tempo with whatever
    # ConfigMaps it finds.
    datasources:
      enabled: false

# Dashboard provisioning is sidecar-only: every dashboard ships as a
# ConfigMap (templates/configmap-*-dashboard*.yaml) carrying the
# grafana_dashboard label and a single-segment grafana_folder
# annotation. Folder taxonomy ("spaces"): docs/adr/0035. The legacy
# file-based dashboardProviders (platform-lgtm, platform-karpenter,
# jenkins) and the gnetId download init container are fully retired;
# their empty "Platform / *" folders were deleted via the UI after the
# 2026-06 migrations (precedent: the combined `LGTM + Karpenter`
# folder, API-deleted 2026-05-09).
# gnetId selection notes:
#   mimir-overview    17607 r13 (Grafana Labs official, auto-published
#     from grafana/mimir's `operations/mimir-mixin-compiled/dashboards/`.
#     Queries `cortex_distributor_received_samples_total`,
#     `cortex_request_duration_seconds_*`. Note: depends on mimir-mixin
#     recording rules; without those rules loaded into Mimir the panels
#     will be sparse. Tracking rule import as a follow-up).
# Tempo and the Loki Grafana-Labs mixin do NOT publish to grafana.com.
# Loading those operational dashboards needs a ConfigMap path (drop the
# JSON under resources/addons/grafana/dashboards/ with grafana_dashboard=1
# label). Tracked separately.
# mimir-overview was a gnetId 17607 r13 import here. It now ships via
# the ConfigMap-provisioned upstream `Mimir / Overview` from the
# mimir-mixin bundle (resources/addons/grafana/templates/configmap-
# mimir-mixin-dashboards.yaml). Both share UID
# ffcd83628d7d4b5a03d1cafd159e6c9c so we keep only the ConfigMap one,
# because it ships the full sibling-dashboard set and its inline
# cross-links resolve.
# loki-operational was a gnetId 17781 r1 import here (third-party
# "Loki Metrics Dashboard" by frankfegert; the Grafana Labs Loki mixin
# is NOT published on grafana.com). It now ships repo-owned as
# `Loki / Golden Signals` via templates/configmap-loki-golden-signals-
# dashboard.yaml (folder "Loki"), keeping the imported dashboard's UID
# 1b8931fc-ad08-492b-9651-ac98cd9decad so existing links survive. Per
# the UID-collision lesson above, the gnetId entry was removed and the
# stale /var/lib/grafana/dashboards/platform-lgtm/loki-operational.json
# must be pruned from the PVC post-merge; the platform-lgtm provider
# (disableDeletion: false) then garbage-collects the old DB row. Every
# panel query is validated against live Mimir by
# scripts/check-dashboard-queries.py.
# karpenter-overview was a gnetId 22171 r5 import here (adinhodovic
# kubernetes-autoscaling-mixin, chosen over the stale 16237 which
# predates Karpenter v1). It now ships repo-owned as
# `Karpenter / Overview` via templates/configmap-karpenter-dashboard.yaml
# (folder "Karpenter"), keeping UID
# kubernetes-autoscaling-mixin-kover-jkwq so existing links survive, with
# the mixin's broken exprs fixed and Karpenter activity/cost/health
# panels added. Same post-merge step as the others: prune the stale
# /var/lib/grafana/dashboards/platform-karpenter/karpenter-overview.json
# from the PVC so the platform-karpenter provider garbage-collects the
# old row. That was the LAST gnetId entry, so the `dashboards:` block is
# gone and the chart no longer renders the download-dashboards init
# container at all (it is gated on `.Values.dashboards`).

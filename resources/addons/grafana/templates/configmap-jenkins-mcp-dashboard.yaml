{{/*
Jenkins MCP gateway dashboard.

Wraps dashboards/jenkins-mcp.json in a ConfigMap labelled
`grafana_dashboard: "1"` so the Grafana sidecar discovers and auto-imports it
(sidecar.dashboards block in values.yaml, searchNamespace=ALL). The
`grafana_folder` annotation puts it in the "Jenkins" space alongside the other
Jenkins-fleet dashboards (ADR 0035 folder taxonomy).

Mimir panels bind the `mimir` datasource UID, Loki panels the `loki` UID; both
resolve from the datasources block in the grafana values once the chart renders.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jenkins-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: dashboard
  annotations:
    grafana_folder: "Jenkins"
data:
  jenkins-mcp.json: |-
{{ .Files.Get "dashboards/jenkins-mcp.json" | indent 4 }}

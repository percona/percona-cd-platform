{{/*
Jenkins log streams dashboard.

Wraps dashboards/jenkins-logs.json in a ConfigMap labelled
`grafana_dashboard: "1"` so the Grafana sidecar discovers and
auto-imports it (sidecar.dashboards block in values.yaml,
searchNamespace=ALL). The `grafana_folder` annotation puts it in
the Jenkins folder alongside the Hetzner plugin metrics dashboard.

Mostly LogQL: volume and error-rate panels are surfaced as a
metric query (rate over a LogQL stream), so they render in a
timeseries panel; targets still hit Loki. This is the standard
Grafana pattern for `rate({...} [1m])` from Loki. The one
exception is the build-activity panel, which queries the
hetzner_jenkins_real_busy_executors gauge from Mimir because
build start/finish markers live only in per-build console logs
that are never shipped to Loki.

Master template variable defaults to All. The variable resolves
via `label_values({master=~".+"}, master)`, so every master
shipping logs through alloy-gateway (fleet-wide since 2026-05-10)
appears automatically.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jenkins-logs
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: dashboard
  annotations:
    grafana_folder: "Jenkins"
data:
  jenkins-logs.json: |-
{{ .Files.Get "dashboards/jenkins-logs.json" | indent 4 }}

{{/*
Mimir mixin sibling dashboards (Writes, Reads, Ruler, Compactor, Object
Store, Tenants, Slow Queries, etc.). Sourced from upstream
github.com/grafana/mimir at tag mimir-2.16.0:
  operations/mimir-mixin-compiled/dashboards/*.json
matched (or close-matched) to our chart pin mimir-distributed 6.0.6.

Each JSON in dashboards/mimir-mixin/ becomes its own ConfigMap so we stay
under the 1MiB single-ConfigMap ceiling (the bundle totals ~1.55MiB; the
biggest single dashboard, mimir-reads.json, is 261KiB). The
`grafana_dashboard: "1"` label is what the chart's sidecar.dashboards
block (values.yaml) discovers via searchNamespace=ALL; the
`grafana_folder: "Platform / LGTM"` annotation files them next to the
existing Mimir/Loki dashboards.

These dashboards are the destination of the inline cross-dashboard links
in `Mimir / Overview` (panels with markdown like
`[Writes](/d/8280707b8f16e7b87b840fc1cc92d4c5/...)`); without this
ConfigMap set the links 404. They also depend on the recording rules
shipped by templates/prometheusrule-mimir-mixin.yaml (Alloy DS syncs the
PrometheusRule to Mimir's ruler) -- many headline panels (`Write
latency`, `Ingestion / sec`) reference precomputed series like
`cluster_job_route:cortex_request_duration_seconds:99quantile` that only
exist if those rules evaluate.
*/}}
{{- range $path, $_ := .Files.Glob "dashboards/mimir-mixin/*.json" }}
{{- $base := trimSuffix ".json" (base $path) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $base }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: dashboard
    mixin: mimir
  annotations:
    # Single-segment folder name. Slashes here combine pathologically with
    # the chart's `sidecar.dashboards.provider.foldersFromFilesStructure:
    # true`: each `/` is interpreted as a nested directory and Grafana's
    # file-based provisioner allocates a fresh folder UID on every k8s-
    # sidecar reconcile (~60s), creating ~21 stale empty "Mimir" folders
    # per cycle. Use a flat label instead. See PR #62 follow-up cleanup.
    grafana_folder: "Mimir Mixin"
data:
  {{ $base }}.json: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}

{{/*
Jenkins master host OS metrics dashboard (PS-11375 Phase 2).

Wraps dashboards/jenkins-master-host.json in a ConfigMap labelled
`grafana_dashboard: "1"` so the Grafana sidecar discovers and
auto-imports it (searchNamespace=ALL). The `grafana_folder`
annotation files it in the "Jenkins" space.

Host USE metrics (CPU, memory, disk, network, PSI pressure, file
descriptors) for the EC2 Jenkins masters, sourced from Alloy's
prometheus.exporter.unix -> Mimir. See ADR 0044. ps3 (in-cluster
pod) is covered by the EKS node-exporter, not here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jenkins-master-host
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: dashboard
  annotations:
    grafana_folder: "Jenkins"
data:
  jenkins-master-host.json: |-
{{ .Files.Get "dashboards/jenkins-master-host.json" | indent 4 }}

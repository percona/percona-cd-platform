{{/*
Hetzner Cloud Jenkins plugin dashboard (PS-10997 Phase 3).

Wraps dashboards/hetzner-plugin.json in a ConfigMap labelled
`grafana_dashboard: "1"` so the Grafana sidecar discovers and
auto-imports it (sidecar.dashboards block in values.yaml,
searchNamespace=ALL). The `grafana_folder` annotation puts it in
the "Jenkins" space alongside the other Jenkins-fleet dashboards
(see ADR 0041 for the folder taxonomy).

This was the first repo-owned dashboard shipped via the sidecar
ConfigMap pattern; every dashboard in this addon now ships the
same way (the gnetId/file-provider path is retired).

Datasource UIDs `prometheus` and `loki` are bound to the
datasources block in values.yaml (around line 200) and resolve
once the chart renders.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hetzner-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: lgtm
    app.kubernetes.io/component: dashboard
  annotations:
    grafana_folder: "Jenkins"
data:
  hetzner-plugin.json: |-
{{ .Files.Get "dashboards/hetzner-plugin.json" | indent 4 }}

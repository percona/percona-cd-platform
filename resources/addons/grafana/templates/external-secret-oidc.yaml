{{/*
ExternalSecret syncing the OIDC client_secret for Grafana from the
shared Authentik runtime-config Secrets Manager entry. Authentik's PR-A1
TF (terraform/authentik.tf) provisioned the JSON bundle at
percona-ci-platform/authentik/config; ESO splits the
AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET key into a single-key Secret named
`grafana-oidc` (key: client_secret) that Grafana mounts via envValueFrom
in values.yaml.

Always rendered (no gate). When the ESO ClusterSecretStore is healthy,
this materialises a Secret regardless of the OIDC enable flag — the
flag only affects whether Grafana actually reads it.

ClusterSecretStore lives in resources/addons/external-secrets/templates/
cluster-secret-store.yaml and uses Pod Identity for AWS auth. The
existing aws_iam_policy.eso_secrets_manager_read grants
secretsmanager:GetSecretValue on percona-ci-platform/* — covers this
read with no IAM edit.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: percona-ci-platform/authentik/config
        property: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET

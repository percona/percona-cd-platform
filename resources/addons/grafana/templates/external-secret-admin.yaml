{{/*
ExternalSecret syncing the Grafana local-admin credential from Secrets
Manager (percona-ci-platform/grafana/admin, JSON keys admin-user /
admin-password) into Secret `grafana-admin`, consumed by the chart via
admin.existingSecret in values.yaml.

Why pinned: the chart's default auto-generates a random adminPassword on
every render, while Grafana persists the FIRST boot's password in
grafana.db. The two drifted, which broke the dashboard sidecar's
provisioning-reload POST (401) and all admin API access. The live DB
password was reset to the pinned value via the documented grafana-cli
break-glass (2026-06-12); with this ExternalSecret the Secret, the env,
and the DB stay in agreement.

Same ClusterSecretStore + Pod Identity read path as external-secret-oidc;
the existing eso_secrets_manager_read policy covers
percona-ci-platform/* with no IAM edit.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: percona-ci-platform/grafana/admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: percona-ci-platform/grafana/admin
        property: admin-password

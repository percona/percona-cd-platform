{{/*
Read-only password for the MTR Postgres datasource (PS-10541). Grafana cannot
read a Secret from the `mtr` namespace, so the same PG_READER_PASSWORD from the
shared Secrets Manager bundle is synced into the grafana namespace here and
mounted via envValueFrom (values.yaml) as $MTR_PG_READER_PASSWORD. The `mtr`
addon syncs its own copy to set the CNPG managed-role password; both point at
the one Secrets Manager property so a single rotation covers both.

aws_iam_policy.eso_secrets_manager_read already grants GetSecretValue on
percona-ci-platform/* (Pod Identity), so no IAM edit is needed.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mtr-pg-reader
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mtr-pg-reader
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: percona-ci-platform/mtr/config
        property: PG_READER_PASSWORD

{{/*
ExternalSecret + grafana.ini override ConfigMap for SAML/Duo (HD-30780).

Gated on .Values.saml.enabled == "true" — the addons ApplicationSet
valuesObject sets this string from var.grafana_saml_enabled. Until then,
Grafana boots on local-admin and these manifests are not rendered.

Secrets Manager paths (operator populates after IT Ops returns metadata):
  ${cluster_name}/grafana/saml/certificate   — public cert (.crt)
  ${cluster_name}/grafana/saml/private_key   — signing key (.pem)

ClusterSecretStore lives in resources/addons/external-secrets/templates/
cluster-secret-store.yaml and uses Pod Identity for AWS auth.
*/}}
{{- if eq (.Values.saml.enabled | toString) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-saml
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-saml
    creationPolicy: Owner
  data:
    - secretKey: certificate
      remoteRef:
        key: percona-ci-platform/grafana/saml/certificate
    - secretKey: private_key
      remoteRef:
        key: percona-ci-platform/grafana/saml/private_key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-saml-ini
  namespace: {{ .Release.Namespace }}
data:
  saml.ini: |
    [auth.saml]
    enabled = true
    single_logout = false
    allow_idp_initiated = false
    allow_sign_up = true
    idp_metadata_url = {{ .Values.saml.idpMetadataUrl }}
    private_key_path = /etc/grafana/saml/private_key
    certificate_path = /etc/grafana/saml/certificate
    assertion_attribute_name = displayName
    assertion_attribute_login = mail
    assertion_attribute_email = mail
    assertion_attribute_groups = groups
    role_values_admin  = grafana_cd_admins
    role_values_viewer = grafana_cd_users
{{- end }}

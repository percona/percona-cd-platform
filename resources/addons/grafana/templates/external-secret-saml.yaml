{{/*
SAML/Duo wiring (HD-30780). Three resources, all gated on saml.enabled:

  1. ExternalSecret — syncs SP cert + private key from AWS Secrets Manager
       paths: percona-ci-platform/grafana/saml/{certificate,private_key}
       target: k8s Secret `grafana-saml`, mounted at /etc/grafana/saml/

  2. ConfigMap `grafana-saml-idp` — holds the Duo IdP metadata XML, base64-
       decoded from the cluster-Secret annotation grafana_saml_idp_metadata_b64.
       Mounted at /etc/grafana/saml-idp/idp-metadata.xml. Grafana reads via
       GF_AUTH_SAML_IDP_METADATA_PATH (env var set in values.yaml).

The Helm-values surface (values.yaml grafana.env block) flips on
GF_AUTH_SAML_ENABLED + sets paths/role mappings. Toggling this off requires
both `var.grafana_saml_enabled = false` AND clearing the env block in
values.yaml — kept separate so the SAML config can land before the cutover.

ClusterSecretStore lives in resources/addons/external-secrets/templates/
cluster-secret-store.yaml and uses Pod Identity for AWS auth.
*/}}
{{- if eq (.Values.saml.enabled | toString) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-saml
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-saml
    creationPolicy: Owner
  data:
    - secretKey: certificate
      remoteRef:
        key: percona-ci-platform/grafana/saml/certificate
    - secretKey: private_key
      remoteRef:
        key: percona-ci-platform/grafana/saml/private_key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-saml-idp
  namespace: {{ .Release.Namespace }}
data:
  idp-metadata.xml: |
{{ .Values.saml.idpMetadataB64 | b64dec | indent 4 }}
{{- end }}

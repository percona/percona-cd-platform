# Standalone kube-state-metrics. Why standalone instead of in-Alloy
# `prometheus.exporter.kube_state_metrics`: in-Alloy KSM bakes
# cluster-wide read RBAC for every K8s object kind into the Alloy DS
# pod that also handles logs, traces, rule sync, and metrics scrape.
# Standalone keeps that surface scoped to one Deployment.

kube-state-metrics:
  nodeSelector:
    workload.percona.com/tier: bootstrap
  # Bootstrap-tier toleration paired with Stage 2b CriticalAddonsOnly taint.
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  priorityClassName: platform-system-critical
  prometheus:
    monitor:
      enabled: true
      interval: 30s
      honorLabels: true
  # Expose node labels (instance-type, topology zone/region, arch, os,
  # karpenter.sh/nodepool, karpenter.sh/capacity-type) as Prometheus labels
  # on `kube_node_labels`. Required by the forked Karpenter Overview
  # dashboard: Karpenter v1.x narrowed the per-node `karpenter_nodes_*`
  # series to nodes WITHOUT a NodeClaim, leaving the inventory pies
  # (instance type / capacity / zone / etc.) without a per-node source.
  # `kube_node_labels` is the cleanest substitute and is also useful for
  # any future Karpenter-managed-fleet dashboard. Default KSM omits
  # node labels to keep cardinality low; with ~23 nodes here that's fine.
  metricLabelsAllowlist:
    - "nodes=[*]"

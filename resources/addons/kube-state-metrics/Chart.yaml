apiVersion: v2
name: kube-state-metrics
version: 0.1.0
description: |
  Standalone kube-state-metrics — emits the K8s object-state metrics
  (kube_pod_*, kube_deployment_*, kube_service_*, kube_node_*, etc.).
  Decoupled from kube-prometheus-stack (LGTM-only, ADR 0016). The
  ServiceMonitor it ships is picked up by the Alloy DS's
  prometheus.operator.servicemonitors component and pushed to Mimir.
type: application
dependencies:
  - name: kube-state-metrics
    version: 7.3.0
    repository: https://prometheus-community.github.io/helm-charts

apiVersion: v2
name: kube-state-metrics
version: 0.1.0
description: |
  Standalone kube-state-metrics — emits the K8s object-state metrics
  (kube_pod_*, kube_deployment_*, kube_service_*, kube_node_*, etc.)
  that K8s dashboards depend on. Decoupled from kube-prometheus-stack
  so it survives kps removal (LGTM-only, ADR 0016).
type: application
dependencies:
  - name: kube-state-metrics
    version: 7.3.0
    repository: https://prometheus-community.github.io/helm-charts

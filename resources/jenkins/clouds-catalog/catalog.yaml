        set -o xtrace

        if ! mountpoint -q /mnt; then
            for DEVICE_NAME in $(lsblk -ndpbo NAME,SIZE | sort -n -r | awk '{print $1}'); do
                if ! grep -qs "^${DEVICE_NAME}" /proc/mounts; then
                    DEVICE="^${DEVICE_NAME}"
                    break
                fi
            done
            if [ -n "^${DEVICE}" ]; then
                sudo mkfs.ext4 ^${DEVICE}
                sudo mount -o noatime ^${DEVICE} /mnt
            fi
        fi
        sudo ethtool -K eth0 sg off
        until sudo yum makecache; do
            sleep 1
            echo try again
        done

        sudo yum -y install java-17-amazon-corretto-headless tzdata-java unzip || sudo yum -y install java-17-openjdk-headless tzdata-java unzip || :
        sudo yum -y install git docker
        sudo yum -y remove awscli

        if ! $(aws --version | grep -q 'aws-cli/2'); then
            sudo rm -rf /tmp/aws* || true

            until curl "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "/tmp/awscliv2.zip"; do
                sleep 1
                echo try again
            done

            cd /tmp && unzip -q awscliv2.zip
            cd /tmp/aws && sudo ./install
        fi

        sudo install -o $(id -u -n) -g $(id -g -n) -d /mnt/jenkins


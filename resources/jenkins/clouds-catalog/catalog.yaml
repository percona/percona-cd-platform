  min-bionic-x64: |2

        set -o xtrace
        if ! mountpoint -q /mnt; then
            for DEVICE_NAME in $(lsblk -ndpbo NAME,SIZE | sort -n -r | awk '{print $1}'); do
                if ! grep -qs "^${DEVICE_NAME}" /proc/mounts; then
                    DEVICE="^${DEVICE_NAME}"
                    break
                fi
            done
            if [ -n "^${DEVICE}" ]; then
                sudo mkfs.ext2 ^${DEVICE}
                sudo mount ^${DEVICE} /mnt
            fi
        fi

        sudo sed -i '/bullseye-backports/ s/cdn-aws.deb.debian.org/archive.debian.org/' /etc/apt/sources.list

        until sudo apt-get update; do
            sleep 1
            echo try again
        done
        until sudo apt-get install -y lsb-release; do
            sleep 1
            echo try again
        done

        DEB_VER=$(lsb_release -sc)

        # Jenkins 2.555.1+ needs Java 21 on the agent JVM. These releases carry
        # openjdk-21 in their own archives, so no third-party JDK repo is added
        # to a package-test box. bionic, bullseye and bookworm keep their distro
        # 17 package for any tooling that expects a system java; their agent JVM
        # comes from the pinned Temurin 21 tarball below. xenial, stretch and
        # buster cannot join a 2.555.1+ controller at all: their apt mirrors are
        # archived, the until-apt-update loop above never exits, and the agent
        # launch times out before any java is installed.
        case "^${DEB_VER}" in
            trixie|jammy|noble|resolute)
                JAVA_VER="openjdk-21-jre-headless"
                ;;
            *)
                JAVA_VER="openjdk-17-jre-headless"
                ;;
        esac

        if [[ ^${DEB_VER} == "trixie" ]] || [[ ^${DEB_VER} == "bookworm" ]] || [[ ^${DEB_VER} == "buster" ]]; then
            sudo apt-get -y install ^${JAVA_VER} git
            sudo mv /etc/ssl /etc/ssl_old
            sudo apt-get -y install ^${JAVA_VER}
            sudo cp -r /etc/ssl_old /etc/ssl
            sudo apt-get -y install ^${JAVA_VER}
        else
            sudo apt-get -y install ^${JAVA_VER} git
        fi

        # bionic, bullseye and bookworm ship no openjdk-21 package, so the
        # agent JVM is a pinned Temurin 21 JRE tarball under /opt (no
        # third-party apt repo touches the box). The template sets javaPath to
        # /opt/temurin-21/bin/java, so only remoting runs on 21; the distro
        # packages above stay the system java.
        case "^${DEB_VER}" in
            bionic|bullseye|bookworm)
                sudo apt-get -y install curl ca-certificates
                if [ "$(uname -m)" = "aarch64" ]; then
                    T21_URL="https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jre_aarch64_linux_hotspot_21.0.12_8.tar.gz"
                    T21_SHA="5f9c96b656827b9d14ebeda7739e25be554fa6d25669b03847c1df6e869c0679"
                else
                    T21_URL="https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jre_x64_linux_hotspot_21.0.12.1_1.tar.gz"
                    T21_SHA="2413149700df0f7d440500a84a8f764c535f21e5a5e87d38328b64eec2c5b500"
                fi
                until curl -fsSL -o /tmp/temurin-21.tar.gz "^${T21_URL}"; do
                    sleep 1
                    echo try again
                done
                echo "^${T21_SHA}  /tmp/temurin-21.tar.gz" | sha256sum -c
                sudo mkdir -p /opt/temurin-21
                sudo tar -xzf /tmp/temurin-21.tar.gz -C /opt/temurin-21 --strip-components=1

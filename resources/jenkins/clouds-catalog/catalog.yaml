        fi

        until sudo yum makecache; do
            sleep 1
            echo try again
        done

        # Install Java based on RHEL version and OS type
        if [[ -f /etc/system-release ]] && grep -q "Amazon Linux" /etc/system-release; then
            sudo yum -y install java-21-amazon-corretto-headless || :

# Shared agent-cloud catalog (ADR 0029). GENERATED bootstrap from the live ps3
# configScript; hand-maintained going forward. Init bodies are byte-faithful.
devices:
  bare-xvd-8-80-gp2: xvda=:8:true:gp2,xvdd=:80:true:gp2
  sd-10-80-gp2: /dev/sda1=:10:true:gp2,/dev/sdd=:80:true:gp2
  sd-30-80-gp3: /dev/sda1=:30:true:gp3,/dev/sdd=:80:true:gp3
  sd-8-80-gp2: /dev/sda1=:8:true:gp2,/dev/sdd=:80:true:gp2
  xvd-8-80-gp2: /dev/xvda=:8:true:gp2,/dev/xvdd=:80:true:gp2
ec2_defaults:
  amiType:
    unixData:
      sshPort: '22'
  associateIPStrategy: PUBLIC_IP
  connectBySSHProcess: true
  connectionStrategy: PRIVATE_IP
  deleteRootOnTermination: true
  ebsEncryptRootVolume: DEFAULT
  enclaveEnabled: false
  hostKeyVerificationStrategy: 'OFF'
  iamInstanceProfile: arn:aws:iam::ACCTID_EXPR:instance-profile/jenkins-ps3-worker
  idleTerminationMinutes: '15'
  javaPath: java
  maxTotalUses: -1
  metadataEndpointEnabled: true
  metadataHopsLimit: 1
  metadataSupported: true
  metadataTokensRequired: true
  minimumNumberOfInstances: 0
  minimumNumberOfSpareInstances: 0
  mode: NORMAL
  monitoring: false
  remoteFS: /mnt/jenkins
  securityGroups: jenkins-ps3-arm-worker
  spotConfig:
    useBidPrice: true
  stopOnTerminate: false
  t2Unlimited: false
  tenancy: Default
  useEphemeralDevices: false
hetzner_defaults:
  bootDeadline: 8
  connectivity: both
  connector:
    root:
      connectionMethod: public
      sshCredentialsId: htz.cd.key
  jvmOpts: -Xms4g -Xmx16g -Xss4m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
  network: '10442325'
  primaryIp: default
  remoteFs: /mnt/jenkins/
  shutdownPolicy:
    idle:
      idleMinutes: 10
  userData: |
    #!/bin/bash -x
        set -o xtrace
        # Force IPv4 early (Hetzner -> Cloudflare CDN IPv6 routing is intermittently broken, see PKG-1325)
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
        sudo sysctl -w net.ipv6.conf.eth0.disable_ipv6=1 || true
        echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf
        echo -e "nameserver 9.9.9.9
    nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
        echo '10.30.6.9 repo.ci.percona.com' | sudo tee -a /etc/hosts
        sudo install -o $(id -u -n) -g $(id -g -n) -d /mnt/jenkins
        sudo fallocate -l 32G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

        # Pin apt to deb.debian.org (avoid Hetzner mirror lottery, see PKG-1323/PKG-1324)
        sudo tee /etc/apt/sources.list > /dev/null <<'APT_EOF'
    deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
    deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
    deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
    deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
    APT_EOF

        export DEBIAN_FRONTEND=noninteractive
        until sudo apt-get update; do
            sleep 1
            echo try again
        done
        until sudo apt-get -y install openjdk-17-jre-headless apt-transport-https ca-certificates curl gnupg lsb-release unzip git qemu-user-static binfmt-support; do
            sleep 1
            echo try again
        done
        curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        until sudo apt-get update; do
            sleep 1
            echo try again
        done
        until sudo apt-get -y install docker-ce docker-ce-cli containerd.io; do
            sleep 1
            echo try again
        done
        if ! $(aws --version | grep -q 'aws-cli/2'); then
            find /tmp -maxdepth 1 -name "*aws*" | xargs sudo rm -rf
            until curl "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m)-2.22.35.zip" -o "/tmp/awscliv2.zip"; do
                sleep 1
                echo try again
            done
            unzip -o /tmp/awscliv2.zip -d /tmp
            cd /tmp/aws && sudo ./install
        fi
        sudo sysctl net.ipv4.tcp_fin_timeout=15
        sudo sysctl net.ipv4.tcp_tw_reuse=1
        sudo sysctl net.ipv6.conf.all.disable_ipv6=1
        sudo sysctl net.ipv6.conf.default.disable_ipv6=1
        sudo sysctl -w fs.inotify.max_user_watches=10000000 || true
        sudo sysctl -w fs.aio-max-nr=1048576 || true
        sudo sysctl -w fs.file-max=6815744 || true
        echo "*  soft  core  unlimited" | sudo tee -a /etc/security/limits.conf
        sudo sed -i.bak -e 's^ExecStart=.*^ExecStart=/usr/bin/dockerd --data-root=/mnt/docker --default-ulimit nofile=900000:900000^' /lib/systemd/system/docker.service
        sudo systemctl daemon-reload
        sudo install -o root -g root -d /mnt/docker
        sudo usermod -aG docker $(id -u -n)
        sudo mkdir -p /etc/docker
        echo '{"experimental": true, "ipv6": true, "fixed-cidr-v6": "fd3c:a8b0:18eb:5c06::/64"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
initScripts:

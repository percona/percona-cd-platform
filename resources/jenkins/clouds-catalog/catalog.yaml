  micro-amazon: |2+

        set -o xtrace
        RHVER=$(rpm --eval %rhel)
        ARCH=$(uname -m)

        if ! mountpoint -q /mnt; then
            for DEVICE_NAME in $(lsblk -ndbo NAME,SIZE | sort -n -r | awk '{print $1}'); do

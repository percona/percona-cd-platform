# ps3-k8s.cd.percona.com -- first Jenkins controller to run in-cluster (the pilot).
#
# DISABLED: kept under _disabled/ until Stage 0 validation passes; NOT yet in the
# `jenkins-masters` ApplicationSet `instances/*` glob (A-safety gate -- do not
# re-enable until the chart rebuild + helm-render CI are merged AND the substrate
# node pool / Retain PVC exist).
#
# Seeded as a full replica of the production EC2 ps3 master: JENKINS_HOME restored
# from a cross-region EBS snapshot copy into us-east-1a (runbooks/migrate-ps3-to-
# eks.md), so jobs / credentials / build history come up identical on first boot.
# Production ps3.cd.percona.com stays on EC2 during validation; cutover is a later
# DNS flip. These are jenkins:-scoped overrides layered on values-base.yaml.
jenkins:
  controller:
    ingress:
      hostName: ps3-k8s.cd.percona.com
      annotations:
        # Wildcard *.cd.percona.com ACM cert in us-east-1 (terraform acm.tf).
        alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:<account-id>:certificate/<wildcard-cd-cert>"
      tls:
        - hosts:
            - ps3-k8s.cd.percona.com
  persistence:
    # Pre-bind to the volume restored from the EC2 ps3 cross-region EBS snapshot
    # (us-east-1a) before first boot; leave existingClaim unset for a throwaway
    # fresh PVC during early dark-replica testing.
    storageClass: gp3-jenkins-1a-retain
    size: 100Gi
    # existingClaim: ps3-k8s-jenkins-home

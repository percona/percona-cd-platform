apiVersion: v2
name: jenkins-master
version: 1.1.0
appVersion: "2.541.3"
description: Per-instance Jenkins master (controller) Helm wrapper. The
  ApplicationSet `jenkins-masters` (argocd-bootstrap/applicationsets/jenkins-app.yaml)
  generates one Application per `instances/<host>/` directory and renders
  this chart with `values-base.yaml + instances/<host>/values.yaml`.
dependencies:
  - name: jenkins
    version: 5.9.18
    repository: https://charts.jenkins.io

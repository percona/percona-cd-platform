# ps3-k8s.cd.percona.com -- in-cluster ps3 controller.
#
# STAGE 2 (real-data clone): booting from the REAL ps3 JENKINS_HOME, restored from
# an app-consistent EBS snapshot of the fenced EC2 master, to validate plugins,
# upgrades, GitHub OAuth and real agent provisioning against ps3's actual config.
# The EC2 ps3 master is fenced (jenkins masked + :8080 down) so the in-cluster
# controller is the single writer. jenkins:-scoped overrides on values-base.yaml.
# Generated Application is MANUAL-SYNC (ADR 0025).
jenkins:
  controller:
    ingress:
      # Serve the REAL host ps3.cd.percona.com directly from the chart's PRIMARY
      # ingress. The primary renders a HOST-ONLY rule (no path condition), so it
      # matches every path including /login -- unlike a secondaryingress, whose
      # forced path-pattern only matched "/" and let /login fall through to the
      # proxy. One ingress, one host (ps3-k8s.cd dropped: it was dark-replica
      # scaffolding; ps3.cd is canonical and matches the restored config.xml
      # JENKINS_URL, so OAuth callbacks + agent JNLP URLs self-align).
      hostName: ps3.cd.percona.com
      # No certificate-arn: the ALB controller auto-discovers the wildcard
      # *.cd.percona.com ACM cert via SNI (keeps the cert ARN out of this repo).
      tls:
        - hosts:
            - ps3.cd.percona.com
      # group.order:-10 wins the ps3.cd host condition over the lower-priority
      # jenkins-ingress proxy rule during the cutover overlap (harmless once the
      # proxy ps3 entry is removed). Deep-merges with the ALB-group annotations
      # from values-base. external-dns publishes ps3.cd to the same ALB from the
      # host field, so the A record never changes (zero-gap handoff).
      annotations:
        alb.ingress.kubernetes.io/group.order: "-10"

    # === Phase 1 (ADR 0027 -- dynamic config) ================================
    # Replace the chart's default local-admin realm (which overwrote ps3's GitHub
    # OAuth on the restored disk) with ps3's real GithubSecurityRealm + matrix authz,
    # delivered as a hot-reloaded JCasC configScript. The OAuth client secret comes
    # from AWS Secrets Manager (jenkins/ps3/github-oauth) via the ExternalSecret
    # below -> k8s Secret -> projected at /run/secrets/additional -> JCasC
    # ${github-oauth-client-secret}. No secret on disk or in this repo.
    existingSecret: jenkins-ps3-k8s-oauth
    containerEnv:
      # Abort a JCasC reload if a referenced secret fails to resolve, instead of
      # silently blanking the OAuth secret and locking everyone out.
      - name: CASC_STRICT_SECRET_RESOLUTION
        value: "true"
    JCasC:
      # Suppress the chart's default local-admin securityRealm + authorizationStrategy
      # (they default truthy and are NOT gated by defaultConfig); ps3-security owns both.
      securityRealm: ""
      authorizationStrategy: ""
      configScripts:
        ps3-security: |
          jenkins:
            securityRealm:
              github:
                githubWebUri: "https://github.com"
                githubApiUri: "https://api.github.com"
                clientID: "85f036ccdd50140758ad"
                clientSecret: "${github-oauth-client-secret}"
                oauthScopes: "read:org,user:email"
            authorizationStrategy:
              globalMatrix:
                entries:
                  # Break-glass: a real GitHub login keeps admin even if a team
                  # (org*team) sid fails to resolve -- the only safety net, since
                  # globalMatrix has no first-user fallback.
                  - user:
                      name: "nogueiraanderson"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*build-engineers"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*iit"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*dev-ps"
                      permissions: &ps_power
                        - "hudson.model.Computer.Build"
                        - "hudson.model.Computer.Configure"
                        - "hudson.model.Computer.Connect"
                        - "hudson.model.Computer.Create"
                        - "hudson.model.Computer.Delete"
                        - "hudson.model.Computer.Disconnect"
                        - "hudson.model.Computer.Provision"
                        - "hudson.model.Hudson.Read"
                        - "hudson.model.Item.Build"
                        - "hudson.model.Item.Cancel"
                        - "hudson.model.Item.Configure"
                        - "hudson.model.Item.Create"
                        - "hudson.model.Item.Delete"
                        - "hudson.model.Item.Discover"
                        - "hudson.model.Item.Move"
                        - "hudson.model.Item.Read"
                        - "hudson.model.Item.Workspace"
                        - "hudson.model.Run.Delete"
                        - "hudson.model.Run.Replay"
                        - "hudson.model.Run.Update"
                        - "hudson.model.View.Configure"
                        - "hudson.model.View.Create"
                        - "hudson.model.View.Delete"
                        - "hudson.model.View.Read"
                  - group:
                      name: "percona*QA-ps"
                      permissions: *ps_power
                  - group:
                      name: "percona*doc"
                      permissions:
                        - "hudson.model.Computer.Build"
                        - "hudson.model.Computer.Connect"
                        - "hudson.model.Computer.Provision"
                        - "hudson.model.Hudson.Read"
                        - "hudson.model.Item.Build"
                        - "hudson.model.Item.Cancel"
                        - "hudson.model.Item.Discover"
                        - "hudson.model.Item.Read"
                        - "hudson.model.Item.Workspace"
                        - "hudson.model.View.Read"
    # === end Phase 1 controller config (ExternalSecret -> jenkins.extraObjects below) =
    # === Phase 2 (ADR 0027 -- clouds) =======================================
    # The Graviton EC2 Fleet (ASG jenkins-ps3-arm-graviton, ec2-fleet plugin) was
    # never in ps3's restored config.xml -- on the EC2 master it lived only in
    # init.groovy.d. Re-create it as a boot-time init script, GitOps-managed (the
    # jenkins-ps3-k8s-clouds-init ConfigMap under jenkins.extraObjects), which the
    # chart mounts at /var/jenkins_home/init.groovy.d so it runs on the restored
    # home at boot. The script is imperative (adds the cloud by name) so it cannot
    # disturb the restored Hetzner / classic-EC2 / DigitalOcean clouds -- unlike a
    # declarative jenkins.clouds block, which JCasC would treat as authoritative
    # and prune any cloud it does not list.
    initConfigMap: jenkins-ps3-k8s-clouds-init
    # Restored-home boot-guard (non-root). The controller pod is runAsNonRoot, so
    # it CANNOT host a root chown initContainer; the one-time ownership fix (EC2
    # jenkins UID 994 -> in-cluster 1000) is done by a separate root Job against
    # the PVC BEFORE first boot (the k8s-migration recipe: restore snapshot ->
    # run the chown Job -> boot). fsGroupChangePolicy is OnRootMismatch, so once
    # the root dir is 1000 every later boot skips the recursive ownership pass.
    # This guard just refuses to start unless the restored home is genuinely ps3's
    # (config.xml + secrets/master.key present), so an empty or wrong volume can
    # never silently boot a blank Jenkins over ps3's identity. It runs as 1000 and
    # reads the (now 1000-owned) files.
    customInitContainers:
      - name: boot-guard
        image: public.ecr.aws/docker/library/busybox:1.36
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
        command: ["sh", "-c"]
        args:
          - |
            set -e
            test -f /var/jenkins_home/config.xml || { echo "GUARD FAIL: config.xml missing (empty/wrong volume)"; exit 1; }
            test -f /var/jenkins_home/secrets/master.key || { echo "GUARD FAIL: secrets/master.key missing"; exit 1; }
            echo "boot-guard ok: real ps3 JENKINS_HOME present"
        volumeMounts:
          - name: jenkins-home
            mountPath: /var/jenkins_home
            subPath: ps3.cd.percona.com
  persistence:
    storageClass: gp3-jenkins-1a-retain
    size: 100Gi
    # JENKINS_HOME on the EC2 master is the SUBDIR ps3.cd.percona.com of the XFS
    # data volume, so mount that subdir as /var/jenkins_home (else Jenkins boots
    # the empty volume root and ignores config.xml).
    subPath: ps3.cd.percona.com
    # Pre-bound static PV from the restored snapshot volume (us-east-1a, xfs),
    # created out-of-band (kubectl, uncommitted) so the EBS volume id stays out of
    # this public repo.
    existingClaim: ps3-k8s-jenkins-home

  # Subchart-level extraObjects (rendered by the jenkins chart's extra-objects.yaml,
  # which reads .Values.extraObjects -- NOT controller.extraObjects). The ExternalSecret
  # pulls the OAuth client secret from AWS Secrets Manager into the k8s Secret that
  # controller.existingSecret (Phase 1, above) projects for JCasC ${...}.
  extraObjects:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: jenkins-ps3-k8s-oauth
        labels:
          app.kubernetes.io/part-of: jenkins-ps3-k8s
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: aws-secrets-manager
        target:
          name: jenkins-ps3-k8s-oauth
          creationPolicy: Owner
        data:
          - secretKey: github-oauth-client-secret
            remoteRef:
              # percona-ci-platform/<app>/... convention: the ESO role is
              # least-privilege-scoped to secret:percona-ci-platform/*, so this path
              # is readable with no IAM change and off-convention names are denied.
              key: percona-ci-platform/jenkins/ps3/github-oauth
              property: client_secret

    # Boot-time clouds init (Phase 2): controller.initConfigMap mounts this CM's
    # keys at /var/jenkins_home/init.groovy.d, so ec2FleetCloud.groovy runs on the
    # restored home at boot. A ConfigMap (not a Secret): nothing here is sensitive --
    # AWS API auth is the pod's Pod Identity role and the worker SSH key is the
    # restored 'ec2-fleet-arm-graviton' credential.
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: jenkins-ps3-k8s-clouds-init
        labels:
          app.kubernetes.io/part-of: jenkins-ps3-k8s
      data:
        ec2FleetCloud.groovy: |
          // ec2FleetCloud.groovy (PS-11179) -- ps3-k8s in-cluster Graviton Fleet.
          //
          // Mounted at /var/jenkins_home/init.groovy.d by controller.initConfigMap, so it
          // runs at boot on the restored JENKINS_HOME. Registers the diversified Graviton
          // EC2 Fleet (ASG jenkins-ps3-arm-graviton, ec2-fleet plugin) serving the
          // docker-32gb-aarch64 workload, plus an arm-graviton-fleet label to target it.
          //
          // AWS API auth: awsCredentialsId='' -> the controller pod's Pod Identity role
          // (terraform/iam-jenkins-controller.tf grants autoscaling + ec2). SSH cred
          // 'ec2-fleet-arm-graviton' is ps3's restored key for the launch-template key pair
          // percona-jenkins. privateIpUsed=true: the in-cluster controller reaches workers
          // by private IP over the EKS<->ps3 VPC peering (the jenkins-arm-fleet TF module
          // opens the worker SG to the EKS VPC CIDR via extra_ssh_cidrs).
          import com.amazon.jenkins.ec2fleet.EC2FleetCloud
          import hudson.plugins.sshslaves.SSHConnector
          import hudson.plugins.sshslaves.verifiers.NonVerifyingKeyVerificationStrategy
          import jenkins.model.Jenkins
          import java.util.logging.Logger

          final Logger LOG = Logger.getLogger('ec2FleetCloud')
          final String CLOUD_NAME  = 'arm-graviton-fleet'
          final String REGION      = 'eu-west-1'
          final String ASG_NAME    = 'jenkins-ps3-arm-graviton'
          final String LABEL       = 'docker-32gb-aarch64 arm-graviton-fleet'
          final String SSH_CRED_ID = 'ec2-fleet-arm-graviton'

          def jk = Jenkins.instance
          jk.clouds.findAll { it.name == CLOUD_NAME }.toList().each { jk.clouds.remove(it) }

          def sshConn = new SSHConnector(22, SSH_CRED_ID, '', '', '', '', null, null, null,
              new NonVerifyingKeyVerificationStrategy())

          def fleet = new EC2FleetCloud(
              CLOUD_NAME, '', '', REGION, '', ASG_NAME, LABEL, '/mnt/jenkins',
              sshConn,
              true,            // privateIpUsed
              false,           // alwaysReconnect
              (Integer) 10,    // idleMinutes
              0, 16, 0, 1,     // minSize, maxSize, minSpareSize, numExecutors
              true,            // addNodeOnlyIfRunning
              false,           // restrictUsage
              '-1',            // maxTotalUses
              false,           // disableTaskResubmit
              (Integer) 600, (Integer) 15, (Integer) 10,   // initOnlineTimeout, initOnlineCheckInterval, cloudStatusInterval
              false,           // noDelayProvision
              false,           // scaleExecutorsByWeight
              new EC2FleetCloud.NoScaler()
          )
          jk.clouds.add(fleet)
          LOG.info("ec2FleetCloud: registered cloud='${CLOUD_NAME}' label='${LABEL}' fleet='${ASG_NAME}' sshCred='${SSH_CRED_ID}'")

    # === end Phase 1 controller config (ExternalSecret -> jenkins.extraObjects below) =
    # === Phase 2 (ADR 0027 -- clouds) =======================================
    # The Graviton EC2 Fleet (ASG jenkins-ps3-arm-graviton, ec2-fleet plugin) was
    # never in ps3's restored config.xml -- on the EC2 master it lived only in
    # init.groovy.d. Re-create it as a boot-time init script, GitOps-managed (the
    # jenkins-ps3-k8s-clouds-init ConfigMap under jenkins.extraObjects), which the
    # chart mounts at /var/jenkins_home/init.groovy.d so it runs on the restored
    # home at boot. The script is imperative (adds the cloud by name) so it cannot
    # disturb the restored Hetzner / classic-EC2 / DigitalOcean clouds -- unlike a
    # declarative jenkins.clouds block, which JCasC would treat as authoritative
    # and prune any cloud it does not list.
    initConfigMap: jenkins-ps3-k8s-clouds-init
    # Restored-home boot-guard (non-root). The controller pod is runAsNonRoot, so
    # it CANNOT host a root chown initContainer; the one-time ownership fix (EC2
    # jenkins UID 994 -> in-cluster 1000) is done by a separate root Job against
    # the PVC BEFORE first boot (the k8s-migration recipe: restore snapshot ->
    # run the chown Job -> boot). fsGroupChangePolicy is OnRootMismatch, so once
    # the root dir is 1000 every later boot skips the recursive ownership pass.
    # This guard just refuses to start unless the restored home is genuinely ps3's
    # (config.xml + secrets/master.key present), so an empty or wrong volume can
    # never silently boot a blank Jenkins over ps3's identity. It runs as 1000 and
    # reads the (now 1000-owned) files.
    customInitContainers:
      - name: boot-guard
        image: public.ecr.aws/docker/library/busybox:1.36
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
        command: ["sh", "-c"]
        args:
          - |
            set -e
            test -f /var/jenkins_home/config.xml || { echo "GUARD FAIL: config.xml missing (empty/wrong volume)"; exit 1; }
            test -f /var/jenkins_home/secrets/master.key || { echo "GUARD FAIL: secrets/master.key missing"; exit 1; }
            echo "boot-guard ok: real ps3 JENKINS_HOME present"
        volumeMounts:
          - name: jenkins-home
            mountPath: /var/jenkins_home
            subPath: ps3.cd.percona.com
  persistence:
    storageClass: gp3-jenkins-1a-retain
    size: 100Gi
    # JENKINS_HOME on the EC2 master is the SUBDIR ps3.cd.percona.com of the XFS
    # data volume, so mount that subdir as /var/jenkins_home (else Jenkins boots
    # the empty volume root and ignores config.xml).
    subPath: ps3.cd.percona.com
    # Pre-bound static PV from the restored snapshot volume (us-east-1a, xfs),
    # created out-of-band (kubectl, uncommitted) so the EBS volume id stays out of
    # this public repo.
    existingClaim: ps3-k8s-jenkins-home
    # Pod-level volumes for the alloy-metrics sidecar. The chart still provisions
    # jenkins-home automatically: it only skips its own home volume when this list
    # contains the literal string "jenkins-home", which these two entries do not.
    volumes:
      - name: alloy-metrics-config
        configMap:
          name: jenkins-ps3-k8s-alloy-metrics
      - name: alloy-metrics-data
        emptyDir: {}

  # Subchart-level extraObjects (rendered by the jenkins chart's extra-objects.yaml,
  # which reads .Values.extraObjects -- NOT controller.extraObjects). The ExternalSecret
  # pulls the OAuth client secret from AWS Secrets Manager into the k8s Secret that
  # controller.existingSecret (Phase 1, above) projects for JCasC ${...}.
  extraObjects:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: jenkins-ps3-k8s-oauth
        labels:
          app.kubernetes.io/part-of: jenkins-ps3-k8s
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: aws-secrets-manager
        target:
          name: jenkins-ps3-k8s-oauth
          creationPolicy: Owner
        data:
          - secretKey: github-oauth-client-secret
            remoteRef:
              # percona-ci-platform/<app>/... convention: the ESO role is
              # least-privilege-scoped to secret:percona-ci-platform/*, so this path
              # is readable with no IAM change and off-convention names are denied.
              key: percona-ci-platform/jenkins/ps3/github-oauth
              property: client_secret

    # Boot-time clouds init (Phase 2): controller.initConfigMap mounts this CM's
    # keys at /var/jenkins_home/init.groovy.d, so the boot scripts below run on the
    # restored home at boot. A ConfigMap (not a Secret): nothing here is sensitive --
    # AWS API auth is the pod's Pod Identity role and the worker SSH key is the
    # restored 'ec2-fleet-arm-graviton' credential.
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: jenkins-ps3-k8s-clouds-init
        labels:
          app.kubernetes.io/part-of: jenkins-ps3-k8s
      data:
        hetznerArmHealth.groovy: |
          // hetznerArmHealth.groovy  (PS-11179)
          //
          // Master-side health probe that publishes whether Hetzner arm64 (CAX) capacity is
          // currently usable, as Jenkins GLOBAL env vars consumed by vars/resolveArmWorker:
          //
          //     HETZNER_ARM64_HEALTHY    "true" | "false"
          //     HETZNER_ARM64_HEALTH_AT  epoch seconds of the last SUCCESSFUL observation
          //     HETZNER_ARM64_REASON     short human-readable verdict
          //
          // Runs ON THIS CONTROLLER (not a worker). Every 60s on the Jenkins Timer pool it
          // reads this master's OWN loopback metrics endpoint
          // (http://127.0.0.1:8080/hetzner-prometheus) and inspects
          // hetzner_dc_circuit_breaker_state{arch="arm64"} for every arm64 DC.
          //
          // Verdict:
          //   - UNHEALTHY when every arm64 DC breaker is non-CLOSED (state >= 1, i.e. OPEN or
          //     HALF_OPEN): no German DC can currently fulfil an arm64 server.
          //   - HEALTHY otherwise (at least one arm64 DC breaker CLOSED, or no arm64 series yet).
          // It reads the metrics TEXT only; it never calls DcCircuitBreaker.getState() from
          // Groovy (that would mutate breaker state / arm a HALF_OPEN probe lease).
          //
          // Hysteresis: flip to UNHEALTHY immediately (divert away from dead capacity fast),
          // but require CLEAR_POLLS consecutive healthy observations before flipping back to
          // HEALTHY (avoid flapping a half-recovered DC back and forth).
          //
          // Fail-safe by OMISSION: on any fetch/parse error we DO NOT touch the flag, so it
          // goes stale and resolveArmWorker treats stale/absent as healthy (-> Hetzner, the
          // current behaviour). UNHEALTHY is published only on POSITIVE fresh evidence, so a
          // metrics glitch can never force the costly AWS fallback on.
          //
          // In-memory by design: the env vars live in globalNodeProperties and are NOT saved
          // to disk (no per-minute config churn). After a restart this script republishes
          // within ~1 min; until then resolveArmWorker's stale/absent fail-safe holds.
          //
          // Idempotent re-deploy: re-evaluating this file (jenkins iac deploy / boot) bumps a
          // generation token; the previously scheduled task sees the mismatch on its next tick
          // and self-terminates, so exactly one probe converges within 60s.

          import jenkins.model.Jenkins
          import jenkins.util.Timer
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.CancellationException
          import java.util.logging.Logger

          final Logger LOG = Logger.getLogger('hetznerArmHealth')
          final String METRICS_URL = 'http://127.0.0.1:8080/hetzner-prometheus/'   // trailing slash avoids a 302
          final int CLEAR_POLLS = 2          // consecutive healthy polls before re-enabling Hetzner
          final long PERIOD_SEC = 60L
          final long INITIAL_DELAY_SEC = 15L

          // Generation token: supersede any schedule left by an earlier eval of this file.
          final String GEN = UUID.randomUUID().toString()
          System.setProperty('hetznerArmHealth.gen', GEN)

          def parseArmBreakerStates = { String body ->
              def states = []
              body.eachLine { String line ->
                  if (line.startsWith('hetzner_dc_circuit_breaker_state') && line.contains('arch="arm64"')) {
                      def m = (line =~ /\}\s+([0-9.eE+-]+)\s*$/)
                      if (m.find()) { states << (m.group(1) as double) }
                  }
              }
              return states
          }

          def publishEnv = { boolean healthy, long atSec, String reason ->
              def props = Jenkins.instance.globalNodeProperties
              def envProp = props.get(hudson.slaves.EnvironmentVariablesNodeProperty)
              if (envProp == null) {
                  envProp = new hudson.slaves.EnvironmentVariablesNodeProperty()
                  props.add(envProp)
              }
              def vars = envProp.envVars
              vars.put('HETZNER_ARM64_HEALTHY', healthy ? 'true' : 'false')
              vars.put('HETZNER_ARM64_HEALTH_AT', atSec.toString())
              vars.put('HETZNER_ARM64_REASON', reason)
          }

          Runnable probe = {
              try {
                  if (System.getProperty('hetznerArmHealth.gen') != GEN) {
                      throw new CancellationException('superseded by newer hetznerArmHealth eval')
                  }

                  String body
                  try {
                      def conn = (java.net.HttpURLConnection) new URL(METRICS_URL).openConnection()
                      conn.connectTimeout = 4000
                      conn.readTimeout = 4000
                      int code = conn.responseCode
                      if (code != 200) {
                          LOG.warning("hetznerArmHealth: metrics HTTP ${code}; leaving flag untouched (stale->healthy fail-safe)")
                          return
                      }
                      body = conn.inputStream.getText('UTF-8')
                  } catch (CancellationException ce) {
                      throw ce
                  } catch (Exception fe) {
                      LOG.warning("hetznerArmHealth: metrics fetch failed (${fe.message}); leaving flag untouched (stale->healthy fail-safe)")
                      return
                  }

                  def states = parseArmBreakerStates(body)
                  boolean observedHealthy
                  String reason
                  if (states.isEmpty()) {
                      observedHealthy = true
                      reason = 'no arm64 DC breaker series (assuming healthy)'
                  } else {
                      int closed = states.count { it < 1.0d }
                      observedHealthy = (closed > 0)
                      reason = observedHealthy ?
                          "${closed}/${states.size()} arm64 DC breakers CLOSED".toString() :
                          "all ${states.size()} arm64 DC breakers non-CLOSED (OPEN/HALF_OPEN)".toString()
                  }

                  boolean priorHealthy = (System.getProperty('hetznerArmHealth.published', 'true') != 'false')
                  int priorStreak = (System.getProperty('hetznerArmHealth.streak', '0')) as int
                  boolean publishHealthy
                  int streak
                  if (!observedHealthy) {
                      publishHealthy = false
                      streak = 0
                  } else {
                      streak = priorStreak + 1
                      publishHealthy = priorHealthy || (streak >= CLEAR_POLLS)
                      if (!publishHealthy) {
                          reason = "recovering (${streak}/${CLEAR_POLLS} healthy polls); holding AWS fallback".toString()
                      }
                  }
                  System.setProperty('hetznerArmHealth.published', publishHealthy ? 'true' : 'false')
                  System.setProperty('hetznerArmHealth.streak', streak.toString())

                  long nowSec = (long) (System.currentTimeMillis() / 1000L)
                  publishEnv(publishHealthy, nowSec, reason)
                  LOG.fine("hetznerArmHealth: healthy=${publishHealthy} (${reason})")
              } catch (CancellationException supersede) {
                  throw supersede   // let scheduleAtFixedRate suppress this stale generation
              } catch (Throwable t) {
                  LOG.warning("hetznerArmHealth: unexpected ${t}")   // swallow so the probe keeps running
              }
          }

          Timer.get().scheduleAtFixedRate(probe, INITIAL_DELAY_SEC, PERIOD_SEC, TimeUnit.SECONDS)
          LOG.info("hetznerArmHealth: scheduled (gen=${GEN}, every ${PERIOD_SEC}s, loopback ${METRICS_URL})")
        durability.groovy: |
          /**
           * Persist the global pipeline durability hint as MAX_SURVIVABILITY at
           * every JVM boot, by calling the GlobalDefaultFlowDurabilityLevel
           * descriptor's setDurabilityHint() + save() so the value lands in
           * $JENKINS_HOME/org.jenkinsci.plugins.workflow.flow.GlobalDefaultFlowDurabilityLevel.xml
           * (the descriptor's standard config file). Idempotent on the happy
           * path: when the hint already matches the target, the script is a no-op.
           *
           * Background. Pipeline builds use one of three durability hints:
           *   PERFORMANCE_OPTIMIZED  - FlowNode state kept in memory until the
           *                            build finishes; an abrupt JVM stop
           *                            (kill -9, AWS spot interrupt) loses the
           *                            whole in-flight build.
           *   SURVIVABLE_NONATOMIC   - persists eventually, weaker ordering.
           *   MAX_SURVIVABILITY      - persists each FlowNode as it executes, so
           *                            a build resumes at the same step on JVM
           *                            return.
           *
           * Why explicit when workflow-api already advertises MAX_SURVIVABILITY
           * as the default? The default is fragile: any operator change in
           * Manage Jenkins -> System silently writes the descriptor's XML and
           * can replace the hint with no IaC trace. Writing the value ourselves
           * at every boot anchors the canary's resilience guarantee.
           *
           * Note on the descriptor: when no XML exists, the descriptor's in-memory
           * field is null (the MAX_SURVIVABILITY default lives at a higher
           * layer in workflow-api). So `current != target` correctly fires the
           * write path on a fresh master, and the resulting save() materialises
           * the on-disk XML.
           *
           * Scope: ps3 canary only. PS-11173 Phase 2.
           */
          import org.jenkinsci.plugins.workflow.flow.FlowDurabilityHint
          import jenkins.model.Jenkins

          def descCls = Class.forName('org.jenkinsci.plugins.workflow.flow.GlobalDefaultFlowDurabilityLevel$DescriptorImpl')
          def descriptors = Jenkins.instance.getExtensionList(descCls)
          if (descriptors.isEmpty()) {
              println "durability.groovy: GlobalDefaultFlowDurabilityLevel descriptor missing (workflow-api plugin not installed?)"
              return
          }

          def d = descriptors[0]
          def current = d.durabilityHint
          def target = FlowDurabilityHint.MAX_SURVIVABILITY

          if (current != target) {
              d.setDurabilityHint(target)
              d.save()
              println "durability.groovy: ${current} -> ${target}"
          } else {
              println "durability.groovy: GlobalDefaultFlowDurabilityLevel already ${target}"
          }

    # Alloy sidecar config (mounted by controller.sidecars.additionalSidecarContainers
    # above via the alloy-metrics-config volume). River pipeline: loopback-scrape the Hetzner plugin
    # metrics endpoint, stamp master=ps3-k8s + cluster, remote_write to the in-cluster
    # Mimir distributor (same endpoint + tenant the cluster Alloy DaemonSet uses).
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: jenkins-ps3-k8s-alloy-metrics
        labels:
          app.kubernetes.io/part-of: jenkins-ps3-k8s
      data:
        config.alloy: |
          // Loopback scrape of the Hetzner plugin's /hetzner-prometheus endpoint.
          // The endpoint is loopback-only (HetznerPrometheusEndpoint 403s non-127.0.0.1
          // peers), so this sidecar scrapes 127.0.0.1 and remote_writes to Mimir,
          // mirroring the EC2 fleet's per-master Alloy (ADR 0013). Trailing slash on
          // the metrics path is required (no-slash 302s).
          prometheus.scrape "hetzner_local" {
            targets = [{
              __address__      = "127.0.0.1:8080",
              __metrics_path__ = "/hetzner-prometheus/",
            }]
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          // Loopback scrape of the percona-jenkins-stats plugin's /percona-stats
          // endpoint (same loopback-only gate; the plugin serves its OWN registry,
          // so the two endpoints carry disjoint metric families).
          prometheus.scrape "percona_stats" {
            targets = [{
              __address__      = "127.0.0.1:8080",
              __metrics_path__ = "/percona-stats/",
            }]
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.remote_write "mimir" {
            endpoint {
              url     = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
              headers = { "X-Scope-OrgID" = "percona-ci" }
            }
            // master=ps3-k8s per ADR 0013 A2 / CLAUDE.md #11 (bare ps3 collided ->
            // err-mimir-sample-out-of-order with the decommissioned EC2 ps3). cluster
            // matches the cluster Alloy external label for dashboard correlation.
            external_labels = {
              cluster = "percona-ci-platform",
              master  = "ps3-k8s",
            }
          }

          // Build events: one JSON line per completed build, written by the
          // percona-jenkins-stats plugin onto the PVC and shipped to the
          // in-cluster Loki distributor with the fleet label schema
          // (component="builds"); mirrors the EC2 masters' per-master Alloy
          // shape so dashboards query one schema fleet-wide.
          //
          // local.file_match (re-scans every sync period) instead of a static
          // loki.source.file target: with a static target, an alloy that
          // starts before the plugin writes the first event finds no file and
          // PERMANENTLY skips the source ("failed to create source,
          // skipping") -- exactly what happened on the first pod roll, where
          // the sidecar came up 30s before the first completed build created
          // the file. file_match also tracks the rotation cycle.
          local.file_match "build_events" {
            path_targets = [{
              __path__  = "/var/jenkins_home/logs/build-events.log",
              master    = "ps3-k8s",
              fleet     = "percona-jenkins",
              role      = "master",
              component = "builds",
            }]
          }

          loki.source.file "build_events" {
            targets    = local.file_match.build_events.targets
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-distributor.loki.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

# ps3-k8s.cd.percona.com -- in-cluster ps3 controller.
#
# STAGE 2 (real-data clone): booting from the REAL ps3 JENKINS_HOME, restored from
# an app-consistent EBS snapshot of the fenced EC2 master, to validate plugins,
# upgrades, GitHub OAuth and real agent provisioning against ps3's actual config.
# The EC2 ps3 master is fenced (jenkins masked + :8080 down) so the in-cluster
# controller is the single writer. jenkins:-scoped overrides on values-base.yaml.
# Generated Application is MANUAL-SYNC (ADR 0025).
#
# yamllint disable rule:line-length
# ^ This file embeds a ~6650-line JCasC document (controller.JCasC.configScripts.ps3-clouds)
#   whose EC2 userData/initScript and Hetzner jvmOpts are long single-line scalars copied verbatim
#   from the live controller export. line-length is disabled file-wide for that reason.
jenkins:
  controller:
    # Alloy loopback sidecar (PS-11173 / metrics gap): scrape the Hetzner plugin's
    # /hetzner-prometheus endpoint and ship to Mimir. The endpoint enforces a
    # loopback-only peer check (HetznerPrometheusEndpoint 403s any non-127.0.0.1
    # caller), so a cluster ServiceMonitor over the pod IP yields up=1 with zero
    # hetzner_* samples. This in-pod Alloy scrapes over loopback (200) and
    # remote_writes to the in-cluster Mimir distributor, mirroring the EC2 fleet's
    # per-master Alloy (ADR 0013). Config = jenkins-ps3-k8s-alloy-metrics ConfigMap
    # (extraObjects below); volumes via persistence.volumes; master=ps3-k8s (ADR
    # 0013 A2 / CLAUDE.md #11). No probes, so a sidecar failure never gates the
    # controller's readiness.
    #
    # javaOpts is a scalar override, so the values-base.yaml value is replicated
    # here verbatim plus the percona-jenkins-stats build-events path:
    # /var/log/jenkins does not exist in the container image, while
    # /var/jenkins_home/logs is jenkins-writable, lives on the PVC, and is
    # tailed read-only by the alloy-metrics sidecar below.
    javaOpts: >-
      -Xms3072m -Xmx4096m -Xss4m -server
      -Djava.awt.headless=true
      -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=600
      -Dhetzner.rehydrate.enabled=true -Dhetzner.rehydrate.grace-period-minutes=5
      -Dpercona.stats.events-file=/var/jenkins_home/logs/build-events.log
    sidecars:
      additionalSidecarContainers:
        - name: alloy-metrics
          image: docker.io/grafana/alloy:v1.16.0
          args:
            - run
            - --server.http.listen-addr=127.0.0.1:12345
            - --storage.path=/tmp/alloy
            - --disable-reporting
            - /etc/alloy/config.alloy
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 473
          volumeMounts:
            - name: alloy-metrics-config
              mountPath: /etc/alloy
              readOnly: true
            - name: alloy-metrics-data
              mountPath: /tmp/alloy
            # Read-only home mount so the sidecar can tail the
            # percona-jenkins-stats build-events log on the PVC.
            - name: jenkins-home
              mountPath: /var/jenkins_home
              readOnly: true

    ingress:
      # Serve the REAL host ps3.cd.percona.com directly from the chart's PRIMARY
      # ingress. The primary renders a HOST-ONLY rule (no path condition), so it
      # matches every path including /login -- unlike a secondaryingress, whose
      # forced path-pattern only matched "/" and let /login fall through to the
      # proxy. One ingress, one host (ps3-k8s.cd dropped: it was dark-replica
      # scaffolding; ps3.cd is canonical and matches the restored config.xml
      # JENKINS_URL, so OAuth callbacks + agent JNLP URLs self-align).
      hostName: ps3.cd.percona.com
      # No certificate-arn: the ALB controller auto-discovers the wildcard
      # *.cd.percona.com ACM cert via SNI (keeps the cert ARN out of this repo).
      tls:
        - hosts:
            - ps3.cd.percona.com
      # group.order:-10 wins the ps3.cd host condition over the lower-priority
      # jenkins-ingress proxy rule during the cutover overlap (harmless once the
      # proxy ps3 entry is removed). Deep-merges with the ALB-group annotations
      # from values-base. external-dns publishes ps3.cd to the same ALB from the
      # host field, so the A record never changes (zero-gap handoff).
      annotations:
        alb.ingress.kubernetes.io/group.order: "-10"

    # === Phase 1 (ADR 0027 -- dynamic config) ================================
    # Replace the chart's default local-admin realm (which overwrote ps3's GitHub
    # OAuth on the restored disk) with ps3's real GithubSecurityRealm + matrix authz,
    # delivered as a hot-reloaded JCasC configScript. The OAuth client secret comes
    # from AWS Secrets Manager (jenkins/ps3/github-oauth) via the ExternalSecret
    # below -> k8s Secret -> projected at /run/secrets/additional -> JCasC
    # ${github-oauth-client-secret}. No secret on disk or in this repo.
    existingSecret: jenkins-ps3-k8s-oauth
    containerEnv:
      # Abort a JCasC reload if a referenced secret fails to resolve, instead of
      # silently blanking the OAuth secret and locking everyone out.
      - name: CASC_STRICT_SECRET_RESOLUTION
        value: "true"
    JCasC:
      # Suppress the chart's default local-admin securityRealm + authorizationStrategy
      # (they default truthy and are NOT gated by defaultConfig); ps3-security owns both.
      securityRealm: ""
      authorizationStrategy: ""
      configScripts:
        # aws-secrets-manager-credentials-provider: list only secrets under the ps3
        # namespace (server-side ListSecrets name-prefix filter, matched on the RAW
        # secret name), then strip that prefix so the credential id stays clean, e.g.
        # percona-ci-platform/jenkins/ps3/percona-slack-token -> percona-slack-token.
        # The filter runs before the transform, so it must use the full prefix.
        ps3-sm-provider: |
          unclassified:
            awsCredentialsProvider:
              listSecrets:
                filters:
                  - key: "name"
                    values:
                      - "percona-ci-platform/jenkins/ps3/"
              transformations:
                name:
                  removePrefix:
                    prefix: "percona-ci-platform/jenkins/ps3/"
        ps3-security: |
          jenkins:
            securityRealm:
              github:
                githubWebUri: "https://github.com"
                githubApiUri: "https://api.github.com"
                clientID: "85f036ccdd50140758ad"
                clientSecret: "${github-oauth-client-secret}"
                oauthScopes: "read:org,user:email"
            authorizationStrategy:
              globalMatrix:
                entries:
                  # Break-glass: a real GitHub login keeps admin even if a team
                  # (org*team) sid fails to resolve -- the only safety net, since
                  # globalMatrix has no first-user fallback.
                  - user:
                      name: "nogueiraanderson"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*build-engineers"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*iit"
                      permissions: ["hudson.model.Hudson.Administer"]
                  - group:
                      name: "percona*dev-ps"
                      permissions: &ps_power
                        - "hudson.model.Computer.Build"
                        - "hudson.model.Computer.Configure"
                        - "hudson.model.Computer.Connect"
                        - "hudson.model.Computer.Create"
                        - "hudson.model.Computer.Delete"
                        - "hudson.model.Computer.Disconnect"
                        - "hudson.model.Computer.Provision"
                        - "hudson.model.Hudson.Read"
                        - "hudson.model.Item.Build"
                        - "hudson.model.Item.Cancel"
                        - "hudson.model.Item.Configure"
                        - "hudson.model.Item.Create"
                        - "hudson.model.Item.Delete"
                        - "hudson.model.Item.Discover"
                        - "hudson.model.Item.Move"
                        - "hudson.model.Item.Read"
                        - "hudson.model.Item.Workspace"
                        - "hudson.model.Run.Delete"
                        - "hudson.model.Run.Replay"
                        - "hudson.model.Run.Update"
                        - "hudson.model.View.Configure"
                        - "hudson.model.View.Create"
                        - "hudson.model.View.Delete"
                        - "hudson.model.View.Read"
                  - group:
                      name: "percona*QA-ps"
                      permissions: *ps_power
                  - group:
                      name: "percona*doc"
                      permissions:
                        - "hudson.model.Computer.Build"
                        - "hudson.model.Computer.Connect"
                        - "hudson.model.Computer.Provision"
                        - "hudson.model.Hudson.Read"
                        - "hudson.model.Item.Build"
                        - "hudson.model.Item.Cancel"
                        - "hudson.model.Item.Discover"
                        - "hudson.model.Item.Read"
                        - "hudson.model.Item.Workspace"
                        - "hudson.model.View.Read"
        # EC2 worker iamInstanceProfile ARNs derive the AWS account id from the
        # injected controller.image.registry (jenkins-masters ApplicationSet
        # helm-param, from the aws_account_id cluster-secret annotation) via the
        # subchart's tpl pass, so the account id is NOT committed here. Mirrors the
        # registry placeholder convention in values-base.yaml.
        ps3-clouds: |
          jenkins:
            clouds:
            - hetzner:
                credentialsId: htz.cd.token
                instanceCapStr: '100'
                name: ps3-htz
                serverTemplates:
                - bootDeadline: 8
                  connectivity: both
                  connector:
                    root:
                      connectionMethod: public
                      sshCredentialsId: htz.cd.key
                  image: '114690387'
                  jvmOpts: -Xms4g -Xmx16g -Xss4m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
                  labelStr: docker-x64-min docker-deb12-x64-min deb12-x64-min
                  location: nbg1
                  name: deb12-x64-nbg1-min
                  network: '10442325'
                  primaryIp: default
                  remoteFs: /mnt/jenkins/
                  serverType: cpx42
                  shutdownPolicy:
                    idle:
                      idleMinutes: 10
                  userData: |
                    #!/bin/bash -x
                        set -o xtrace
                        # Force IPv4 early (Hetzner -> Cloudflare CDN IPv6 routing is intermittently broken, see PKG-1325)
                        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
                        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
                        sudo sysctl -w net.ipv6.conf.eth0.disable_ipv6=1 || true
                        echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf
                        echo -e "nameserver 9.9.9.9
                    nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
                        echo '10.30.6.9 repo.ci.percona.com' | sudo tee -a /etc/hosts
                        sudo install -o $(id -u -n) -g $(id -g -n) -d /mnt/jenkins
                        sudo fallocate -l 32G /swapfile
                        sudo chmod 600 /swapfile
                        sudo mkswap /swapfile
                        sudo swapon /swapfile

                        # Pin apt to deb.debian.org (avoid Hetzner mirror lottery, see PKG-1323/PKG-1324)
                        sudo tee /etc/apt/sources.list > /dev/null <<'APT_EOF'
                    deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
                    deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
                    deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
                    deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
                    APT_EOF

                        export DEBIAN_FRONTEND=noninteractive
                        until sudo apt-get update; do
                            sleep 1
                            echo try again
                        done
                        until sudo apt-get -y install openjdk-17-jre-headless apt-transport-https ca-certificates curl gnupg lsb-release unzip git qemu-user-static binfmt-support; do
                            sleep 1
                            echo try again
                        done
                        curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
                        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
                        until sudo apt-get update; do
                            sleep 1
                            echo try again
                        done
                        until sudo apt-get -y install docker-ce docker-ce-cli containerd.io; do
                            sleep 1
                            echo try again
                        done
                        if ! $(aws --version | grep -q 'aws-cli/2'); then
                            find /tmp -maxdepth 1 -name "*aws*" | xargs sudo rm -rf
                            until curl "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m)-2.22.35.zip" -o "/tmp/awscliv2.zip"; do
                                sleep 1
                                echo try again
                            done
                            unzip -o /tmp/awscliv2.zip -d /tmp
                            cd /tmp/aws && sudo ./install
                        fi
                        sudo sysctl net.ipv4.tcp_fin_timeout=15
                        sudo sysctl net.ipv4.tcp_tw_reuse=1
                        sudo sysctl net.ipv6.conf.all.disable_ipv6=1
                        sudo sysctl net.ipv6.conf.default.disable_ipv6=1
                        sudo sysctl -w fs.inotify.max_user_watches=10000000 || true
                        sudo sysctl -w fs.aio-max-nr=1048576 || true
                        sudo sysctl -w fs.file-max=6815744 || true
                        echo "*  soft  core  unlimited" | sudo tee -a /etc/security/limits.conf
                        sudo sed -i.bak -e 's^ExecStart=.*^ExecStart=/usr/bin/dockerd --data-root=/mnt/docker --default-ulimit nofile=900000:900000^' /lib/systemd/system/docker.service
                        sudo systemctl daemon-reload
                        sudo install -o root -g root -d /mnt/docker
                        sudo usermod -aG docker $(id -u -n)
                        sudo mkdir -p /etc/docker
                        echo '{"experimental": true, "ipv6": true, "fixed-cidr-v6": "fd3c:a8b0:18eb:5c06::/64"}' | sudo tee /etc/docker/daemon.json
                        sudo systemctl restart docker

# ps3-k8s.cd.percona.com -- first Jenkins controller to run in-cluster (the pilot).
#
# ENABLED as a FRESH-PVC dark replica (Stage 1): comes up on an EMPTY JENKINS_HOME
# (the baked image seeds plugins) with NO production traffic, to prove the
# substrate wiring end-to-end: node pool placement, Pod Identity -> EC2-plugin AWS
# creds, ALB + wildcard ACM (SNI) + external-dns, and the JNLP agent listener.
# Production ps3.cd.percona.com keeps serving on EC2 throughout. The snapshot-seed
# of the real ps3 JENKINS_HOME (runbooks/migrate-ps3-to-eks.md) and the DNS cutover
# are LATER, separately-gated steps -- until then existingClaim stays unset.
# Generated Application is MANUAL-SYNC (ADR 0025). These are jenkins:-scoped
# overrides layered on values-base.yaml.
jenkins:
  controller:
    ingress:
      hostName: ps3-k8s.cd.percona.com
      # No certificate-arn: the AWS Load Balancer Controller auto-discovers the
      # wildcard *.cd.percona.com ACM cert via SNI from the Ingress host (same as
      # the jenkins-ingress proxy). Keeps the cert ARN (account id) out of this
      # public repo; the whole jenkins-masters ALB group stays on discovery.
      tls:
        - hosts:
            - ps3-k8s.cd.percona.com
  persistence:
    # Fresh (throwaway) PVC for the dark-replica boot test: empty JENKINS_HOME,
    # baked image seeds plugins. Pre-binding to a volume restored from the EC2 ps3
    # cross-region EBS snapshot (us-east-1a, runbooks/migrate-ps3-to-eks.md) is the
    # later seed step; set existingClaim then.
    storageClass: gp3-jenkins-1a-retain
    size: 100Gi
    # existingClaim: ps3-k8s-jenkins-home

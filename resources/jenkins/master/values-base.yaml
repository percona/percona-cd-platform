# Per-instance Jenkins controller -- BASE values (merged with instances/<host>/values.yaml).
#
# This chart is a thin wrapper over the upstream `jenkins` subchart (Chart.yaml
# dependency, charts.jenkins.io 5.9.18). EVERYTHING the subchart consumes MUST be
# nested under the `jenkins:` key (the dependency name) -- top-level keys are
# ignored by the subchart (the old top-level `controller:` was the reason ps3-k8s
# came up as chart defaults). Host-specific values (ingress host, ACM cert,
# pre-bound PVC) live in instances/<host>/values.yaml, also under `jenkins:`.
jenkins:
  controller:
    image:
      # Canonical controller image: us-east-1 ECR, percona-cd/jenkins-percona
      # (TIER 5 ecr.tf). Built + pushed by build-jenkins-image.yml. The registry
      # account id is injected at deploy by the jenkins-masters ApplicationSet
      # (helm.parameters, from the aws_account_id cluster-secret annotation), so it
      # is NOT committed to this public repo; the placeholder below is only what
      # the creds-free helm-render CI check sees.
      registry: "<account-id>.dkr.ecr.us-east-1.amazonaws.com"
      repository: percona-cd/jenkins-percona
      # Immutable SHA-tag <lts>-<gitsha> from the publish job (ECR repo is
      # IMMUTABLE so the tag cannot be overwritten). A digest bump is a
      # deliberate, windowed, human-merged PR per ADR 0025. This is the HYBRID
      # image (forks forced via .override, community soft); this tag carries the
      # refreshed forks hetzner-cloud 103.percona.27 + ec2 5.24.percona.3 (PR #71).
      tag: "2.541.3-1a9e848fc33ef9d308d1d0900d7dcb663c0d65ff"
      pullPolicy: IfNotPresent

    # Plugins are BAKED into the image (community via plugins.txt; the 2 Percona
    # forks force-installed via .override -- Hybrid policy). Never download at
    # startup, never let the chart re-install over the baked set.
    installPlugins: false
    overwritePluginsFromImage: false
    initializeOnce: true

    javaOpts: >-
      -Xms3072m -Xmx4096m -Xss4m -server
      -Djava.awt.headless=true
      -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=600

    resources:
      requests:
        cpu: "1000m"
        memory: "4Gi"
      limits:
        cpu: "4000m"
        memory: "6Gi"

    serviceType: ClusterIP
    numExecutors: 1
    executorMode: "EXCLUSIVE"

    # Startup budget (configurable, override per-instance for an unusually large
    # home). A restored-home master (real JENKINS_HOME: jobs, plugins, fingerprints,
    # build history) takes well over the chart default 120s (failureThreshold 12 x
    # periodSeconds 10) to finish starting and serve /login 200, so the kubelet was
    # killing it mid-boot and BackOff-looping. 120 x 10s = 20 min gives any migrated
    # master room to start; the liveness probe (50s) governs once it is up.
    probes:
      startupProbe:
        failureThreshold: 120

    # Inbound JNLP listener so external EC2 + Hetzner agents reconnect.
    # internet-facing because Hetzner agents are outside the VPC.
    agentListenerPort: 50000
    agentListenerServiceType: LoadBalancer
    agentListenerServiceAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "iit-billing-tag=percona-ci-platform"

    # Pin the singleton controller to its dedicated on-demand single-AZ node pool
    # (substrate: terraform recreates this node group with the taint). Placement
    # is the real anti-disruption guard (ADR 0023), not do-not-disrupt alone.
    nodeSelector:
      workload.percona.com/tier: jenkins-master
    tolerations:
      - key: workload.percona.com/tier
        operator: Equal
        value: jenkins-master
        effect: NoSchedule

    # ALB ingress; hostName + certificate-arn come from instances/<host>/.
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/group.name: jenkins-masters
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
        alb.ingress.kubernetes.io/healthcheck-path: /login
        alb.ingress.kubernetes.io/tags: "iit-billing-tag=percona-ci-platform"

    # JCasC OFF for the dark-replica stage: the PVC (restored from a real EC2
    # JENKINS_HOME snapshot) is the source of truth for config/jobs/credentials.
    # TIER 8 (reproducibility) later moves clouds/templates/labels to a per-host
    # JCasC ConfigMap.
    JCasC:
      defaultConfig: false
      overwriteConfiguration: false

    podLabels:
      iit-billing-tag: percona-ci-platform

  persistence:
    enabled: true
    # AZ-pinned Retain StorageClass (reclaimPolicy: Retain). The per-host PVC is
    # seeded from a real EC2 EBS snapshot; a host may pre-bind via existingClaim.
    storageClass: gp3-jenkins-1a-retain
    size: 100Gi

  serviceAccount:
    # The chart creates this SA; the substrate's EKS Pod Identity association
    # (terraform/pod-identity.tf) binds AWS creds to it on (cluster, namespace
    # jenkins-<host>, sa jenkins) so the EC2 plugin resolves creds in-pod. Pod
    # Identity needs no SA annotation (unlike IRSA), so a plain chart-created SA
    # suffices; the association itself does NOT create the ServiceAccount.
    create: true
    name: jenkins

  # External EC2 + Hetzner agents only; no in-cluster Kubernetes pod agents.
  agent:
    enabled: false

# Mirror of `just ci`. Local hooks must stay in sync with .github/workflows/ci.yml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.1
    hooks:
      - id: terraform_fmt
      # terraform_validate shells the `terraform` binary, NOT tofu, and only
      # fires when .tf files are staged. An old local install (e.g. Terraform
      # 1.5.7) fails the repo's required_version >= 1.11 and blocks the
      # commit. The real gate is `just tf-validate` (tofu); after `just ci`
      # passes, `git commit --no-verify` is the sanctioned workaround.
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        files: ^(argocd-bootstrap|resources|\.github)/.*\.ya?ml$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Local hooks. tflint is intentionally NOT run: its terraform plugin can't
  # parse this repo's OpenTofu 1.8+ early-eval module sourcing (see the justfile
  # tf-validate comment and .github/workflows/ci.yml). trivy and zizmor upstreams
  # ship no .pre-commit-hooks.yaml by design (aquasecurity/trivy#6368), so they
  # run via the canonical justfile recipes — the single source of truth shared
  # with `just ci`. A manifest-less remote repo here breaks loading of ALL hooks.
  - repo: local
    hooks:
      - id: trivy-config
        name: trivy config scan (mirrors `just tf-trivy`)
        entry: just tf-trivy
        language: system
        pass_filenames: false
        files: ^terraform/.*\.tf$
      - id: zizmor
        name: zizmor GitHub Actions audit (mirrors `just zizmor`)
        entry: just zizmor
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      # ADR 0029: keep each master's committed JCasC clouds configScript in sync with
      # the shared catalog and free of YAML anchors/aliases (JCasC SnakeYAML caps at 50).
      - id: clouds-render-check
        name: clouds-catalog drift + no-alias check (ADR 0029)
        entry: uv run --locked cdpctl clouds check
        language: system
        pass_filenames: false
        files: ^(resources/jenkins/clouds-catalog/|resources/jenkins/master/instances/.*/values\.yaml|src/cdpctl/|pyproject\.toml|uv\.lock)
